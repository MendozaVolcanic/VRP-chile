name: Tests

# S124 — red de seguridad que faltaba. Hasta ahora ningun workflow corria pytest:
# la unica proteccion contra una regresion era acordarse de correr la suite a mano
# antes de mergear (regla A39). Con 835 tests ya escritos, eso es dejar valor
# sobre la mesa — y varias lecciones del proyecto (A49 la insercion que se comio
# un `return`, A50 el "pre-existing fail" que era regresion) son exactamente lo
# que un CI habria atrapado el mismo dia.
#
# Corre en PRs y en push a main. NO toca datos ni credenciales: los tests mockean
# la red (no hay secrets acá a proposito).
# A43: "on" quoted (Norway Problem YAML 1.1).
"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Por rama: un push nuevo cancela el chequeo viejo de ESA rama, que ya no
  # interesa. `cancel-in-progress: true` es correcto aca (a diferencia de los
  # workflows que pushean a main, donde cancelar dejaria un push a medias).
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04  # S150: fijado; ubuntu-latest migra a 26.04 entre 2026-10-19 y 2026-11-19 (runner-images #14748). Cambiar despues de probar pyhdf en 26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          # libhdf4 + pyhdf solo para que `import pipeline.process_modis` no
          # falle en la recoleccion. Los tests no leen HDF real.
          sudo apt-get update -qq && sudo apt-get install -y -qq libhdf4-dev
          pip install -r requirements.txt
          pip install pytest
      - name: Run suite
        run: |
          # -W always::RuntimeWarning: los warnings numericos (overflow, divide,
          # invalid) son la firma temprana de los bugs de NaN/cero que perseguimos
          # en las formulas fisicas. Que aparezcan en el log del PR.
          # La batería del lector de V750-A corre en su propio job (abajo), en paralelo con éste.
          python -m pytest tests/ -q -W always::RuntimeWarning --ignore=tests/test_bateria_lector_v750a_s174.py

  # S174 (VPR953-04): la batería del lector de la sombra de V750-A (experiments/_s162_v750a/probar_evaluar_v750a.py,
  # que decide si VIIRS 750 de producción cambia de detector) y un subconjunto barato de su medidor de mutaciones.
  # Antes sólo se corría a mano y el CI verde no la vigilaba. Job propio para no empujar el de arriba a su timeout:
  # la batería entera son más de 100 corridas del lector, en grupos paralelos.
  bateria-v750a:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      # S174 (VPR953-04): la batería del lector de la sombra de V750-A (tests/test_bateria_lector_v750a_s174.py) corta
      # la lectura en commits reales de main (git merge-base --is-ancestor, git show -s). El checkout es de
      # profundidad 1; este paso baja la historia de commits de main SIN árboles ni blobs (unos 4 MB, no los cientos
      # de MB de los datos NRT) y sin tags, así que las pruebas que se saltan sin un tag siguen igual.
      # OJO (VPR954-04): --unshallow exige un clon superficial. Si alguien pone `fetch-depth: 0` en el checkout de
      # arriba, git sale con «fatal: --unshallow on a complete repository does not make sense» y el job queda rojo
      # antes de probar nada (falso rojo, no falso verde): en ese caso este paso sobra y se quita.
      - name: Historia de commits de main (sin árboles ni blobs)
        run: |
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter tree:0
          git fetch --no-tags --filter=tree:0 --unshallow origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          sudo apt-get update -qq && sudo apt-get install -y -qq libhdf4-dev
          pip install -r requirements.txt
          pip install pytest
      - name: Bateria del lector V750-A
        run: |
          node --version
          python -m pytest tests/test_bateria_lector_v750a_s174.py -v -s -W always::RuntimeWarning
