name: NRT Monitor — alerta si fallan 3+ corridas

# M3 instalado S18 2026-04-24 a pedido de Nicolás (auditoría meta).
# Si el cron NRT principal falla 3 corridas consecutivas, abre un issue
# automático en el repo. Sin esto, una caída del cron solo se notaba viendo
# que el dashboard se quedaba viejo — falta de alerta proactiva.

# A43 (S103): key quoteada como "on" para evitar el "Norway problem" de YAML 1.1
# (on/off/yes/no/true/false sin comillas parsean como booleano → HTTP 422 en
# workflow_dispatch). Ver CLAUDE.md proyecto, sección GH Actions YAML 1.1.
"on":
  schedule:
    # Corre cada 6 horas, offsetted (minuto 30) para no chocar con el cron principal (minuto 0).
    - cron: "30 */6 * * *"
  workflow_dispatch:  # permite correr a mano para testear.

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # S150: la decision vive en scripts/nrt_monitor_decision.js (probada en
      # tests/test_nrt_monitor_decision_s150.py); hace falta el repo en disco para cargarla.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/nrt_monitor_decision.js
          sparse-checkout-cone-mode: false
      - name: Inspeccionar últimas 3 corridas del cron NRT
        uses: actions/github-script@v7
        with:
          script: |
            // S150 (auditoria S150, A-2): sin filtro por evento (el cron externo despacha
            // workflow_dispatch) y pidiendo mas de 3, porque la API puede devolverlas desordenadas o
            // viejas; la funcion ordena, toma las 3 mas nuevas y se niega a decidir si son viejas.
            const { decidir } = require(`${process.env.GITHUB_WORKSPACE}/scripts/nrt_monitor_decision.js`);
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'nrt.yml',
              per_page: 20,
              status: 'completed',
            });

            const d = decidir(data.workflow_runs || [], Date.now(), 12);
            const runs = d.usadas;
            console.log(`Decision: ${d.accion} (${d.motivo})`);
            runs.forEach(r => console.log(`  ${r.created_at} [${r.event}] → ${r.conclusion} (${r.html_url})`));

            if (d.accion === 'sin_dato') {
              console.log('SIN DATO: no se alerta ni se cierra nada.');
              return;
            }

            const TITLE = 'NRT cron: 3+ corridas consecutivas fallaron';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nrt-alert',
              per_page: 20,
            });
            const abierto = existing.data.find(i => i.title === TITLE);

            const failures = runs.filter(r => r.conclusion === 'failure' || r.conclusion === 'timed_out');
            if (d.accion !== 'alerta') {
              console.log(`Solo ${failures.length}/${runs.length} fallaron — sin alerta.`);
              // S123: señal de RECUPERACIÓN. Si las 3 últimas salieron verdes y
              // quedó un issue abierto, cerrarlo. Sin esto el issue queda en rojo
              // para siempre y deja de significar algo: #336 lleva abierto desde
              // el 2026-06-04 con 58 comentarios, atravesando varias caídas y
              // recuperaciones. El rojo permanente es indistinguible del ruido.
              if (abierto && d.accion === 'recuperado') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: abierto.number,
                  body: '## ✅ Recuperado\n\nLas 3 últimas corridas del cron NRT salieron verdes:\n\n' +
                    runs.map(r => `- [${r.created_at}](${r.html_url}): ${r.conclusion}`).join('\n') +
                    '\n\nCierro automáticamente.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: abierto.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                console.log(`Issue #${abierto.number} cerrado: cron recuperado.`);
              }
              return;
            }

            console.log('Las 3 últimas corridas fallaron — buscando issue abierto existente...');

            if (abierto) {
              // S123: EDITAR el cuerpo en vez de comentar. Un comentario notifica;
              // una edición no. El monitor corre cada 6 h, así que comentar cada
              // vez producía 4 avisos diarios que repetían el mismo hecho — en la
              // caída de julio fueron 58 comentarios sobre un incidente ya
              // reportado. El estado queda igual de visible en el cuerpo del issue.
              const cuerpo = 'Estado al ' + new Date().toISOString() + ' — las últimas corridas siguen fallando:\n\n' +
                failures.map(r => `- [${r.created_at}](${r.html_url}): ${r.conclusion}`).join('\n') +
                '\n\n(Este cuerpo se refresca en cada chequeo sin notificar. El escalonamiento ' +
                'por antigüedad del dato lo lleva `nrt-healthcheck.yml`.)';
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: abierto.number,
                body: cuerpo,
              });
              console.log(`Issue #${abierto.number} — cuerpo actualizado, sin notificar.`);
              return;
            }

            const body = '**Alerta automática del NRT monitor**.\n\n' +
              `Las últimas ${failures.length} corridas del cron \`nrt.yml\` fallaron:\n\n` +
              failures.map(r => `- [${r.created_at}](${r.html_url}): ${r.conclusion}`).join('\n') +
              '\n\nVerificar:\n' +
              '1. ¿Cambió algo en el último merge a `main`?\n' +
              '2. ¿NASA Earthdata (CMR / LANCE) está caído? (https://lance.modaps.eosdis.nasa.gov/)\n' +
              '3. ¿El secreto `EARTHDATA_TOKEN` venció? (dura 60 días; el issue de nrt-healthcheck avisa con 10 días. El par usuario y clave NO sirve de respaldo: está vencido, A71)\n' +
              '4. ¿Algún test rompiendo? (ver `pytest tests/`)\n\n' +
              'Generado por `.github/workflows/nrt-monitor.yml`.';

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: TITLE,
              body: body,
              labels: ['nrt-alert', 'priority-high'],
            });
            console.log(`Issue #${created.data.number} creado.`);
