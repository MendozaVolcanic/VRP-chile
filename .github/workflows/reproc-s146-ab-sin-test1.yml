name: "A/B S146: sin el Test 1 integrado en el ROI (tres brazos, once Tier A, tres sensores)"

# EL FENOMENO. De noche el sensor mide cuanto brilla cada pixel en el infrarrojo medio (MIR,
# sensible a un punto muy caliente aunque ocupe una fraccion del pixel) y cuanto en el termico
# (TIR, la temperatura promedio del terreno). Hay dos maneras fisicamente distintas de decir que
# el crater esta caliente: que UN pixel se despegue de sus ocho vecinos en el indice que cruza MIR
# con TIR (los Tests 2 y 3 del paper de MIROVA), o que la SUMA del exceso de MIR de todo el disco
# de 3 km supere a su anillo de fondo (el Test 1 integrado, que es un detector nuestro y no esta
# en el paper). Este A/B mide cuanto de lo que publicamos donde MIROVA no vio nada lo sostiene el
# segundo, y cuanto recall se perderia al apagarlo.
#
# BRAZOS (perfiles aislados, cada uno con su data_subdir; A47):
#   _s146_ab_control                 produccion de hoy, reprocesada con el mismo codigo
#   _s146_ab_sin_test1               enable_test1_path: false
#   _s146_ab_sin_prioridad_debil     enable_test1_priority_weak_cluster: false
#
# NO DESPACHAR sin el pre-registro aprobado: experiments/_s146_ab_sin_test1/PREREGISTRO.md, con
# sus umbrales congelados en parametros.json, commiteados ANTES de la primera corrida. El candado
# de abajo (preregistro_aprobado) impide que este workflow corra sin ese "si" explicito.
#
# NO COMMITEA A main. Cada brazo escribe en su data_subdir aislado; las salidas salen por dos
# caminos a la vez, porque los artefactos caducan a los 90 dias y en este proyecto ya se perdieron
# salidas asi: (a) artefacto por job, (b) rama propia de la corrida, s146-ab/<run_id>.
#
# A43: la clave "on" va entre comillas (Norway Problem de YAML 1.1).
# A71: se autentica SOLO con EARTHDATA_TOKEN. El par usuario y clave de los secretos esta vencido
#      y su reintento de login BLOQUEO la cuenta 10 minutos. Sin token, el job falla al instante.
# A15: timeout >= 1,3 veces la duracion esperada. Desde S157 todos los brazos van en el mismo job, el
#      paso de reproceso tiene 170 min y el trozo de ventana se dimensiona para caber
#      (scripts/reproc_brazos.py::dias_por_trozo).
"on":
  workflow_dispatch:
    inputs:
      preregistro_aprobado:
        description: "Escribe si SOLO con experiments/_s146_ab_sin_test1/PREREGISTRO.md aprobado por Nicolas y su verificador"
        required: true
        default: "no"
      start:
        description: "Inicio YYYY-MM-DD (fijo por pre-registro: 2026-09-01)"
        required: true
        default: "2026-09-01"
      end:
        description: "Fin YYYY-MM-DD inclusive (fijo por pre-registro: 2026-09-20)"
        required: true
        default: "2026-09-20"
      vols:
        description: 'Lista JSON de volcanes. La lista corta sirve para REPETIR un job que quedo con pasadas de menos por un corte de NASA'
        required: true
        default: '["Lascar","Lastarria","Isluga","Tupungatito","PlanchonPeteroa","NevadosDeChillan","Llaima","Villarrica","Copahue","PuyehueCordonCaulle","Chaiten"]'
      brazos:
        description: 'Lista JSON de brazos'
        required: true
        default: '["_s146_ab_control","_s146_ab_sin_test1","_s146_ab_sin_prioridad_debil"]'
      control:
        description: 'Brazo que hace de control al contar cobertura en recolectar. Para los A/B de S147 (conectiva, caja) es _s146_ab_sin_test1'
        required: true
        default: "_s146_ab_control"
      max_days:
        description: 'S157: dias por trozo. Vacio = scripts/reproc_brazos.py::dias_por_trozo(n_brazos), que cabe en 170 min por paso'
        required: false
        default: ""

# No entra al grupo push-main: este workflow no pushea a main. Se serializa consigo mismo para
# que dos corridas no se pisen la rama de salida.
concurrency:
  group: s146-ab-sin-test1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # S157: los brazos de un A/B comparten volcan y ventana, asi que corren en el MISMO job (scripts/reproc_brazos.py):
  # cada busqueda a CMR y cada granulo se hacen una sola vez y solo el procesamiento se repite por brazo
  # (experiments/_s157_busqueda_ventana/MEDICION.md). Para que todos quepan en el paso de 170 min (A15), la ventana se
  # parte en trozos de dias_por_trozo(n_brazos) dias (40 con 1 brazo, 23 con 2, 16 con 3); la entrada max_days lo fija
  # a mano si hace falta. Matrix volcan por trozo; recolectar une los trozos de cada brazo (scripts/unir_trozos_ab.py).
  plan:
    if: github.event.inputs.preregistro_aprobado == 'si'
    runs-on: ubuntu-24.04  # S150: fijado; ubuntu-latest migra a 26.04 entre 2026-10-19 y 2026-11-19 (runner-images #14748). Cambiar despues de probar pyhdf en 26.04
    outputs:
      jobs: ${{ steps.split.outputs.jobs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Trozos de la ventana
        id: split
        env:
          ARM_START: ${{ github.event.inputs.start }}
          ARM_END: ${{ github.event.inputs.end }}
          ARM_VOLS: ${{ github.event.inputs.vols }}
          ARM_BRAZOS: ${{ github.event.inputs.brazos }}
          ARM_MAX_DAYS: ${{ github.event.inputs.max_days }}
        run: |
          set -euo pipefail
          python scripts/plan_trozos_ab.py >> "$GITHUB_OUTPUT"

  reproc:
    needs: plan
    if: github.event.inputs.preregistro_aprobado == 'si'
    runs-on: ubuntu-24.04  # S150: fijado; ubuntu-latest migra a 26.04 entre 2026-10-19 y 2026-11-19 (runner-images #14748). Cambiar despues de probar pyhdf en 26.04
    # 170 del paso de reproceso mas ~15 de checkout, apt-get, pip, flags y subida (verificador S157: con 180 la
    # subida del artefacto podia caer si el paso agotaba sus 170).
    timeout-minutes: 200
    strategy:
      fail-fast: false
      # Un volcan y un trozo por job, con todos los brazos adentro EN SERIE: cada brazo escribe en su propio
      # data_subdir y nunca dos procesos a la vez (A47). max-parallel 6 deja lugar al cron NRT dentro del tope de
      # 20 jobs concurrentes y no satura a NASA.
      max-parallel: 6
      matrix:
        job: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Credenciales presentes (un secreto ausente se resuelve a string vacio, no a error)
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$EARTHDATA_TOKEN" ]; then
            echo "::error::EARTHDATA_TOKEN vacio. Sin token no se mide nada, y el login por usuario y clave con la credencial vencida bloquea la cuenta (A71). No se reintenta."
            exit 1
          fi
          echo "credenciales presentes"

      - name: Dependencias
        run: |
          set -euo pipefail
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml

      - name: Cada brazo LEE lo que declara (y escribe donde declara)
        env:
          ARM_BRAZOS: ${{ github.event.inputs.brazos }}
          ARM_VOLCANO: ${{ matrix.job.vol }}
        run: |
          set -euo pipefail
          mkdir -p logs
          for ARM_PROFILE in $(python -c "import json, os; print(' '.join(json.loads(os.environ['ARM_BRAZOS'])))"); do
            VRP_PROFILE="$ARM_PROFILE" python -c "import pipeline.profile as p; \
              print('brazo', p.PROFILE_NAME, \
              '| test1_path', p.ENABLE_TEST1_PATH, \
              '| prioridad_debil', p.ENABLE_TEST1_PRIORITY_WEAK_CLUSTER, \
              '| conectiva_prosa', p.ENABLE_TESTS_23_PROSE_BRANCH, \
              '| caja_roi1', p.ENABLE_ROI1_BOX_PAPER, \
              '| modis_b22', p.ENABLE_MODIS_B22_PRIMARY, \
              '| etiqueta_modis_cumulo', p.ENABLE_MODIS_DISTANCE_CLASS_FROM_CLUSTER, \
              '| tope_d9_mw', p.PATH_D_ONLY_CAP_MW, \
              '| sensores', p.SENSOR_MODIS, p.SENSOR_VIIRS_375, p.SENSOR_VIIRS_750, \
              '| subdir', p.DATA_SUBDIR); \
              assert p.DATA_SUBDIR == p.PROFILE_NAME, 'el brazo escribiria fuera de su subdir'"
            # S150 (verificador del pre-registro de NdC, N3): la primera linea del log de cada brazo deja escrito que
            # flags LEYO, para que el evaluador compruebe el cableado desde el artefacto.
            # S151 (tarea 1.4): ENABLE_VENT_ANCHORED_CLUSTERING. S151 (tarea 1.7): ENABLE_ROI1_BOX_PAPER y ROI1_BOX_HALF_KM.
            VRP_PROFILE="$ARM_PROFILE" python -c "import json, pipeline.profile as p; print('FLAGS_BRAZO ' + json.dumps({k: getattr(p, k) for k in ('PROFILE_NAME', 'DATA_SUBDIR', 'ENABLE_TEST1_PATH', 'ENABLE_TESTS_23_PROSE_BRANCH', 'ENABLE_MODIS_B22_PRIMARY', 'ENABLE_MODIS_DISTANCE_CLASS_FROM_CLUSTER', 'PATH_D_ONLY_CAP_MW', 'ENABLE_TESTS_23_NO_BT_GATE_VIIRS375', 'ENABLE_VENT_ANCHORED_CLUSTERING', 'ENABLE_ROI1_BOX_PAPER', 'ROI1_BOX_HALF_KM')}))" | grep '^FLAGS_BRAZO ' > "logs/${ARM_PROFILE}_${ARM_VOLCANO}.log"
          done

      - name: Reproceso de todos los brazos (una busqueda y una descarga por granulo)
        env:
          # Solo el token (A71). Ni EARTHDATA_USERNAME ni EARTHDATA_PASSWORD entran al entorno.
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          # Las entradas viajan por env y NO se interpolan dentro del run (S128).
          ARM_START: ${{ matrix.job.start }}
          ARM_END: ${{ matrix.job.end }}
          ARM_BRAZOS: ${{ github.event.inputs.brazos }}
          ARM_VOLCANO: ${{ matrix.job.vol }}
        timeout-minutes: 170
        run: |
          set -euo pipefail
          PERFILES=$(python -c "import json, os; print(','.join(json.loads(os.environ['ARM_BRAZOS'])))")
          # --estricto-cobertura: si una busqueda o descarga no se pudo hacer, el job sale rojo (codigo 3) en vez de
          # verde con pasadas de menos (A108, MEDICION.md seccion 3). La salida se sube igual (if: always()) y
          # recolectar cuenta la cobertura.
          python scripts/reproc_brazos.py \
            --volcano "$ARM_VOLCANO" --start "$ARM_START" --end "$ARM_END" \
            --perfiles "$PERFILES" --trabajo "$RUNNER_TEMP/brazos" --logs logs \
            --overwrite --estricto-cobertura --cobertura-json "cobertura/cobertura_${ARM_VOLCANO}.json"

      - name: Juntar la salida del trozo
        if: always()
        env:
          ARM_BRAZOS: ${{ github.event.inputs.brazos }}
          ARM_VOLCANO: ${{ matrix.job.vol }}
        run: |
          set -euo pipefail
          mkdir -p salida/logs salida/cobertura
          for ARM_PROFILE in $(python -c "import json, os; print(' '.join(json.loads(os.environ['ARM_BRAZOS'])))"); do
            if [ -f "data/$ARM_PROFILE/$ARM_VOLCANO.json" ]; then
              mkdir -p "salida/data/$ARM_PROFILE" && cp "data/$ARM_PROFILE/$ARM_VOLCANO.json" "salida/data/$ARM_PROFILE/"
            fi
          done
          cp logs/*.log salida/logs/ 2>/dev/null || true
          cp cobertura/*.json salida/cobertura/ 2>/dev/null || true
          find salida -type f | sort

      - name: Subir la salida del trozo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s146ab-${{ matrix.job.vol }}-${{ matrix.job.idx }}-${{ matrix.job.start }}_${{ matrix.job.end }}
          path: salida
          retention-days: 90
          if-no-files-found: error

  recolectar:
    needs: [plan, reproc]
    if: always() && github.event.inputs.preregistro_aprobado == 'si'
    runs-on: ubuntu-24.04  # S150: fijado; ubuntu-latest migra a 26.04 entre 2026-10-19 y 2026-11-19 (runner-images #14748). Cambiar despues de probar pyhdf en 26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias minimas
        run: pip install pyyaml

      - name: Bajar los artefactos de todos los trozos
        # S157: SIN merge-multiple. Dos trozos del mismo brazo y volcan traen el mismo camino y se pisarian en
        # silencio; cada artefacto queda en recolectado/<nombre>/ y unir_trozos_ab.py los une.
        uses: actions/download-artifact@v4
        with:
          pattern: s146ab-*
          path: recolectado

      - name: Unir los trozos de cada brazo
        run: |
          set -euo pipefail
          python scripts/unir_trozos_ab.py recolectado salidas
          find salidas -name '*.json' | sort | sed -n '1,200p'

      - name: COBERTURA PAREJA antes de mirar nada (A108)
        env:
          ARM_START: ${{ github.event.inputs.start }}
          ARM_END: ${{ github.event.inputs.end }}
          ARM_CONTROL: ${{ github.event.inputs.control }}
        run: |
          set -euo pipefail
          set -o pipefail
          # S148. El control se elige por entrada y los brazos se derivan de lo que llego, en vez
          # de una lista fija: con la lista fija los brazos nuevos (conectiva, caja) nunca se
          # contaban, y un relanzamiento parcial (un solo brazo, para reparar un corte de NASA)
          # dejaba el job en rojo porque su control no estaba en la corrida. Un rojo que no es
          # falla del experimento ensena a ignorar los rojos. Si el control no vino, se avisa y
          # la cobertura se cuenta en local contra el control de la corrida original (A108).
          CONTROL="salidas/${ARM_CONTROL}"
          if [ ! -d "$CONTROL" ]; then
            echo "::warning::el control ${ARM_CONTROL} no esta en esta corrida (relanzamiento parcial): la cobertura NO se conto aca, contarla en local antes de evaluar"
            echo "COBERTURA NO CONTADA: el control ${ARM_CONTROL} no esta en esta corrida" | tee salidas/cobertura.txt
            exit 0
          fi
          ARGS=""
          for d in salidas/_*; do
            if [ -d "$d" ] && [ "$d" != "$CONTROL" ]; then ARGS="$ARGS --brazo $d"; fi
          done
          python experiments/_s146_ab_sin_test1/contar_pasadas.py \
            --control "$CONTROL" \
            --inicio "$ARM_START" --fin "$ARM_END" \
            --out salidas/cobertura.json \
            $ARGS 2>&1 | tee salidas/cobertura.txt

      - name: Publicar las salidas en una rama propia de esta corrida
        if: always()
        env:
          RAMA: s146-ab/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(ls -A salidas 2>/dev/null)" ]; then
            echo "::error::no llego ninguna salida: no hay nada que publicar"
            exit 1
          fi
          git checkout -b "$RAMA"
          mkdir -p "experiments/_s146_ab_sin_test1/salidas/${GITHUB_RUN_ID}"
          cp -r salidas/. "experiments/_s146_ab_sin_test1/salidas/${GITHUB_RUN_ID}/"
          git add -f "experiments/_s146_ab_sin_test1/salidas/${GITHUB_RUN_ID}"
          git commit -m "S146 A/B sin Test 1 integrado: salidas crudas de la corrida ${GITHUB_RUN_ID} (no toca main)"
          # Reintento propio. Este workflow NO pushea a main y por eso no entra al grupo
          # push-main (ocupado ~50 min de cada 2 h por el NRT, que ademas desplaza al run
          # encolado). El guard G4 de tests/test_guard_declarado_vs_efectivo_s131.py detecta
          # "git push" por texto y no distingue rama de main: el reintento lo satisface, pero
          # esta aca por su propia razon, que es que si el push se cae por red se pierde la
          # unica copia durable (el artefacto caduca).
          for attempt in 1 2 3 4 5; do
            if git push origin "$RAMA"; then
              echo "salidas en la rama $RAMA"
              exit 0
            fi
            echo "push fallido, intento $attempt"
            sleep $((attempt * 10))
          done
          echo "::error::no se pudo publicar la rama $RAMA en 5 intentos; queda el artefacto"
          exit 1

      - name: Subir tambien todo junto como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s146ab-todo
          path: salidas
          retention-days: 90
          if-no-files-found: error

      - name: Guard declarado contra efectivo (al final, sobre el arbol con los perfiles nuevos)
        if: always()
        run: |
          set -euo pipefail
          set -o pipefail
          pip install pytest
          python -m pytest tests/test_guard_declarado_vs_efectivo_s131.py -q 2>&1 | tee salidas/guard.txt
