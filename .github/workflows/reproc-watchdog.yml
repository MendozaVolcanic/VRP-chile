name: Reproc watchdog — avisa si un reproceso muere o se cuelga

# POR QUE EXISTE
# ==============
# El proyecto ya vigilaba el cron NRT (nrt-monitor.yml abre un issue si fallan 3
# corridas seguidas; nrt-healthcheck.yml detecta datos rancios). Ninguno de los dos
# miraba los REPROCESOS, que son los que corren horas y son justamente donde el
# modo de falla silencioso duele mas.
#
# En S129 un A/B de 15 jobs murio por timeout y nadie se entero durante seis horas,
# porque quien lo lanzo dijo "te aviso" sin dejar nada que avisara. Este workflow es
# ese algo.
#
# QUE MIRA
# ========
# Cada hora revisa los workflows cuyo nombre empieza con `reproc-` y abre un issue
# cuando encuentra: (a) una corrida fallida sin issue previo, o (b) una corrida en
# curso hace mas de 7 h — sobre el techo de 6 h por job de GitHub, o sea colgada.
#
# Cierra el issue solo cuando el mismo workflow vuelve a correr en verde.
#
# QUE NO MIRA (fix S133, issue #567)
# ==================================
# La lista de workflows sale de la API (`listRepoWorkflows`), y esa API devuelve
# tambien los que ya se BORRARON del repo: GitHub conserva la entidad para poder
# seguir mostrando su historial de corridas. Medido el 2026-09-03 sobre este repo,
# `reproc-f28-pp-saturation.yml` — archivo inexistente en `.github/workflows/` desde
# mayo — sigue apareciendo con `state: "active"` y su ultima corrida (fallida,
# 2026-05-23) hacia que el watchdog comentara la issue #567 una vez por hora, 22
# veces. Ese ruido es el dano real: tapa la alerta verdadera cuando llegue.
#
# Filtrar por `state == "active"` NO alcanza — la evidencia de arriba lo refuta.
# Por eso la fuente de verdad de "que existe" es el REPO, no la API: se listan los
# archivos reales de `.github/workflows` en la rama por defecto y se vigila solo la
# interseccion. Ademas se acotan las corridas a MAX_DIAS_ANTIGUEDAD, porque un A/B
# de una sola vez que fallo y nunca va a volver a correr en verde jamas cerraria su
# issue — mismo ruido perpetuo por otra puerta.

"on":
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: reproc-watchdog
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Revisar los reprocesos y avisar
        uses: actions/github-script@v7
        with:
          script: |
            const HORAS_COLGADO = 7;          // el techo de GitHub es 6 h por job
            const MAX_DIAS_ANTIGUEDAD = 14;   // mas viejo que esto ya no es accionable
            const TITULO = 'Reproc: corrida fallida o colgada';
            const { owner, repo } = context.repo;

            // --- SELECCION PURA (la testea tests/test_reproc_watchdog_vivos_s133.py;
            //     no mover los marcadores ni meter await aca adentro) ---
            function seleccionarVigilados(workflows, pathsEnRepo) {
              const vivos = new Set(pathsEnRepo);
              return workflows.filter(w => w.path.includes('/reproc-')
                                        && !w.path.includes('/_archive/')
                                        && !w.path.includes('reproc-watchdog')
                                        && vivos.has(w.path));
            }

            function evaluarCorrida(r, ahoraMs, horasColgado, maxDias) {
              const horas = (ahoraMs - new Date(r.created_at).getTime()) / 36e5;
              if (horas > maxDias * 24) return null;
              if (r.status === 'completed' && r.conclusion !== 'success'
                  && r.conclusion !== 'cancelled') return { tipo: 'fallida', horas };
              if (r.status !== 'completed' && horas > horasColgado)
                return { tipo: 'colgada', horas };
              return null;
            }
            // --- FIN SELECCION PURA ---

            // Fuente de verdad de "existe": los archivos de la rama por defecto.
            // Si esta lectura falla, abortamos en vez de vigilar fantasmas.
            let pathsEnRepo;
            try {
              const contenido = (await github.rest.repos.getContent({
                owner, repo, path: '.github/workflows' })).data;
              pathsEnRepo = contenido.filter(e => e.type === 'file').map(e => e.path);
            } catch (e) {
              core.setFailed(`no pude listar .github/workflows en el repo: ${e.message}`);
              return;
            }

            const wfs = seleccionarVigilados(
              (await github.rest.actions.listRepoWorkflows({
                owner, repo, per_page: 100 })).data.workflows,
              pathsEnRepo);
            core.info(`vigilando ${wfs.length} reprocesos vivos de ${pathsEnRepo.length} archivos`);

            const problemas = [];
            for (const w of wfs) {
              const runs = (await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: w.id, per_page: 3 })).data.workflow_runs;
              if (!runs.length) continue;
              const r = runs[0];
              const v = evaluarCorrida(r, Date.now(), HORAS_COLGADO, MAX_DIAS_ANTIGUEDAD);
              if (!v) continue;
              if (v.tipo === 'fallida') {
                problemas.push(`- **${w.name}** — ultima corrida \`${r.conclusion}\` `
                  + `hace ${v.horas.toFixed(1)} h · ${r.html_url}`);
              } else {
                problemas.push(`- **${w.name}** — lleva ${v.horas.toFixed(1)} h en `
                  + `\`${r.status}\`, sobre el techo de 6 h por job · ${r.html_url}`);
              }
            }

            const abiertos = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100 })).data
              .filter(i => i.title === TITULO);

            if (!problemas.length) {
              for (const i of abiertos) {
                await github.rest.issues.createComment({ owner, repo,
                  issue_number: i.number,
                  body: 'Los reprocesos volvieron a verde. Cerrando.' });
                await github.rest.issues.update({ owner, repo,
                  issue_number: i.number, state: 'closed' });
              }
              core.info('sin problemas');
              return;
            }

            const cuerpo = [
              'El watchdog encontro reprocesos que fallaron o llevan demasiado tiempo:',
              '', ...problemas, '',
              '**Antes de relanzar**, revisar si es el modo de falla de S129: la ventana',
              'por defecto no entra en el `timeout-minutes`. El guard',
              '`tests/test_guard_timeout_vs_ventana_s129.py` lo mide (regla A15: el costo',
              'medido es ~2,4 min por dia de ventana, y GitHub corta a los 360 min por',
              'job — pasada cierta ventana hay que partirla en chunks, no subir el reloj).',
              '',
              '_Abierto automaticamente por `reproc-watchdog.yml`._',
            ].join('\n');

            if (abiertos.length) {
              await github.rest.issues.createComment({ owner, repo,
                issue_number: abiertos[0].number, body: cuerpo });
            } else {
              await github.rest.issues.create({ owner, repo, title: TITULO,
                body: cuerpo });
            }
