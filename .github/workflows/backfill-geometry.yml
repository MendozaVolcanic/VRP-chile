name: S122 backfill geometria de observacion (zenith/azimut)

# Rellena sensor_zenith/azimuth + solar_zenith/azimuth en records YA existentes.
# Descarga SOLO el producto de geolocalizacion (no la radiancia) y muestrea el
# angulo en el punto que el record ya reporta -> es ADITIVO: no recalcula VRP ni
# deteccion. Ver scripts/backfill_geometry.py y docs/AUDIT_S122.md.
# MODIS necesita pyhdf (roto en Windows) -> por eso corre aca, en Linux.
# Anti-race (A47): matrix por volcan = cada job escribe SOLO su archivo.
# A43: "on" quoted (Norway problem).
"on":
  workflow_dispatch:
    inputs:
      start:
        description: "Inicio (YYYY-MM-DD)"
        required: true
      end:
        description: "Fin (YYYY-MM-DD)"
        required: true
      volcano:
        description: "Volcan exacto (piloto) o 'all' (11 Tier A)"
        default: "all"
        required: false

permissions:
  contents: write

concurrency:
  # S123: grupo COMPARTIDO por los 6 workflows que hacen `git push` a main.
  # Serializa los pushes entre workflows distintos y evita la carrera
  # "cannot lock ref 'refs/heads/main'" (ya ocurrida en Mirova-v1 el 2026-08-08).
  # Colision concreta que motiva esto: nrt.yml (cron :00 cada 2h) vs
  # sync-mirova-csv.yml (cron :12 de cada hora) cuando nrt tarda >12 min.
  # cancel-in-progress: false -> nunca abortamos un push a medias; se encola.
  group: push-main
  cancel-in-progress: false

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        volcano: ${{ github.event.inputs.volcano == 'all' && fromJSON('["Lascar","Lastarria","Isluga","Llaima","Villarrica","Chaiten","Tupungatito","Copahue","PlanchonPeteroa","PuyehueCordonCaulle","NevadosDeChillan"]') || fromJSON(format('["{0}"]', github.event.inputs.volcano)) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf earthaccess numpy h5py scipy pyyaml
      - name: Backfill geometria ${{ matrix.volcano }}
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 330
        run: |
          python scripts/backfill_geometry.py \
            --volcano ${{ matrix.volcano }} \
            --start ${{ github.event.inputs.start }} \
            --end ${{ github.event.inputs.end }}
      - name: Commit result (solo el archivo de este volcan — anti-race A47)
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add "data/mirova_equivalent/${{ matrix.volcano }}.json" 2>/dev/null
          git diff --staged --quiet && { echo "sin cambios para ${{ matrix.volcano }}"; exit 0; }
          git commit -m "data(geometry): ${{ matrix.volcano }} ${{ github.event.inputs.start }}..${{ github.event.inputs.end }} (S122)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1
