name: "Probe S151 1.17, etiquetas MODIS re-medidas con MxD03 en los 11 volcanes (solo lectura)"

# Tarea 1.17 del loop. Criterio pre-registrado en experiments/_s151_mxd03_etiquetas/README.md,
# escrito antes de cualquier corrida; la muestra esta fijada en poblacion.json (git). Solo lectura:
# no escribe en data/, no commitea, no hace push; el resultado queda como artefacto. Por volcan baja
# hasta 44 pares MxD021KM + MxD03 y borra cada HDF al usarlo.
# A43: "on" entre comillas. S141: pipefail con tee. A15: timeout 90 min para un presupuesto interno
# de 70 min (el script deja de bajar granulos al pasarlo y los marca "sin_tiempo").
# S146/A71: autentica SOLO por EARTHDATA_TOKEN y falla al instante si viene vacio.
"on":
  workflow_dispatch:
    inputs:
      preregistro_aprobado:
        description: "Escribe si SOLO con el criterio de experiments/_s151_mxd03_etiquetas/README.md sellado (regla 1.6 del loop)"
        required: true
        default: "no"
      volcanes:
        description: "Lista JSON de volcanes (por defecto los 11 Tier A)"
        required: false
        default: '["Lascar","Lastarria","Isluga","Tupungatito","PlanchonPeteroa","NevadosDeChillan","Llaima","Villarrica","Copahue","PuyehueCordonCaulle","Chaiten"]'

concurrency:
  group: probe-s151-mxd03-etiquetas
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04  # pyhdf probado en 24.04 (ver nrt.yml)
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        volcan: ${{ fromJSON(github.event.inputs.volcanes) }}
    steps:
      - name: Candado del pre-registro
        run: |
          if [ "${{ github.event.inputs.preregistro_aprobado }}" != "si" ]; then
            echo "Pre-registro sin sello: no se corre (regla 1.6 del loop)"; exit 1
          fi
      - name: Token presente
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then echo "EARTHDATA_TOKEN vacio: no se corre (A71)"; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml pyproj pandas
          node --version
      - name: Prueba sintetica (el instrumento distingue corrimiento presente de ausente)
        env:
          VRP_PROFILE: mirova_equivalent
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/_s151_mxd03_etiquetas/probar_probe_mxd03.py | tee out/prueba_sintetica_${{ matrix.volcan }}.txt
      - name: Probe del volcan
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          VRP_PROFILE: mirova_equivalent
          VRP_TMP_DIR: ${{ runner.temp }}/vrp_tmp
        run: |
          set -o pipefail
          python experiments/_s151_mxd03_etiquetas/probe_etiquetas.py --volcan "${{ matrix.volcan }}" \
            --out out --presupuesto-min 70 2>&1 | tee out/probe_${{ matrix.volcan }}.log
          rm -rf out/hdf
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s151-mxd03-etq-${{ matrix.volcan }}
          path: |
            out/*.json
            out/*.txt
            out/*.log
          retention-days: 30
          if-no-files-found: error

  agregar:
    needs: probe
    if: always() && github.event.inputs.preregistro_aprobado == 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: s151-mxd03-etq-*
          path: salidas
      - name: Evaluar con el criterio pre-registrado
        run: |
          set -o pipefail
          python experiments/_s151_mxd03_etiquetas/evaluar_mxd03.py salidas --salida salidas/resumen.json | tee salidas/veredicto.txt
      - name: Upload resumen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s151-mxd03-etiquetas-resumen
          path: |
            salidas/resumen.json
            salidas/veredicto.txt
          retention-days: 30
          if-no-files-found: error
