name: F2.8 v3 reproc PP saturation guard

"on":
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD"
        required: true
        default: "2026-03-18"

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf earthaccess numpy h5py scipy pyyaml
      - name: Run reproc
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          python scripts/run_pipeline.py \
            --profile mirova_equivalent \
            --volcano PlanchonPeteroa \
            --start ${{ github.event.inputs.date }} \
            --end ${{ github.event.inputs.date }} \
            --overwrite
      - name: Audit + commit
        run: |
          python experiments/138_f28_saturation_ab/audit_ab.py mirova_equivalent /dev/null || true
          git config user.name "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add data/mirova_equivalent/PlanchonPeteroa.json
          git diff --staged --quiet && exit 0
          git commit -m "reproc(f28-v3): PP ${{ github.event.inputs.date }}"
          git pull --rebase -X theirs && git push
