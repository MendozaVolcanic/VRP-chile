# F49/S77: sync auto de los CSV de MIROVA desde Mirova-v1 (consolidado + OCR).
#
# S146, por qué también el OCR:
# - La referencia de MIROVA llega por DOS canales. El consolidado lo refresca
#   este cron cada hora; el OCR sólo lo traía `audit-weekly.yml`, una vez por
#   semana, así que el snapshot del repo se atrasaba hasta 7 días.
# - Eso no es cosmético: en la quincena previa al corte medido en S146, 17 de
#   57 alertas del canal OCR no tenían equivalente en el consolidado. Con el
#   OCR atrasado, el eje de referencia (scripts/clasificar_referencia.py) rotula
#   "MIROVA miró y no publicó nada" pasadas que el canal atrasado todavía puede
#   confirmar. Por eso esas pasadas salen marcadas `provisorio` y por eso
#   conviene que el atraso dure una hora y no una semana.
# - El OCR va al snapshot `data/mirova_reference/mirova_v1_snapshot/`, que es la
#   ruta que consume el código (scripts/referencia_mirova_unificada.py:43,
#   scripts/auto_audit_weekly.py:48, scripts/build_c2ab_windows.py:64,
#   scripts/paper_numbers.py:65). OJO: `data/mirova_reference/registro_vrp_ocr.csv`
#   es OTRO archivo, congelado en marzo de 2026; NO se toca acá.
# - `audit-weekly.yml` sigue bajando los dos a la misma ruta: es idempotente,
#   escribe el mismo contenido y no hay que cambiarlo.
#
# Por qué existe:
# - El scraper Mirova-v1 corre cada 5 min en su propio repo y commitea data
#   fresca a su rama main (https://github.com/MendozaVolcanic/Mirova-v1).
# - VRP Chile consume `latest_consolidado.csv` que es un hard-copy del CSV
#   remoto. Se commiteó por última vez S73 (PR #139, A17) y nunca se
#   re-actualizó por 23 días → dashboard mostraba ground truth congelado.
# - Bug arquitectural detectado F49 (PR #186). Fix: cron 1h que copia el
#   CSV remoto, hace diff, y si cambió, commitea + push.
#
# Cadencia 1h elegida como trade-off:
# - Mirova-v1 commitea cada 5 min → cron 5 min sería noise excesivo.
# - MIROVA NRT mismo tiene ~3h latencia → cron 1h da freshness útil.
# - Si el dashboard ve refs <3h stale en máximo, el banner F49 stale
#   (PR #184, threshold 14d) nunca dispara.
#
# Trigger workflow_run a pages-deploy para que GH Pages publique inmediato.

# NOTE: yaml "on:" parsea como booleano True (Norway problem, A43 CLAUDE.md)
# → usar "on:" con comillas para forzar string. PYAML/GH Actions ambos lo aceptan.
"on":
  schedule:
    - cron: "12 * * * *"   # cada hora minuto 12 (offset random vs otros workflows)
  workflow_dispatch: {}   # permitir trigger manual

permissions:
  contents: write

concurrency:
  # S123: grupo COMPARTIDO por los 6 workflows que hacen `git push` a main.
  # Serializa los pushes entre workflows distintos y evita la carrera
  # "cannot lock ref 'refs/heads/main'" (ya ocurrida en Mirova-v1 el 2026-08-08).
  # Colision concreta que motiva esto: nrt.yml (cron :00 cada 2h) vs
  # sync-mirova-csv.yml (cron :12 de cada hora) cuando nrt tarda >12 min.
  # cancel-in-progress: false -> nunca abortamos un push a medias; se encola.
  group: push-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # S160: Python se instala siempre. Antes sólo cuando cambiaba el consolidado, pero el
      # bucle de push puede volver a bajar y regenerar sobre un origin/main más nuevo, y para
      # eso hace falta Python aunque la primera pasada sólo trajera OCR.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimal deps for rebuild
        run: |
          pip install pyyaml

      - name: Bajar los CSV de Mirova-v1 y regenerar data/mirova/<Vol>.json
        id: bajar
        # El cuerpo vive en scripts/sync_mirova_csv.sh (mismas URL, mismas defensas del OCR,
        # mismo rebuild que los pasos que reemplaza) para que el bucle de push lo pueda volver
        # a correr. Escribe changed / ocr_changed / ocr_bad en $GITHUB_OUTPUT.
        run: bash scripts/sync_mirova_csv.sh

      - name: Commit and push if changed
        id: push
        if: steps.bajar.outputs.changed == 'true' || steps.bajar.outputs.ocr_changed == 'true'
        run: |
          git config user.name "vrp-mirova-sync-bot"
          git config user.email "noreply@github.com"
          # S160 (R13, hallazgo H-V1 de la auditoría de Mirova-v1): si el push pierde la
          # carrera, NO se rebasa. `latest_consolidado.csv` se reemplaza entero en cada sync y
          # llega cada vez con las filas en otro orden (el scraper ordena sólo por timestamp);
          # `git pull --rebase -X theirs` mezclaba como texto tres permutaciones del archivo y
          # dejaba filas dos veces o ninguna. El commit 81dd25ce3 (2026-08-19, 822 duplicados,
          # 163 llaves menos) se reproduce byte a byte así. En su lugar: volver a origin/main,
          # bajar de nuevo y regenerar con el mismo script (mismo patrón que aplicar-reemplazo.yml).
          # Antes de cada push, la guarda de llaves: un CSV con llaves repetidas no se empuja.
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              sleep $((attempt * 10))
              git fetch origin main || continue
              git reset --hard origin/main
              bash scripts/sync_mirova_csv.sh || exit 1
            fi
            # S146: el OCR entra al mismo commit. `git add` de un archivo que no cambió no
            # agrega nada, así que los tres caminos (sólo consolidado, sólo OCR, los dos)
            # quedan cubiertos por una sola lista.
            git add latest_consolidado.csv data/mirova/ \
              data/mirova_reference/mirova_v1_snapshot/registro_vrp_ocr.csv
            git diff --staged --quiet && { echo "nada que commitear"; exit 0; }
            python scripts/guarda_llaves_consolidado.py latest_consolidado.csv || exit 1
            git commit -m "data(mirova): sync CSV consolidado + OCR y JSONs por volcan (auto, F54/S146)"
            git push && exit 0
            echo "push attempt $attempt failed"
          done
          echo "all push attempts failed"; exit 1

      - name: Fallar si el consolidado perdió llaves
        # S160 (hallazgo 245 de docs/AUDIT_S160.md): la copia nueva ya se commiteó (avisa, no rechaza:
        # rechazar puede congelar la referencia); la corrida queda en rojo para que la pérdida se vea.
        # La lista de llaves perdidas está en el resumen del paso de descarga o del de push.
        if: always() && ((steps.bajar.outputs.llaves_perdidas != '' && steps.bajar.outputs.llaves_perdidas != '0') || (steps.push.outputs.llaves_perdidas != '' && steps.push.outputs.llaves_perdidas != '0'))
        run: |
          echo "el consolidado de MIROVA perdió llaves de la copia vigente (bajar=${{ steps.bajar.outputs.llaves_perdidas }}, push=${{ steps.push.outputs.llaves_perdidas }})"
          exit 1

      - name: Fallar si el OCR vino mal
        # Va DESPUES del push a proposito: el consolidado se sincroniza igual y la
        # corrida queda en rojo, que es la unica forma de que el fallo del canal
        # OCR se vea. Sin esto seria un warning que nadie lee.
        # S160: el bucle de push puede volver a bajar el OCR, así que se miran los dos pasos.
        if: always() && (steps.bajar.outputs.ocr_bad == 'true' || steps.push.outputs.ocr_bad == 'true')
        run: |
          echo "el OCR no se pudo sincronizar en esta corrida (ver el step de descarga)"
          exit 1
