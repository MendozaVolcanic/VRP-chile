# F49/S77: sync auto de los CSV de MIROVA desde Mirova-v1 (consolidado + OCR).
#
# S146, por qué también el OCR:
# - La referencia de MIROVA llega por DOS canales. El consolidado lo refresca
#   este cron cada hora; el OCR sólo lo traía `audit-weekly.yml`, una vez por
#   semana, así que el snapshot del repo se atrasaba hasta 7 días.
# - Eso no es cosmético: en la quincena previa al corte medido en S146, 17 de
#   57 alertas del canal OCR no tenían equivalente en el consolidado. Con el
#   OCR atrasado, el eje de referencia (scripts/clasificar_referencia.py) rotula
#   "MIROVA miró y no publicó nada" pasadas que el canal atrasado todavía puede
#   confirmar. Por eso esas pasadas salen marcadas `provisorio` y por eso
#   conviene que el atraso dure una hora y no una semana.
# - El OCR va al snapshot `data/mirova_reference/mirova_v1_snapshot/`, que es la
#   ruta que consume el código (scripts/referencia_mirova_unificada.py:43,
#   scripts/auto_audit_weekly.py:48, scripts/build_c2ab_windows.py:64,
#   scripts/paper_numbers.py:65). OJO: `data/mirova_reference/registro_vrp_ocr.csv`
#   es OTRO archivo, congelado en marzo de 2026; NO se toca acá.
# - `audit-weekly.yml` sigue bajando los dos a la misma ruta: es idempotente,
#   escribe el mismo contenido y no hay que cambiarlo.
#
# Por qué existe:
# - El scraper Mirova-v1 corre cada 5 min en su propio repo y commitea data
#   fresca a su rama main (https://github.com/MendozaVolcanic/Mirova-v1).
# - VRP Chile consume `latest_consolidado.csv` que es un hard-copy del CSV
#   remoto. Se commiteó por última vez S73 (PR #139, A17) y nunca se
#   re-actualizó por 23 días → dashboard mostraba ground truth congelado.
# - Bug arquitectural detectado F49 (PR #186). Fix: cron 1h que copia el
#   CSV remoto, hace diff, y si cambió, commitea + push.
#
# Cadencia 1h elegida como trade-off:
# - Mirova-v1 commitea cada 5 min → cron 5 min sería noise excesivo.
# - MIROVA NRT mismo tiene ~3h latencia → cron 1h da freshness útil.
# - Si el dashboard ve refs <3h stale en máximo, el banner F49 stale
#   (PR #184, threshold 14d) nunca dispara.
#
# Trigger workflow_run a pages-deploy para que GH Pages publique inmediato.

# NOTE: yaml "on:" parsea como booleano True (Norway problem, A43 CLAUDE.md)
# → usar "on:" con comillas para forzar string. PYAML/GH Actions ambos lo aceptan.
"on":
  schedule:
    - cron: "12 * * * *"   # cada hora minuto 12 (offset random vs otros workflows)
  workflow_dispatch: {}   # permitir trigger manual

permissions:
  contents: write

concurrency:
  # S123: grupo COMPARTIDO por los 6 workflows que hacen `git push` a main.
  # Serializa los pushes entre workflows distintos y evita la carrera
  # "cannot lock ref 'refs/heads/main'" (ya ocurrida en Mirova-v1 el 2026-08-08).
  # Colision concreta que motiva esto: nrt.yml (cron :00 cada 2h) vs
  # sync-mirova-csv.yml (cron :12 de cada hora) cuando nrt tarda >12 min.
  # cancel-in-progress: false -> nunca abortamos un push a medias; se encola.
  group: push-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download fresh CSV from Mirova-v1
        run: |
          set -e
          curl -fsSL \
            "https://raw.githubusercontent.com/MendozaVolcanic/Mirova-v1/main/monitoreo_satelital/registro_vrp_consolidado.csv" \
            -o latest_consolidado.csv.new

      - name: Check if changed
        id: changed
        run: |
          if cmp -s latest_consolidado.csv latest_consolidado.csv.new; then
            echo "CSV sin cambios, skip commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            rm latest_consolidado.csv.new
          else
            mv latest_consolidado.csv.new latest_consolidado.csv
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Rows: $(wc -l < latest_consolidado.csv)"
            echo "Latest date: $(awk -F, 'NR==2{print $2}' latest_consolidado.csv | head -c 16)"
          fi

      - name: Download fresh OCR CSV from Mirova-v1
        id: ocr
        run: |
          # Mismas defensas que el consolidado (archivo temporal + cmp) más dos
          # que el consolidado no tiene y que acá hacen falta: el OCR es la
          # entrada de un rótulo que lee el geólogo, así que un archivo vacío o
          # truncado es peor que un archivo viejo.
          #
          # POR QUE no aborta el job: este cron también sincroniza el
          # consolidado. Si el OCR viene mal, se salta el OCR, el consolidado
          # igual se commitea, y el último step deja la corrida en ROJO para que
          # el fallo no pase en silencio (A87: un flag que se apaga solo no es
          # prueba de que el problema se fue).
          OCR=data/mirova_reference/mirova_v1_snapshot/registro_vrp_ocr.csv
          URL=https://raw.githubusercontent.com/MendozaVolcanic/Mirova-v1/main/monitoreo_satelital/registro_vrp_ocr.csv
          changed=false; bad=false
          if ! curl -fsSL "$URL" -o "$OCR.new"; then
            echo "::error::no se pudo bajar el OCR desde Mirova-v1"
            bad=true
          else
            nuevas=$(wc -l < "$OCR.new"); viejas=$(wc -l < "$OCR")
            cabecera=$(head -1 "$OCR.new")
            # Vacío / sin la cabecera esperada / más corto que lo que ya tenemos:
            # el registro de MIROVA sólo crece, así que encogerse es truncamiento.
            if [ "$nuevas" -lt 2 ] || ! printf '%s' "$cabecera" | grep -q "Fecha_Satelite_UTC" \
               || [ "$nuevas" -lt "$viejas" ]; then
              echo "::error::OCR invalido: lineas=$nuevas (previas=$viejas) cabecera='${cabecera:0:60}'"
              rm -f "$OCR.new"
              bad=true
            elif cmp -s "$OCR" "$OCR.new"; then
              echo "OCR sin cambios, skip commit"
              rm -f "$OCR.new"
            else
              mv "$OCR.new" "$OCR"
              changed=true
              echo "OCR rows: $nuevas (antes $viejas)"
              echo "OCR latest date: $(tail -1 "$OCR" | cut -d, -f2)"
            fi
          fi
          echo "ocr_changed=$changed" >> "$GITHUB_OUTPUT"
          echo "ocr_bad=$bad" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimal deps for rebuild
        if: steps.changed.outputs.changed == 'true'
        run: |
          pip install pyyaml

      - name: Rebuild data/mirova/<Vol>.json from CSV (F54 fix)
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -e
          # F54/S77: el dashboard frontend NO lee latest_consolidado.csv
          # directamente. Lee data/mirova/<Volcano>.json (records filtrados
          # por volcán) generados por scripts/rebuild_mirova_from_consolidado.py.
          # Sin este step, sync del CSV mantenía latest_consolidado fresh pero
          # data/mirova/*.json quedaban congelados meses → banner stale F49
          # aparecía aunque el sync funcionaba. Detectado S77 2026-05-25.
          #
          # Mapping JSON_stem → "Volcan" en CSV (verificado 2026-05-25).
          # 11 Tier A según volcanoes.yaml mirova_monitored=true.
          for entry in \
            "PuyehueCordonCaulle|Puyehue-Cordon Caulle" \
            "Villarrica|Villarrica" \
            "Lascar|Lascar" \
            "Copahue|Copahue" \
            "NevadosDeChillan|Nevados de Chillan" \
            "Llaima|Llaima" \
            "Chaiten|Chaiten" \
            "PlanchonPeteroa|PlanchonPeteroa" \
            "Lastarria|Lastarria" \
            "Isluga|Isluga" \
            "Tupungatito|Tupungatito"
          do
            stem="${entry%%|*}"
            csvname="${entry##*|}"
            echo "Rebuilding data/mirova/${stem}.json from CSV (Volcan='${csvname}')"
            python scripts/rebuild_mirova_from_consolidado.py \
              "$stem" "$csvname" \
              --source latest_consolidado.csv \
              || echo "  WARN: rebuild $stem failed (continuing)"
          done

      - name: Commit and push if changed
        if: steps.changed.outputs.changed == 'true' || steps.ocr.outputs.ocr_changed == 'true'
        run: |
          git config user.name "vrp-mirova-sync-bot"
          git config user.email "noreply@github.com"
          # S146: el OCR entra al mismo commit. `git add` de un archivo que no
          # cambió no agrega nada, así que los tres caminos (sólo consolidado,
          # sólo OCR, los dos) quedan cubiertos por una sola lista.
          git add latest_consolidado.csv data/mirova/ \
            data/mirova_reference/mirova_v1_snapshot/registro_vrp_ocr.csv
          git diff --staged --quiet && { echo "nada que commitear"; exit 0; }
          git commit -m "data(mirova): sync CSV consolidado + OCR y JSONs por volcan (auto, F54/S146)"
          # S120 (cacería de bugs): push pelado rechazaba non-fast-forward cuando
          # los jobs matrix del NRT pushean concurrente, retry con rebase
          # (mismo patrón probado de nrt.yml).
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1

      - name: Fallar si el OCR vino mal
        # Va DESPUES del push a proposito: el consolidado se sincroniza igual y la
        # corrida queda en rojo, que es la unica forma de que el fallo del canal
        # OCR se vea. Sin esto seria un warning que nadie lee.
        if: always() && steps.ocr.outputs.ocr_bad == 'true'
        run: |
          echo "el OCR no se pudo sincronizar en esta corrida (ver el step de descarga)"
          exit 1
