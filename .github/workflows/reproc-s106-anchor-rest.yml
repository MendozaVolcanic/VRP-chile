name: S106 reproc ancla honesta - 6 Tier A restantes (promocion)

# A43 "on" quoted. Reproc VIIRS flag-ON (profile _honest_anchor_a, brazo ganador del
# A/B run 27343409067) para los 6 Tier A que no estuvieron en el A/B. Junto con los
# artifacts del brazo A (5 vols) completa el set de promocion de los 11. Artifacts,
# NO commitea (A47). Merge a data/mirova_equivalent via script de promocion (patron
# S103 merge_promote). Design: docs/superpowers/specs/2026-06-11-ancla-espacial-honesta-design.md.
"on":
  workflow_dispatch:

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        volcano: [Isluga, Chaiten, Copahue, NevadosDeChillan, PlanchonPeteroa, PuyehueCordonCaulle]
        chunk:
          - { start: "2026-01-29", end: "2026-03-31" }
          - { start: "2026-04-01", end: "2026-06-08" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf earthaccess numpy h5py scipy pyyaml
      - name: Reprocess _honest_anchor_a / ${{ matrix.volcano }} / ${{ matrix.chunk.start }}
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 290
        run: |
          python scripts/run_pipeline.py \
            --profile _honest_anchor_a \
            --volcano ${{ matrix.volcano }} \
            --start ${{ matrix.chunk.start }} \
            --end ${{ matrix.chunk.end }} \
            --overwrite
      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: s106rest-${{ matrix.volcano }}-${{ matrix.chunk.start }}
          path: data/_honest_anchor_a/${{ matrix.volcano }}.json
          if-no-files-found: warn
          retention-days: 7
