name: Probe S105 discriminante lava vs topografia (Villarrica)

# A43 "on" quoted. One-off diagnostico S105 Fase 2: corre probe_discriminant.py sobre
# una muestra de noches LAVA (ALERTA MIROVA) vs TOPO (sin ALERTA) para ver si el pico
# de NTI en el nucleo (<1km) separa lava de topografia. NO toca pipeline. Archivar tras
# usar (A38). Cada job imprime el discriminante DISC(core-ring) por satelite.
"on":
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          # LAVA — noches ALERTA Villarrica (horario de la ALERTA)
          - { date: "2026-05-22", group: "lava", times: ".0554.,.0548.,.0600." }
          - { date: "2026-05-11", group: "lava", times: ".0600.,.0554.,.0548." }
          - { date: "2026-05-14", group: "lava", times: ".0548.,.0554.,.0600." }
          - { date: "2026-03-08", group: "lava", times: ".0600.,.0554.,.0548." }
          - { date: "2026-02-26", group: "lava", times: ".0542.,.0548.,.0536." }
          - { date: "2026-04-09", group: "lava", times: ".0600.,.0554.,.0548." }
          # TOPO — noches sin ALERTA con Test1 disparado lejos del crater
          - { date: "2026-02-06", group: "topo", times: ".0642.,.0606.,.0636." }
          - { date: "2026-02-28", group: "topo", times: ".0648.,.0642.,.0654." }
          - { date: "2026-03-09", group: "topo", times: ".0700.,.0654.,.0648." }
          - { date: "2026-04-27", group: "topo", times: ".0430.,.0506.,.0524." }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install earthaccess numpy h5py scipy pyyaml
      - name: Run discriminant probe
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          PROBE_DATE: ${{ matrix.date }}
          PROBE_GROUP: ${{ matrix.group }}
          PROBE_TIMES: ${{ matrix.times }}
        run: |
          python experiments/_s104_roi_probe/probe_discriminant.py | tee report_${{ matrix.group }}_${{ matrix.date }}.txt
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s105-disc-${{ matrix.group }}-${{ matrix.date }}
          path: report_${{ matrix.group }}_${{ matrix.date }}.txt
          if-no-files-found: warn
