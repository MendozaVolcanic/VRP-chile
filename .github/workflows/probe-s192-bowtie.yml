name: "Probe S192, bow-tie en el marcador del crater (NOAA-21, 2026-11-20) (solo lectura)"

# Comprueba si los pixeles que el marcador del crater (#1060, px_mir_invalido_crater) cuenta en las pasadas NOAA-21 de
# cenit alto del 2026-11-20 son relleno bow-tie (DN 65533, UserGuide VIIRS L1B Aug 2021) y no huecos de medicion.
# Reglas del veredicto escritas antes de ver datos en experiments/_s192_bowtie/medir_bowtie.py.
# Solo lectura: no escribe en data/, no commitea, no hace push, no usa el grupo push-main. Baja cada L1B a un temporal,
# lo mide y lo borra; sube solo un JSON y el log.
# Corre por push a su rama propia (patron de probe-s157-*): workflow_dispatch solo existe desde main (S73) y esta rama
# no se mergea. A43: "on" entre comillas. A71: autentica SOLO por EARTHDATA_TOKEN y falla al instante si viene vacio.
# A15: 4 pasadas x (par M ~115 MB + par I ~245 MB) ~1,4 GB y sin interpolacion: ~10 a 15 min; timeout 40.
"on":
  push:
    branches: ["s192-bowtie-diag"]

concurrency:
  group: probe-s192-bowtie
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04  # igual que nrt.yml
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Token presente
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then echo "EARTHDATA_TOKEN vacio: no se corre (A71)"; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install --upgrade pip
          pip install earthaccess numpy h5py scipy pyyaml pyproj
      - name: Prueba del instrumento (sintetica, sin red)
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/_s192_bowtie/medir_bowtie.py --autoprueba 2>&1 | tee out/autoprueba.txt
      - name: Bajar, medir y borrar
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          VRP_TMP_DIR: ${{ runner.temp }}/vrp_tmp
        run: |
          set -o pipefail
          # segunda corrida (S192): atributos y rango de DN de M13 y M15 (un gránulo); la primera midió el bow-tie
          python experiments/_s192_bowtie/medir_m13.py --out out 2>&1 | tee out/medir_m13.log
      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s192-bowtie-m13
          path: |
            out/*.json
            out/*.txt
            out/*.log
          retention-days: 30
          if-no-files-found: error
