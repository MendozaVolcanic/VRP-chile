name: S103 reproc VIIRS nadir — PCC + Tupungatito (re-fetch)

# Re-reproc de los 2 vols que el guard anti-underfetch saltó en la 1ra promoción
# (run 27098410956): PCC y Tupungatito tenían under-fetch de días recientes
# (06-03..06-07) por la carrera con el NRT. Mismo perfil _s103_viirs_nadir_promote
# (hereda mirova_equivalent ya flipeado: nadir VIIRS). Artifacts (NO commitea, A47);
# merge LOCAL con merge_promote_viirs_nadir.py. MODIS necesita pyhdf. A43 "on" quoted.

"on":
  workflow_dispatch:

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        volcano:
          - PuyehueCordonCaulle
          - Tupungatito
        chunk:
          - { start: "2026-01-29", end: "2026-03-31" }
          - { start: "2026-04-01", end: "2026-06-07" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (pyhdf for MODIS)
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf earthaccess numpy h5py scipy pyyaml
      - name: Reprocess viirs-nadir-promote / ${{ matrix.volcano }} / ${{ matrix.chunk.start }}
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 290
        run: |
          python scripts/run_pipeline.py \
            --profile _s103_viirs_nadir_promote \
            --volcano ${{ matrix.volcano }} \
            --start ${{ matrix.chunk.start }} \
            --end ${{ matrix.chunk.end }} \
            --overwrite
      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: s103viirspromo-${{ matrix.volcano }}-${{ matrix.chunk.start }}
          path: data/_s103_viirs_nadir_promote/${{ matrix.volcano }}.json
          if-no-files-found: warn
          retention-days: 7
