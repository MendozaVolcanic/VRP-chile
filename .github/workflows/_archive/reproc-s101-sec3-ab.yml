name: S101 A/B palanca sec³ MODIS (nadir-fijo vs sec³)

# Mide cuánto del campo difuso MODIS inflado (PCC 342, Tupun 133 MW) es la corrección
# sec³(θ) por scan angle off-nadir. Dos brazos sobre los MISMOS granules:
#   _sec3_modis_nadir_off = sec³ activo (operacional)
#   _sec3_modis_nadir_on  = nadir-fijo (como resamplea MIROVA, papers eje A)
# El ratio (off/on) por record común (dt+sensor) = factor de inflación sec³ puro.
# Artifacts (NO commitea a main; se descargan y comparan local). MODIS necesita pyhdf
# (roto en Windows, regla S15) → GH Actions Linux. NO toca operacional (A47).
# Design doc: docs/superpowers/specs/2026-06-05-frente-modis-campo-difuso-design.md §4bis.
# A43 Norway: "on": quoted.

"on":
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-04-01"
      end:
        description: "End date YYYY-MM-DD inclusive"
        required: true
        default: "2026-04-30"

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        profile:
          - _sec3_modis_nadir_off
          - _sec3_modis_nadir_on
        volcano:
          - PuyehueCordonCaulle
          - Tupungatito
          - Lascar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (pyhdf for MODIS)
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf earthaccess numpy h5py scipy pyyaml
      - name: Reprocess ${{ matrix.profile }} / ${{ matrix.volcano }}
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 190
        run: |
          python scripts/run_pipeline.py \
            --profile ${{ matrix.profile }} \
            --volcano ${{ matrix.volcano }} \
            --start ${{ github.event.inputs.start }} \
            --end ${{ github.event.inputs.end }} \
            --overwrite
      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: sec3-${{ matrix.profile }}-${{ matrix.volcano }}
          path: data/${{ matrix.profile }}/${{ matrix.volcano }}.json
          if-no-files-found: warn
          retention-days: 7
