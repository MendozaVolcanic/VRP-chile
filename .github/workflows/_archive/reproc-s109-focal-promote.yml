name: S109 reproc-promote magnitud focal MODIS

# Reproc histórico de los 11 Tier A con el fix de magnitud núcleo-focal MODIS ADOPTADO
# (enable_focal_cluster_magnitude:true en mirova_equivalent, A45). Perfil _s109_focal_promote
# (extends mirova_equivalent, data_subdir aislado A47). 11 vols x 2 chunks = 22 jobs. Artifacts
# → merge_promote_focal.py local (MODIS curado, VIIRS byte-idéntico, guard cobertura). MODIS
# necesita pyhdf (GH Linux). A43 Norway: "on": quoted. Doc AUDIT_S109_MODIS_FOCAL_VEREDICTO.

"on":
  workflow_dispatch:

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        volcano:
          - Lascar
          - Chaiten
          - Villarrica
          - PuyehueCordonCaulle
          - Tupungatito
          - Llaima
          - PlanchonPeteroa
          - Copahue
          - Isluga
          - Lastarria
          - NevadosDeChillan
        chunk:
          - { start: "2026-01-29", end: "2026-03-31" }
          - { start: "2026-04-01", end: "2026-06-15" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (pyhdf for MODIS)
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf earthaccess numpy h5py scipy pyyaml
      - name: Reproc _s109_focal_promote / ${{ matrix.volcano }} / ${{ matrix.chunk.start }}
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 290
        run: |
          python scripts/run_pipeline.py \
            --profile _s109_focal_promote \
            --volcano ${{ matrix.volcano }} \
            --start ${{ matrix.chunk.start }} \
            --end ${{ matrix.chunk.end }} \
            --overwrite
      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: s109focalpromo-${{ matrix.volcano }}-${{ matrix.chunk.start }}
          path: data/_s109_focal_promote/${{ matrix.volcano }}.json
          if-no-files-found: warn
          retention-days: 7
