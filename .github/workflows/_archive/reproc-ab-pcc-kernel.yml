name: A/B reproceso local kernel background — PuyehueCordonCaulle (S63)

# S63 hipótesis (S62 finding paralelo): PCC tiene mismo patrón térmico
# régimen Muy Bajo que Villarrica/PP/Lastarria — ΔT mediano 11.2K,
# pc.n_pixels mediano 45.5. La hipótesis S61 "ring gradient +4.5K
# positivo PCC" era especulativa (análisis de 1 día, no sistemático).
#
# Profile: _local_kernel_bg_enabled. Si valida (recall mantenido, ratio
# < LEGACY 3.51× y especialmente < 2×): adoptar local_kernel_bg=true PCC.
#
# Top outliers PCC actuales (inner=20 baseline):
# - 2026-03-03: MIR 0.10 → ours 14.84 (148×) src=eruption dist=0.5km
# - 2026-04-08: MIR 0.07 → ours 6.15 (88×) src=test1 dist=1.4km
# Patrón Test 1 path acepta 56-86 pixels cluster cerca lacolito.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-03-01"
      end:
        description: "End date YYYY-MM-DD (inclusive)"
        required: true
        default: "2026-05-19"

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml

      - name: Run reprocess — _local_kernel_bg_enabled / PuyehueCordonCaulle
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 280
        run: |
          python scripts/run_pipeline.py \
            --profile _local_kernel_bg_enabled \
            --volcano PuyehueCordonCaulle \
            --start ${{ github.event.inputs.start }} \
            --end ${{ github.event.inputs.end }} \
            --overwrite

      - name: Commit reprocessed A/B data
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add "data/_local_kernel_bg_enabled/PuyehueCordonCaulle.json" 2>/dev/null
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "S63 A/B local kernel bg — PCC ${{ github.event.inputs.start }}→${{ github.event.inputs.end }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed, sleeping $((attempt * 10))s"
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1
