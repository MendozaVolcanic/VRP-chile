name: A/B reproceso P3.1 dual-ROI (S24)

# Workflow dispatch-only para validación cuantitativa del fix P3.1 (dual-ROI
# thresholds Coppola 2016a Table 2). S15 implementó pero nunca midió la
# contribución aislada vs P3.2 single-ROI.
#
# Profiles paralelos:
#   _p3_1_enabled  → enable_dnti_dual_roi=true  (igual al operacional)
#   _p3_1_disabled → enable_dnti_dual_roi=false (control)
# Ambos escriben a data/<profile_subdir>/, NO contaminan data/mirova_equivalent/.
#
# Volcanes: 4 Tier A donde P3.1 debería tener mayor impacto (Lastarria
# documentado pre-P3.1 con cluster Lazufre 15-25 km).

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-04-12"
      end:
        description: "End date YYYY-MM-DD (inclusive)"
        required: true
        default: "2026-04-25"

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        volcano: [Lascar, Lastarria, Tupungatito, Chaiten]
        profile: [_p3_1_enabled, _p3_1_disabled]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml

      - name: Run reprocess — ${{ matrix.profile }} / ${{ matrix.volcano }}
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 50
        run: |
          python scripts/run_pipeline.py \
            --profile ${{ matrix.profile }} \
            --volcano ${{ matrix.volcano }} \
            --start ${{ github.event.inputs.start }} \
            --end ${{ github.event.inputs.end }} \
            --overwrite

      - name: Commit reprocessed A/B data
        # Mismo patrón anti-conflict que nrt.yml: SOLO el archivo del volcán
        # de este job, en el data_subdir aislado del profile.
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add "data/${{ matrix.profile }}/${{ matrix.volcano }}.json" 2>/dev/null
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "S24 A/B P3.1 — ${{ matrix.profile }} / ${{ matrix.volcano }} 14d"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed, sleeping $((attempt * 10))s"
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1
