name: S112 reproc Test1-lowmag A/B (Parte B, A45)

# A43: "on" quoted (Norway Problem). A/B de calibracion de la magnitud "Muy Bajo" del
# Test1 (reactivacion NdC). 9 brazos (Q0-Q6) x 3 nevados (NdC/Lascar/Lastarria) x 2
# VENTANAS ESTRECHAS = 54 jobs. TARGETED a las fechas ALERTA + muestra RUTINA (NO 3
# meses — A15/A26: el v1 con chunks de 5 semanas tardaba ~87min/job=~20h por bajar
# cientos de granules NASA; LANCE lento en fechas recientes A64). w1 captura NdC ALERTAS
# 05-02+05-14 + RUTINA; w2 captura NdC 06-16 + RUTINA. Cada job aislado sube su artifact
# (sin race A47). Todos los brazos llevan Parte A ON salvo q0_control.
"on":
  workflow_dispatch:

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        profile:
          - _t1lm_q0_control
          - _t1lm_q2_global
          - _t1lm_q3_ring24
          - _t1lm_q3_ring35
          - _t1lm_q3_ring15
          - _t1lm_q4_te700
          - _t1lm_q4_te1000
          - _t1lm_q5_ntilocal
          - _t1lm_q6_spatialcore
        volcano: [NevadosDeChillan, Lascar, Lastarria]
        chunk:
          - { start: "2026-05-01", end: "2026-05-15" }
          - { start: "2026-06-12", end: "2026-06-17" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf earthaccess numpy h5py scipy pyyaml
      - name: Reprocess ${{ matrix.profile }} / ${{ matrix.volcano }} / ${{ matrix.chunk.start }}
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 290
        run: |
          python scripts/run_pipeline.py \
            --profile ${{ matrix.profile }} \
            --volcano ${{ matrix.volcano }} \
            --start ${{ matrix.chunk.start }} \
            --end ${{ matrix.chunk.end }} \
            --overwrite
      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: s112t1lm-${{ matrix.profile }}-${{ matrix.volcano }}-${{ matrix.chunk.start }}
          path: data/${{ matrix.profile }}/${{ matrix.volcano }}.json
          if-no-files-found: warn
          retention-days: 7
