name: Reproc D8 + D4 per-volcano 15d (S39)

# A/B target: validar combo vent_anchored (adoptado S38) + D4 per-volcano
# en Lascar + Lastarria (volcanoes.yaml field lbg_global_compatible=true).
#
# Baseline para comparación: data/mirova_equivalent (operacional ya con
# vent_anchored + H8 desde S38 — no necesita perfil disabled separado).
#
# Solo 11 jobs (1 perfil × 11 vol) porque comparamos contra operacional ya
# adoptado, no contra control aislado. Mide delta del D4 fix selectivo.
#
# Predicción: recall 89.5% (operacional S38) → 91-92% si D4 captura 4-5
# FN Lascar/Lastarria. Tupungatito y Planchón sin cambio (lbg_global_compatible=false).

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-04-27"
      end:
        description: "End date YYYY-MM-DD (inclusive)"
        required: true
        default: "2026-05-11"

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        volcano: [Lascar, Lastarria, Tupungatito, PuyehueCordonCaulle, Isluga, PlanchonPeteroa, Villarrica, Llaima, Copahue, NevadosDeChillan, Chaiten]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml

      - name: Run reprocess — _d8_d4_per_vol / ${{ matrix.volcano }}
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 100
        run: |
          python scripts/run_pipeline.py \
            --profile _d8_d4_per_vol \
            --volcano ${{ matrix.volcano }} \
            --start ${{ github.event.inputs.start }} \
            --end ${{ github.event.inputs.end }} \
            --overwrite

      - name: Commit reprocessed data
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add "data/_d8_d4_per_vol/${{ matrix.volcano }}.json" 2>/dev/null
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "S39 D4 per-vol A/B — _d8_d4_per_vol / ${{ matrix.volcano }} ${{ github.event.inputs.start }}→${{ github.event.inputs.end }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed, sleeping $((attempt * 10))s"
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1
