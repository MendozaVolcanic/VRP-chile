name: S97 refresh reproc VIIRS (operacional, staging aislado)

# Workflow dispatch-only. Reproc VIIRS (375+750) de RANGO COMPLETO con el codigo
# actual (main, #294 + #297) hacia el staging _s97_refresh_viirs, para el REFRESH
# OPERACIONAL S97. Procedencia limpia: una sola corrida por (volcan, ventana).
#
# Se dispara en CHUNKS mensuales SECUENCIALES (start/end inputs) para respetar el
# limite de 6h por job de GH Actions: cada chunk ~30 dias entra holgado. Los chunks
# acumulan en el mismo dir (store.py deduplica por (fecha,sensor)); dispatch
# SECUENCIAL evita el race del pull --rebase -X theirs sobre el mismo archivo (S25).
#
# Matrix POR VOLCAN (sin race intra-dispatch). MODIS se reusa de _s94_reproc_modis.
# Promocion a operacional = OK Nicolas + tag defensivo (A45).
#
# A43 Norway problem: "on": quoted.

"on":
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-05-01"
      end:
        description: "End date YYYY-MM-DD inclusive"
        required: true
        default: "2026-05-31"

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        volcano:
          - Tupungatito
          - PuyehueCordonCaulle
          - Lascar
          - Villarrica
          - PlanchonPeteroa
          - Lastarria
          - Isluga
          - Copahue
          - Chaiten
          - Llaima
          - NevadosDeChillan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml

      - name: Run reprocess — _s97_refresh_viirs / ${{ matrix.volcano }}
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 340
        run: |
          python scripts/run_pipeline.py \
            --profile _s97_refresh_viirs \
            --volcano ${{ matrix.volcano }} \
            --start ${{ github.event.inputs.start }} \
            --end ${{ github.event.inputs.end }} \
            --overwrite

      - name: Commit reprocessed refresh data
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add "data/_s97_refresh_viirs/${{ matrix.volcano }}.json" 2>/dev/null
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "S97 refresh — reproc VIIRS ${{ matrix.volcano }} ${{ github.event.inputs.start }}->${{ github.event.inputs.end }}"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed, sleeping $((attempt * 10))s"
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1
