name: "Probe S158, M15 en sentinela junto al crater en VIIRS 750 (solo lectura)"

# Mide si las alertas de MIROVA de VIIRS 750 que el detector K no publica tocan pixeles con M15 en sentinela y M13
# sano (el lector los deja en NaN y el pixel pierde su NTI), y corre el procesador de produccion con y sin esos M15
# rellenos. Diseno, controles y predicciones escritos ANTES de correr: experiments/_s158_v750/README.md y
# probe_m15.py. Solo lectura: no escribe en data/, no commitea, no hace push; el resultado queda como artefacto.
# Se dispara con un push a la rama s158-v750-probe (workflow_dispatch solo existe desde main, S73).
# A43: "on" entre comillas. S141: pipefail con tee; el script sale 2 si falta una pasada.
# A71: autentica SOLO por EARTHDATA_TOKEN y falla al instante si viene vacio. Grupo de concurrencia propio; no usa
# el grupo del A/B de D25 (s146-ab-sin-test1).
# A15: 116 granulos VIIRS M (L1B + GEO), ~2 a 3 min cada uno con las dos corridas -> 29 por parte, 60 a 90 min;
# timeout 150.
"on":
  push:
    branches: ["s158-v750-probe"]
  workflow_dispatch:

concurrency:
  group: probe-s158-v750-m15
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        parte: [0, 1, 2, 3]
    steps:
      - name: Token presente
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then echo "EARTHDATA_TOKEN vacio: no se corre (A71)"; exit 1; fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml pyproj pandas
      - name: Prueba sintetica (C-SIN)
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/_s158_v750/prueba_probe_m15.py 2>&1 | tee out/prueba_${{ matrix.parte }}.txt
      - name: Probe
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          VRP_PROFILE: mirova_equivalent
          VRP_TMP_DIR: ${{ runner.temp }}/vrp_tmp
        run: |
          set -o pipefail
          python experiments/_s158_v750/probe_m15.py --parte ${{ matrix.parte }} --partes 4 --out out \
            2>&1 | tee out/probe_${{ matrix.parte }}.log
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s158-v750-m15-parte${{ matrix.parte }}
          path: |
            out/*.json
            out/*.txt
            out/*.log
          retention-days: 30
          if-no-files-found: error
