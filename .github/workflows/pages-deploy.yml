name: Deploy GitHub Pages

# Standalone Pages deploy. Decoupled from the NRT pipeline so frontend
# and data changes ship to the live site even when the cron is paused
# (e.g. during the session 9 fork migration).
#
# Triggers:
#   - Direct push to main that touches frontend/ or data/
#   - workflow_dispatch (manual fire from the Actions tab)
#   - workflow_run after the NRT pipeline finishes successfully
#     (because GITHUB_TOKEN-authored commits do not re-trigger `push`)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/**"
      - "imagenes/**"
      - "01_05_2026_registro_vrp_consolidado.csv"
      - "latest_consolidado.csv"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["NRT VRP Pipeline (both profiles)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy; cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # S62 (2026-05-19): deploy aunque NRT pipeline tenga failures parciales.
    # El NRT cron tiene matrix 45 vols con fail-fast=false. Cuando un vol
    # NO-Tier-A (ej. SanJose, Antillanca) sufre NASA timeout intermitente,
    # workflow_run.conclusion = 'failure' aunque los Tier A (Villarrica,
    # PCC, etc.) hayan committed data nuevos a main.
    # Previa condición `== 'success'` causaba skip deploy → dashboard live
    # 12-36h desactualizado. Cambio: deploy si NO está cancelled.
    # Casos cubiertos:
    #   - workflow_run conclusion=success → deploy ✓
    #   - workflow_run conclusion=failure → deploy ✓ (Tier A pueden estar OK)
    #   - workflow_run conclusion=cancelled → skip (no hay artefactos válidos)
    #   - event != workflow_run → siempre deploy (push, manual dispatch)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -r frontend/. _site/
          cp -r data _site/data
          # S33: copiar CSV consolidado MIROVA NRT para que diario.html pueda
          # mostrar la curva de referencia MIROVA en el chart timeline.
          # S73 (dehardcode): copiar latest_consolidado.csv (alias al CSV más
          # reciente del scraper Mirova-v1, consumido por diario.html como
          # fuente primaria) + el snapshot fechado (fallback). Cuando llegue
          # un nuevo consolidado solo hay que regenerar latest_consolidado.csv
          # apuntando al archivo nuevo — el frontend lo consume sin tocar
          # código ni este workflow.
          cp latest_consolidado.csv _site/ 2>/dev/null || true
          cp 01_05_2026_registro_vrp_consolidado.csv _site/ 2>/dev/null || true
          # S77 F30 P3 — galería imágenes MIROVA. PNGs scrape de mirovaweb
          # (live snapshots por volcán/sensor/plot), consumidos por
          # frontend/index.html sección "Imágenes MIROVA". TIFs/KMZs viven
          # en mirova-tif-archive/ (fuera del repo, sólo máquina local) —
          # GH Pages no los publica; el dashboard muestra fallback.
          cp -r imagenes _site/imagenes 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
