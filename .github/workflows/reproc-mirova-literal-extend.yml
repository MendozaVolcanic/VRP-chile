name: Reproceso MIROVA literal — 11 Tier A 90d (S27)

# Workflow dispatch-only para reprocesar los 11 volcanes Tier A con
# _mirova_literal sobre 90 días de historia (default 2026-01-29 → 2026-04-29).
#
# Objetivo: dashboard coherente con 11 Tier A bajo MIROVA literal.
# El operacional pre-S27 está preservado en git tag pre-s27-baseline.
#
# Histórico: el A/B principal (reproc-ab-mirova-literal.yml) usó 14d para
# el delta report. Este workflow extiende a 90d para visibilidad operacional.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-01-29"
      end:
        description: "End date YYYY-MM-DD (inclusive)"
        required: true
        default: "2026-04-29"

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        volcano:
          - Lascar
          - Lastarria
          - Tupungatito
          - Villarrica
          - PuyehueCordonCaulle
          - Copahue
          - NevadosDeChillan
          - Llaima
          - Chaiten
          - PlanchonPeteroa
          - Isluga
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml

      - name: Run reprocess — _mirova_literal / ${{ matrix.volcano }}
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 80
        run: |
          python scripts/run_pipeline.py \
            --profile _mirova_literal \
            --volcano ${{ matrix.volcano }} \
            --start ${{ github.event.inputs.start }} \
            --end ${{ github.event.inputs.end }} \
            --overwrite

      - name: Commit reprocessed data
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add "data/_mirova_literal/${{ matrix.volcano }}.json" 2>/dev/null
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "S27 reproc MIROVA literal 11Tier-A 90d — ${{ matrix.volcano }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed, sleeping $((attempt * 10))s"
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1
