name: Vigilancia de la guardia K de VIIRS

# S176 (regla experiments/_s176_v375e_adopcion/REGLA_REVERSION_V375E_BORRADOR.md §4; diseño
# docs/superpowers/specs/2026-11-08-encendido-v375e-design.md, decisiones 3 y 7). Calcado de vigilancia-guardia-modis.yml.
# POR QUE: con la via «codigo MIROVA» encendida en VIIRS 375 o VIIRS 750, K corre aparte como guardia (guardia-k-viirs.yml).
# Una alerta protegida que MIROVA publica, la guardia publica y produccion calla es el disparador de la reversion
# pre-autorizada, y la regla pide avisar EL MISMO DIA: por eso corre al terminar la guardia. Un job por sensor, con issue
# propio, porque los dos encendidos (B1 y B2) se revierten por separado.
# El workflow NO revierte: abre el issue. La reversion la confirma una persona en la cabecera de la imagen de MIROVA y la
# ejecuta una sesion con git revert del PR de ese sensor.
# A43: "on" quoted (Norway Problem YAML 1.1).
"on":
  workflow_dispatch:
  workflow_run:
    workflows: ["Guardia K de VIIRS (11 Tier A)"]
    types: [completed]
  # Respaldo: si la guardia se renombra, se desactiva o no corre, el workflow_run no llega. Con este cron la vigilancia
  # corre igual una vez al dia y, sin datos frescos de la guardia, abre el issue de vigilancia ciega. 22:55 UTC: despues
  # de la guardia (19:35) y de la vigilancia de MODIS (22:45), en un minuto que no usa ningun otro cron.
  schedule:
    - cron: "55 22 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  # Grupo propio (como vigilancia-guardia-modis): el push tiene su bucle de reintento.
  group: vigilancia-guardia-viirs
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-24.04  # fijado como el NRT: ubuntu-latest migra a 26.04 desde el 2026-10-19
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1   # los dos escriben en data/audit_continuous/
      matrix:
        sensor: [v375, v750]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      # La referencia fresca va a una carpeta temporal: una alerta de anoche tiene que poder disparar hoy.
      - name: Referencia fresca de MIROVA (Mirova-v1)
        run: |
          mkdir -p "$RUNNER_TEMP/ref"
          curl -fsSL -o "$RUNNER_TEMP/ref/registro_vrp_consolidado.csv" \
            https://raw.githubusercontent.com/MendozaVolcanic/Mirova-v1/main/monitoreo_satelital/registro_vrp_consolidado.csv
          curl -fsSL -o "$RUNNER_TEMP/ref/registro_vrp_ocr.csv" \
            https://raw.githubusercontent.com/MendozaVolcanic/Mirova-v1/main/monitoreo_satelital/registro_vrp_ocr.csv

      - name: Vigilancia
        id: vigilancia
        continue-on-error: true
        run: |
          python scripts/vigilancia_guardia_viirs.py --sensor "${{ matrix.sensor }}" \
            --cons "$RUNNER_TEMP/ref/registro_vrp_consolidado.csv" \
            --ocr "$RUNNER_TEMP/ref/registro_vrp_ocr.csv"

      - name: Commit results
        if: steps.vigilancia.outcome == 'success'
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add "data/audit_continuous/guardia_${{ matrix.sensor }}_latest.json" "data/audit_continuous/guardia_${{ matrix.sensor }}_history.jsonl"
          git diff --staged --quiet && { echo "no changes"; exit 0; }
          git commit -m "vigilancia(auto): guardia K de ${{ matrix.sensor }} contra produccion y MIROVA (S176)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed"
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1

      # Un issue por incidente, por sensor y por clase, deduplicado por PREFIJO EXACTO del titulo. Todos los titulos empiezan
      # «Guardia K de VIIRS 375:» o «Guardia K de VIIRS 750:»; un issue abierto a mano sobre la guardia va con otro titulo.
      # always(): si el push falla tras los cinco intentos, el issue de una reversion igual tiene que abrirse.
      - name: Open issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.vigilancia.outcome }}
          SENSOR: ${{ matrix.sensor }}
          LATEST: data/audit_continuous/guardia_${{ matrix.sensor }}_latest.json
          REGLA: experiments/_s176_v375e_adopcion/REGLA_REVERSION_V375E_BORRADOR.md
          JUZGADAS: experiments/_s176_v375e_adopcion/sombra_pasadas_juzgadas_viirs.json
        run: |
          if [ "$SENSOR" = "v375" ]; then ETIQUETA="VIIRS 375"; else ETIQUETA="VIIRS 750"; fi
          abrir() {
            NUM=$(PREFIJO="$1" gh issue list --state open --limit 200 --json number,title --jq '[.[] | select(.title | startswith(env.PREFIJO))][0].number // empty')
            if [ -z "$NUM" ]; then
              gh issue create --title "$1: $(date -u +%F)" --body "$2"
            else
              echo "ya hay un issue abierto de esta clase (#$NUM): se comenta"
              gh issue comment "$NUM" --body "$(printf 'Corrida del %s:\n\n%s' "$(date -u +%F)" "$2")"
            fi
          }
          if [ "$OUTCOME" != "success" ]; then
            abrir "Guardia K de $ETIQUETA: el script fallo" "$(printf 'scripts/vigilancia_guardia_viirs.py --sensor %s no termino (run %s). Mientras no corra, nadie vigila si la via de %s calla alertas que K publicaba.' "$SENSOR" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$ETIQUETA")"
            exit 0
          fi
          VEREDICTO=$(python -c "import json, os; print(json.load(open(os.environ['LATEST']))['veredicto'])")
          echo "veredicto: $VEREDICTO"
          python - <<'PY' > /tmp/detalle.txt
          import json, os
          d = json.load(open(os.environ["LATEST"], encoding="utf-8"))
          e = {"VIIRS375": "VIIRS 375", "VIIRS750": "VIIRS 750"}[d["sensor"]]
          for p in d.get("reversion", []):
              print(f"- REVERSION CANDIDATA: {p['volcano']} {e} {p['fecha_utc']} UTC, MIROVA {p['vrp_mirova_mw']} MW: la guardia (K) publica y produccion (la via) calla")
          for p in d.get("protegidas_sin_record_produccion", []):
              print(f"- SIN RECORD DE PRODUCCION: {p['volcano']} {e} {p['fecha_utc']} UTC, MIROVA {p['vrp_mirova_mw']} MW: la guardia (K) publica y produccion no tiene record")
          for p in d.get("protegidas_calladas_por_k_de_produccion", []):
              print(f"- CALLADA POR K DE PRODUCCION: {p['volcano']} {e} {p['fecha_utc']} UTC, MIROVA {p['vrp_mirova_mw']} MW: la guardia publica y el record de produccion no es de la via ({p.get('prod_caida_k') or 'K sin marca'}); no es candidata a reversion")
          for p in d.get("fuera_de_plazo", []):
              print(f"- FUERA DE PLAZO (sin pre-autorizacion): {p['volcano']} {e} {p['fecha_utc']} UTC, MIROVA {p['vrp_mirova_mw']} MW")
          for p in d.get("borde_del_encendido", []):
              print(f"- borde del encendido: {p['volcano']} {e} {p['fecha_utc']} UTC, anterior al encendido con record de la via")
          for nombre in ("muy_bajo", "sobrepublicacion"):
              m = d.get(nombre) or {}
              if m.get("dispara"):
                  print(f"- {nombre}: {m['k']} sobre la cota {m['cota']} ({m['pasadas']})")
          n = d.get("nulo") or {}
          if n.get("distintas"):
              print(f"- nulo: antes del encendido guardia y produccion publican distinto en {n['distintas']} de {n['pares']} pasadas: {n['detalle']}")
          b = d.get("borde_171_01") or {}
          if b.get("total"):
              print(f"- (informa) pasadas que la guardia registra y produccion no, por semana: {b['por_semana']}")
          for v, i in (d.get("region_sensible") or {}).items():
              print(f"- (informa) region sensible {v}: {i['pares']} pares, solo la guardia {i['solo_guardia']}, solo la via {i['solo_via']}")
          for a in d.get("avisos", []):
              print(f"- aviso: {a}")
          PY
          case "$VEREDICTO" in
            REVERSION_CANDIDATA)
              abrir "Guardia K de $ETIQUETA: candidata a reversion" "$(printf 'La vigilancia encontro una alerta protegida de MIROVA en %s (1 MW o mas) que la guardia (K) publica y produccion (la via codigo MIROVA) calla:\n\n%s\n\nLa regla (%s §4) pre-autoriza revertir el encendido de ESTE sensor con git revert de su PR, DESPUES de confirmar la alerta en la cabecera de la imagen de MIROVA. Avisar a Nicolas hoy. Una vez decidida, anotar la pasada en %s.\nDetalle: %s.' "$ETIQUETA" "$(cat /tmp/detalle.txt)" "$REGLA" "$JUZGADAS" "$LATEST")" ;;
            CANDIDATA_FUERA_DE_PLAZO)
              abrir "Guardia K de $ETIQUETA: candidata fuera de plazo" "$(printf 'La vigilancia encontro una alerta protegida de MIROVA en %s que la guardia publica y produccion calla, pero el plazo de la regla ya se cumplio:\n\n%s\n\nFuera de plazo NO hay reversion pre-autorizada: decide Nicolas. Una vez decidida, anotar la pasada en %s.\nDetalle: %s.' "$ETIQUETA" "$(cat /tmp/detalle.txt)" "$JUZGADAS" "$LATEST")" ;;
            INVESTIGAR)
              abrir "Guardia K de $ETIQUETA: investigar" "$(printf 'La vigilancia de la guardia de %s encontro un disparador de investigacion (sin reversion automatica):\n\n%s\n\nRegla: %s §4. Una pasada ya investigada se anota en %s para que deje de disparar.\nDetalle: %s.' "$ETIQUETA" "$(cat /tmp/detalle.txt)" "$REGLA" "$JUZGADAS" "$LATEST")" ;;
            VIGILANCIA_CIEGA)
              SOLO_CAIDAS=$(python -c "import json, os; print(json.load(open(os.environ['LATEST'])).get('solo_caidas_a_k', False))")
              if [ "$SOLO_CAIDAS" = "True" ]; then
                abrir "Guardia K de $ETIQUETA: caidas a K" "$(printf 'En estas pasadas la via no corrio y produccion escribio K:\n\n%s\n\nEsas pasadas comparan K con K: cuentan como K y no dicen nada de la via. Las demas pasadas siguen siendo de la via y en ellas la vigilancia no encontro disparadores. Si se repite en un volcan, revisar la grilla de MIROVA de esas pasadas.\nDetalle: %s.' "$(cat /tmp/detalle.txt)" "$LATEST")"
              else
                abrir "Guardia K de $ETIQUETA: vigilancia ciega" "$(printf 'La vigilancia de la guardia de %s no puede mirar:\n\n%s\n\nUna vigilancia ciega no da error, da VERDE: por eso este issue. Revisar guardia-k-viirs.yml, nrt.yml y el flag de la via de este sensor.\nDetalle: %s.' "$ETIQUETA" "$(cat /tmp/detalle.txt)" "$LATEST")"
              fi ;;
            *) echo "sin issue" ;;
          esac
