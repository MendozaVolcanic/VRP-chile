name: "Probe S168 MOD-D fase 4, via codigo MIROVA de MODIS contra K con tres posiciones (solo lectura)"

# A/B de la fase 4 de MOD-D. Pre-registro SELLADO: experiments/_s166_modd_f4/PREREGISTRO_MODD_F4.md (tag
# s168-modd-f4-sellado), candado del §11. Arnes: experiments/_s166_modd_f4/probe_f4.py (K y V con
# process_modis.calculate_vrp, V con el flag de la via encendido EN MEMORIA; V-cercano y V-pico con
# evaluar_f4.variante_posicion; los cuatro por store.append_record en un directorio temporal; predicado del tablero con
# node). Re-corrida de K en el codigo_sha del record guardado: experiments/_s162_mxd03/k_en_sha.py, dentro del arnes.
# Solo lectura: no escribe en data/, no commitea, NO hace push; todo queda como artefacto.
# Solo workflow_dispatch (existe desde main, S73), despachado SIEMPRE con --ref <tag del candado> y el mismo tag en el
# input `tag`: cada job comprueba que corre en el commit de ese tag (procedencia, §8.8). Una tanda a la vez:
#   head_e  solo el HEAD de los L1B y MxD03 del tramo E (head_e.py --con-token), sin tag
#   humo    las 25 pasadas de experiments/_s166_modd_f4/humo_f4.txt (Lascar 2026-04-25 07:35 y Chillan 2026-10-25 07:20
#           incluidas), en un job
#   t1      partes 0 a 7     t2  partes 8 a 15     t3  partes 16 a 23   (las 24 partes de poblacion_f4.json)
# A43: "on" entre comillas. S141: pipefail con tee. A71: autentica SOLO por EARTHDATA_TOKEN (la linea del bloque env de
# nrt.yml, sin el par usuario y clave, que esta vencido) y falla al instante si viene vacio. MODIS solo en Linux (pyhdf).
# A15: el censo MOD-D midio 9,1 s por pasada con descarga, K y cinco variantes del port; una parte son unas 238 pasadas
# (5.709 / 24): ~36 min mas la bajada y las re-corridas en su sha; timeout 240 min (mas de 1,3 x, como MOD-D).
# S168 (P2-08): dependencias con version fija (las mismas con que se probo el candado en local), para que t1, t2 y
# t3, despachadas en momentos distintos, no corran dos pipelines (A108). Las transitivas no quedan fijas.
"on":
  workflow_dispatch:
    inputs:
      modo:
        description: "head_e | humo | t1 | t2 | t3"
        required: true
        type: choice
        options: ["head_e", "humo", "t1", "t2", "t3"]
      tag:
        description: "tag del candado (el mismo de --ref); vacio solo en modo head_e"
        required: false
        default: ""

concurrency:
  group: probe-s168-modd-f4
  cancel-in-progress: false

env:
  BLOB_D25: "1dbabf657407b6db0f91d9e2fc98eb16a8051873"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      partes: ${{ steps.p.outputs.partes }}
      humo: ${{ steps.p.outputs.humo }}
      sonda: ${{ steps.p.outputs.sonda }}
    steps:
      - id: p
        env:
          MODO: ${{ github.event.inputs.modo }}
          F4_TAG: ${{ github.event.inputs.tag }}
        run: |
          case "$MODO" in
            head_e) echo 'partes=[]' >> "$GITHUB_OUTPUT"; echo 'humo=' >> "$GITHUB_OUTPUT"; echo 'sonda=false' >> "$GITHUB_OUTPUT" ;;
            humo) echo 'partes=[0]' >> "$GITHUB_OUTPUT"; echo 'humo=--humo' >> "$GITHUB_OUTPUT"; echo 'sonda=true' >> "$GITHUB_OUTPUT" ;;
            t1) echo 'partes=[0,1,2,3,4,5,6,7]' >> "$GITHUB_OUTPUT"; echo 'humo=' >> "$GITHUB_OUTPUT"; echo 'sonda=true' >> "$GITHUB_OUTPUT" ;;
            t2) echo 'partes=[8,9,10,11,12,13,14,15]' >> "$GITHUB_OUTPUT"; echo 'humo=' >> "$GITHUB_OUTPUT"; echo 'sonda=true' >> "$GITHUB_OUTPUT" ;;
            t3) echo 'partes=[16,17,18,19,20,21,22,23]' >> "$GITHUB_OUTPUT"; echo 'humo=' >> "$GITHUB_OUTPUT"; echo 'sonda=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "modo desconocido $MODO"; exit 1 ;;
          esac
          if [ "$MODO" != "head_e" ]; then
            if [ -z "$F4_TAG" ]; then echo "::error::falta el input tag: el probe solo corre desde el tag del candado"; exit 1; fi
            if [ "$GITHUB_REF" != "refs/tags/$F4_TAG" ]; then
              echo "::error::despachado desde $GITHUB_REF y no desde refs/tags/$F4_TAG"; exit 1
            fi
          fi

  head_e:
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: HEAD de los archivos del tramo E (si head_e.py existe en el commit)
        run: |
          set -o pipefail
          mkdir -p out
          if [ ! -f experiments/_s166_modd_f4/head_e.py ]; then
            echo "head_e.py no existe en este commit: no se corre" | tee out/head_e.log; exit 0
          fi
          if [ -z "$EARTHDATA_TOKEN" ]; then
            echo "::error::EARTHDATA_TOKEN vacío. Sin token no se procesa nada, y el login por usuario y clave vencido bloquea la cuenta (A71)."
            exit 1
          fi
          pip install --upgrade pip
          pip install requests==2.33.1
          echo "commit $(git rev-parse HEAD) ref ${GITHUB_REF}" | tee out/procedencia_head_e.txt
          python experiments/_s166_modd_f4/head_e.py --con-token --salida out/head_e.json 2>&1 | tee out/head_e.log
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s168-modd-f4-${{ github.event.inputs.modo }}-head_e
          path: |
            out/*.json
            out/*.log
            out/*.txt
          retention-days: 30
          if-no-files-found: ignore

  prueba:
    needs: [plan]
    if: ${{ needs.plan.outputs.sonda == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install --upgrade pip
          pip install earthaccess==0.17.0 numpy==2.4.4 h5py==3.16.0 scipy==1.17.1 pyyaml==6.0.3 pyproj==3.7.2 pandas==3.0.2
          node --version
      - name: Commit del tag y blob sellado de evaluar_d25
        env:
          F4_TAG: ${{ github.event.inputs.tag }}
        run: |
          git fetch --depth 1 origin "refs/tags/$F4_TAG:refs/tags/$F4_TAG"
          test "$(git rev-parse "$F4_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "$(git hash-object experiments/_s157_prereg_d25/evaluar_d25.py)" = "$BLOB_D25"
      - name: Manifiesto del candado
        env:
          VRP_PROFILE: mirova_equivalent
        run: |
          set -o pipefail
          python -I experiments/_s166_modd_f4/manifiesto_candado_f4.py --comprobar 2>&1 | tee prueba_manifiesto.log
      - name: Bateria sin red del arnes (con mutaciones) y del evaluador sellado (contra el real y contra el vacio)
        env:
          VRP_PROFILE: mirova_equivalent
        run: |
          set -o pipefail
          python -I experiments/_s166_modd_f4/probar_probe_f4.py 2>&1 | tee prueba_arnes.log
          python -I experiments/_s166_modd_f4/probar_evaluar_f4.py 2>&1 | tee prueba_evaluador.log
          ! python -I experiments/_s166_modd_f4/probar_evaluar_f4.py \
              --modulo experiments/_s166_modd_f4/evaluar_vacio.py > prueba_evaluador_vacio.log 2>&1
          if ! grep -q " 0 OK, " prueba_evaluador_vacio.log || ! grep -q " 0 caen" prueba_evaluador_vacio.log; then
            echo "contra el evaluador vacio alguna prueba paso o cayo"; exit 1
          fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s168-modd-f4-${{ github.event.inputs.modo }}-prueba
          path: prueba_*.log
          retention-days: 30

  probe:
    needs: [plan, prueba]
    if: ${{ needs.plan.outputs.sonda == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        parte: ${{ fromJSON(needs.plan.outputs.partes) }}
    env:
      # S72 EARTHDATA_TOKEN (linea del bloque env de nrt.yml). Sin EARTHDATA_USERNAME ni EARTHDATA_PASSWORD: el par
      # esta vencido y bloquea la cuenta (A71, CLAUDE.md «Constraints técnicos»).
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      F4_TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Token presente
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then
            echo "::error::EARTHDATA_TOKEN vacío. Sin token no se procesa nada, y el login por usuario y clave vencido bloquea la cuenta (A71)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf==0.11.6
          pip install earthaccess==0.17.0 numpy==2.4.4 h5py==3.16.0 scipy==1.17.1 pyyaml==6.0.3 pyproj==3.7.2 pandas==3.0.2
          node --version
      - name: Procedencia (commit del tag), blob de evaluar_d25 y manifiesto
        env:
          VRP_PROFILE: mirova_equivalent
        run: |
          git fetch --depth 1 origin "refs/tags/$F4_TAG:refs/tags/$F4_TAG"
          test "$(git rev-parse "$F4_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "$(git hash-object experiments/_s157_prereg_d25/evaluar_d25.py)" = "$BLOB_D25"
          python -I experiments/_s166_modd_f4/manifiesto_candado_f4.py --comprobar
          echo "tag $F4_TAG = commit $(git rev-parse HEAD); blob OK; manifiesto OK"
      - name: Arnes
        env:
          VRP_PROFILE: mirova_equivalent
          VRP_TMP_DIR: ${{ runner.temp }}/vrp_tmp
          HUMO: ${{ needs.plan.outputs.humo }}
        run: |
          set -o pipefail
          mkdir -p out "$VRP_TMP_DIR"
          echo "commit $(git rev-parse HEAD) ref ${GITHUB_REF} tag ${F4_TAG} parte ${{ matrix.parte }}" \
            | tee out/procedencia_${{ matrix.parte }}.txt
          python experiments/_s166_modd_f4/probe_f4.py --parte ${{ matrix.parte }} --de 24 --out out $HUMO \
            2>&1 | tee out/probe_${{ matrix.parte }}.log
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s168-modd-f4-${{ github.event.inputs.modo }}-parte-${{ matrix.parte }}
          path: |
            out/*.jsonl
            out/*.log
            out/*.txt
            out/grillas/*.npz
          retention-days: 30
          if-no-files-found: error
