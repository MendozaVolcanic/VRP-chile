name: Reproc operacional Villarrica + PlanchonPeteroa (S61 fix dashboard refresh)

# S61 post-adoption: el cron NRT cada 2h solo procesa el día corriente.
# Records ALERTAS pre-merge (04-09, 05-11, 05-14, 05-17) en el JSON operacional
# siguen mostrando magnitudes LEGACY (ratios 12-65x vs MIROVA NRT).
#
# Este workflow reprocesa Villarrica + PlanchonPeteroa con el perfil
# mirova_equivalent (enable_local_kernel_bg=true post-S61) en el rango deseado.
# Sobreescribe data/mirova_equivalent/<vol>.json y refresca dashboard.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-04-01"
      end:
        description: "End date YYYY-MM-DD (inclusive)"
        required: true
        default: "2026-05-19"

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        volcano: [Villarrica, PlanchonPeteroa]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml

      - name: Run reprocess — mirova_equivalent / ${{ matrix.volcano }}
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 280
        run: |
          python scripts/run_pipeline.py \
            --profile mirova_equivalent \
            --volcano ${{ matrix.volcano }} \
            --start ${{ github.event.inputs.start }} \
            --end ${{ github.event.inputs.end }} \
            --overwrite

      - name: Commit refreshed operational data
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add "data/mirova_equivalent/${{ matrix.volcano }}.json" 2>/dev/null
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "S61 reproc operacional — ${{ matrix.volcano }} ${{ github.event.inputs.start }}→${{ github.event.inputs.end }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed, sleeping $((attempt * 10))s"
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1
