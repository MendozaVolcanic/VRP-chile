name: Reproceso Villarrica vs 6 refs MIROVA (S25 Test 1 final validation)

# Workflow dispatch-only para validar Path Test 1 contra las 6 ALERTAs MIROVA
# Villarrica (jan-mar 2026), fuera de la ventana 14d del A/B previo.
#
# Procesa 5 ventanas de 3 días alrededor de cada ref MIROVA:
#   - 2026-04-08 a 2026-04-10 (ref 04-09, VRP 0.110 MW)
#   - 2026-03-07 a 2026-03-09 (ref 03-08, VRP 0.210 MW)
#   - 2026-02-25 a 2026-02-27 (ref 02-26, VRP 0.120 MW)
#   - 2026-01-18 a 2026-01-20 (ref 01-19, VRP 0.090 MW)
#   - 2026-01-12 a 2026-01-15 (refs 01-13 + 01-14, VRP 0.05/0.07)
#
# Solo Villarrica × 2 profiles = 10 jobs paralelos. ~15 min wall-clock.
# NO usa --overwrite: el dedup en store.append_record evita duplicación
# y preserva los registros del A/B previo (14d 2026-04-12 a 2026-04-25).

on:
  workflow_dispatch:

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        profile: [_test1_enabled, _test1_disabled]
        window:
          - { start: "2026-04-08", end: "2026-04-10" }
          - { start: "2026-03-07", end: "2026-03-09" }
          - { start: "2026-02-25", end: "2026-02-27" }
          - { start: "2026-01-18", end: "2026-01-20" }
          - { start: "2026-01-12", end: "2026-01-15" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml

      - name: Run reprocess — ${{ matrix.profile }} / ${{ matrix.window.start }} to ${{ matrix.window.end }}
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 50
        run: |
          python scripts/run_pipeline.py \
            --profile ${{ matrix.profile }} \
            --volcano Villarrica \
            --start ${{ matrix.window.start }} \
            --end ${{ matrix.window.end }}

      - name: Commit reprocessed data (Villarrica only)
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add "data/${{ matrix.profile }}/Villarrica.json" 2>/dev/null
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "S25 Test 1 — ${{ matrix.profile }} / Villarrica ${{ matrix.window.start }}-${{ matrix.window.end }}"
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed, sleeping $((attempt * 15))s"
            git rebase --abort 2>/dev/null
            sleep $((attempt * 15))
          done
          echo "all push attempts failed"; exit 1
