name: S104 A/B Test1 co-validación NTI

# A/B del fix S104: co-validación NTI del Test1 integrado (realineamiento MIROVA).
# Brazos enabled/disabled (perfiles aislados, data_subdir propio). Vols: 3 nevados
# afectados (Tupun/Villarrica/Llaima) + 2 controles (Lascar árido, Lastarria
# fumarólico — NO deben cambiar). Artifacts, NO commitea (A47). Análisis con
# experiments/_s104_roi_probe/audit_ab_test1_nti.py. A43 "on" quoted.
"on":
  workflow_dispatch:

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        volcano:
          - Tupungatito
          - Villarrica
          - Llaima
          - Lascar
          - Lastarria
        profile:
          - _test1_nti_covalidation_enabled
          - _test1_nti_covalidation_disabled
        chunk:
          - { start: "2026-01-29", end: "2026-03-31" }
          - { start: "2026-04-01", end: "2026-06-08" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (pyhdf for MODIS)
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf earthaccess numpy h5py scipy pyyaml
      - name: Reprocess ${{ matrix.profile }} / ${{ matrix.volcano }} / ${{ matrix.chunk.start }}
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 290
        run: |
          python scripts/run_pipeline.py \
            --profile ${{ matrix.profile }} \
            --volcano ${{ matrix.volcano }} \
            --start ${{ matrix.chunk.start }} \
            --end ${{ matrix.chunk.end }} \
            --overwrite
      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: s104-${{ matrix.profile }}-${{ matrix.volcano }}-${{ matrix.chunk.start }}
          path: data/${{ matrix.profile }}/${{ matrix.volcano }}.json
          if-no-files-found: warn
          retention-days: 7
