name: NRT Healthcheck (Tier A staleness)

# S85 A58: healthcheck diario que detecta Tier A con records stale.
# Complemento del assertion per-step A57 (nrt.yml): si un Tier A no se
# actualiza por >48h y el step de assertion no fired (porque pipeline
# legítimamente fallaba por NASA outage, o el workflow no corrió), este
# cron lo detecta y abre un issue automático.
#
# Diferencia con assertion A57:
#   - A57 (per-step) detecta T+72h "live" dentro del NRT cron. Falla el
#     step y deja badge rojo.
#   - A58 (este healthcheck) detecta T+48h "pasivo" 1×/día independiente
#     del NRT, y abre issue con resumen de qué vols están stale. Más
#     visible que un badge rojo intermitente.
#
# Idempotencia: si ya hay issue abierto con label `nrt-stale`, agrega
# comment en vez de duplicar.

"on":
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC diario
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Detect stale Tier A
        id: detect
        run: |
          python - <<'PYEOF'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          TIER_A = [
              "Lascar", "PuyehueCordonCaulle", "Lastarria", "Isluga",
              "Tupungatito", "PlanchonPeteroa", "Chaiten", "Villarrica",
              "NevadosDeChillan", "Llaima", "Copahue",
          ]
          THRESHOLD_H = 48
          now = datetime.now(timezone.utc)
          stale = []
          ok = []
          missing = []

          for vol in TIER_A:
              p = Path(f"data/mirova_equivalent/{vol}.json")
              if not p.exists():
                  missing.append(vol)
                  continue
              try:
                  d = json.loads(p.read_text())
              except Exception as e:
                  stale.append((vol, f"PARSE_ERROR: {e}", None))
                  continue
              records = d.get("records", [])
              if not records:
                  stale.append((vol, "0 records", None))
                  continue
              last = records[-1].get("datetime_utc") or records[-1].get("acq_datetime_utc")
              if not last:
                  stale.append((vol, "schema sin datetime_utc", None))
                  continue
              try:
                  s = last.replace("Z", "+00:00")
                  last_dt = datetime.fromisoformat(s)
                  if last_dt.tzinfo is None:
                      last_dt = last_dt.replace(tzinfo=timezone.utc)
              except Exception:
                  stale.append((vol, f"datetime parse error: {last}", None))
                  continue
              age_h = (now - last_dt).total_seconds() / 3600
              if age_h > THRESHOLD_H:
                  stale.append((vol, last, age_h))
              else:
                  ok.append((vol, last, age_h))

          # Generar reporte
          lines = []
          lines.append(f"# NRT Healthcheck — {now.strftime('%Y-%m-%d %H:%M UTC')}")
          lines.append("")
          lines.append(f"Threshold: **{THRESHOLD_H}h**")
          lines.append("")
          if stale:
              lines.append(f"## STALE ({len(stale)}/{len(TIER_A)} Tier A)")
              lines.append("")
              lines.append("| Volcán | last_record | edad (h) |")
              lines.append("|---|---|---:|")
              for vol, last, age in stale:
                  age_str = f"{age:.1f}" if age is not None else "—"
                  lines.append(f"| {vol} | `{last}` | {age_str} |")
              lines.append("")
          if missing:
              lines.append(f"## MISSING ({len(missing)} JSONs no encontrados)")
              lines.append("")
              for v in missing:
                  lines.append(f"- {v}")
              lines.append("")
          if ok:
              lines.append(f"## OK ({len(ok)}/{len(TIER_A)})")
              lines.append("")
              lines.append("| Volcán | last_record | edad (h) |")
              lines.append("|---|---|---:|")
              for vol, last, age in sorted(ok, key=lambda x: x[2]):
                  lines.append(f"| {vol} | `{last}` | {age:.1f} |")

          report = "\n".join(lines)
          Path("healthcheck_report.md").write_text(report)
          print(report)

          # Output flags para steps siguientes
          # S123: max_age_h alimenta el escalonamiento de notificaciones.
          edades = [a for _, _, a in stale if a is not None]
          max_age_h = max(edades) if edades else 0.0
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"stale_count={len(stale)}\n")
              f.write(f"missing_count={len(missing)}\n")
              f.write(f"ok_count={len(ok)}\n")
              f.write(f"max_age_h={max_age_h:.1f}\n")

          # Step summary
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(report)
          PYEOF

      # S123 — notificar por INCIDENTE, no por corrida.
      #
      # El problema que resuelve: en la caída del 23-jul→04-ago (13 días) los
      # tres canales de alerta juntos emitieron ~180 avisos para UN incidente
      # (~9 correos/día del gate A57 + 4 comentarios/día de nrt-monitor + 1 de
      # este healthcheck). Ese volumen entrena a ignorar los correos, que es
      # exactamente lo contrario de lo que una alerta debe lograr.
      #
      # Regla: la información que cambia día a día (la edad en horas) NO merece
      # una notificación — se refleja EDITANDO el cuerpo del issue, que no
      # notifica. Solo se comenta (= se notifica) al CRUZAR un escalón, porque
      # ahí cambia lo que hay que hacer. Escalones: 48h (apertura) → 72h →
      # 7 días → 14 días → 30 días.
      #
      # El step corre SIEMPRE (no solo con stale) porque la otra mitad del
      # problema es que ningún canal avisaba la RECUPERACIÓN: #498 quedó
      # abierto 5 días con el sistema ya sano y #336 lleva abierto desde el
      # 04-jun. Un semáforo que solo sabe ponerse en rojo deja de ser semáforo.
      - name: Notificar por escalón (o cerrar si se recuperó)
        if: always() && steps.detect.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STALE_COUNT: ${{ steps.detect.outputs.stale_count }}
          MISSING_COUNT: ${{ steps.detect.outputs.missing_count }}
          MAX_AGE_H: ${{ steps.detect.outputs.max_age_h }}
        run: |
          python - <<'PYEOF'
          import json, os, subprocess, sys
          from pathlib import Path

          REPO = os.environ["GH_REPO"]
          TITLE = "NRT staleness — Tier A con records >48h"
          LABEL = "nrt-stale"
          MARK = "<!-- s123-escalon:"

          stale = int(os.environ.get("STALE_COUNT") or 0)
          missing = int(os.environ.get("MISSING_COUNT") or 0)
          max_age = float(os.environ.get("MAX_AGE_H") or 0)
          hay_problema = stale > 0 or missing > 0

          fallos_gh = []

          def gh(*args, stdin=None):
              # S124: este es el canal de alerta ACCIONABLE unico desde S123. Si
              # `gh` falla (rate limit, permisos, GitHub caido) y solo imprimimos
              # un WARN, el workflow termina success y la alerta se pierde sin que
              # nadie se entere — un canal de alerta que puede fallar mudo no es un
              # canal de alerta. Se acumulan los fallos y el step sale != 0 al final.
              r = subprocess.run(["gh", *args], capture_output=True, text=True,
                                 encoding="utf-8", input=stdin)
              if r.returncode != 0:
                  msg = f"gh {' '.join(args[:3])}: {r.stderr.strip()[:200]}"
                  print(f"WARN {msg}")
                  fallos_gh.append(msg)
              return r.stdout.strip()

          # Escalones de MAYOR a menor: el primero que la edad alcanza.
          ESCALONES = [(720, "30 días"), (336, "14 días"), (168, "7 días"),
                       (72, "72 h"), (0, "48 h")]

          def escalon(horas):
              for umbral, nombre in ESCALONES:
                  if horas >= umbral:
                      return nombre
              return "48 h"

          def _fin():
              """Sale != 0 si alguna llamada a gh fallo: la alerta no puede perderse."""
              if fallos_gh:
                  print(f"FAIL: {len(fallos_gh)} llamada(s) a gh fallaron; "
                        f"la alerta pudo no haberse emitido.")
                  for f in fallos_gh:
                      print(f"  - {f}")
                  sys.exit(1)
              sys.exit(0)

          raw = gh("issue", "list", "--repo", REPO, "--label", LABEL,
                   "--state", "open", "--json", "number,body", "--jq", ".[0] // empty")
          abierto = json.loads(raw) if raw else None

          # --- Caso 1: todo sano. Cerrar el issue si quedó abierto. ---
          if not hay_problema:
              if not abierto:
                  print("OK: sin stale y sin issue abierto — nada que hacer.")
                  sys.exit(0)
              num = str(abierto["number"])
              cuerpo = (
                  "## ✅ Recuperado\n\n"
                  "El healthcheck encuentra **todos los Tier A frescos** (<48 h). "
                  "Cierro el issue automáticamente para que el rojo signifique algo "
                  "la próxima vez.\n\n"
                  "<details><summary>Último reporte</summary>\n\n"
                  + Path("healthcheck_report.md").read_text(encoding="utf-8")
                  + "\n\n</details>"
              )
              gh("issue", "comment", num, "--repo", REPO, "--body-file", "-", stdin=cuerpo)
              gh("issue", "close", num, "--repo", REPO,
                 "--reason", "completed")
              print(f"Issue #{num} cerrado: sistema recuperado.")
              _fin()

          # --- Caso 2: hay problema. Abrir, escalar o solo refrescar. ---
          reporte = Path("healthcheck_report.md").read_text(encoding="utf-8")
          actual = escalon(max_age)
          cuerpo = f"{MARK} {actual} -->\n\n{reporte}\n"

          if not abierto:
              gh("label", "create", LABEL, "--repo", REPO, "--color", "FF6B6B",
                 "--description", "NRT healthcheck detectó vols Tier A stale")
              gh("issue", "create", "--repo", REPO, "--title", TITLE,
                 "--label", LABEL, "--body-file", "-", stdin=cuerpo)
              print(f"Issue creado (escalón {actual}).")
              _fin()

          num = str(abierto["number"])
          previo = None
          for linea in (abierto.get("body") or "").splitlines():
              if linea.startswith(MARK):
                  previo = linea[len(MARK):].replace("-->", "").strip()
                  break

          # El cuerpo se refresca siempre: editar NO genera notificación.
          gh("issue", "edit", num, "--repo", REPO, "--body-file", "-", stdin=cuerpo)

          if previo == actual:
              print(f"Issue #{num}: sigue en escalón {actual} — cuerpo "
                    f"actualizado, sin notificar.")
              _fin()

          aviso = (
              f"## ⏫ Escaló a **{actual}**\n\n"
              f"La caída pasó de `{previo or '48 h'}` a `{actual}` "
              f"(peor caso: {max_age:.0f} h sin dato).\n\n"
              f"{reporte}"
          )
          gh("issue", "comment", num, "--repo", REPO, "--body-file", "-", stdin=aviso)
          print(f"Issue #{num}: escaló {previo} → {actual} (notificado).")
          _fin()
          PYEOF

      # ────────────────────────────────────────────────────────────────
      # S133 — Puntualidad del cron, no solo frescura del dato.
      #
      # POR QUE VA ACA Y NO EN UN WORKFLOW NUEVO: agregar otro cron empeoraria
      # justamente lo que se quiere medir. Este job ya corre todos los dias.
      #
      # QUE AGUJERO TAPA: el 2026-08-27 GitHub dejo de entregar la mitad de los
      # eventos `schedule` del repo, uniformemente sobre los cuatro workflows con
      # cron, y nadie se entero durante ocho dias. No fallo ningun monitor: las 200
      # ultimas corridas del NRT terminaron en success, y el dato nunca paso de 7 h
      # de viejo contra un umbral de 48. Dos metricas verdes sobre un mecanismo
      # degradado a la mitad (A87). Lo que faltaba medir era la AUSENCIA, y una
      # corrida que no ocurre no deja rastro que un monitor de fallas pueda ver.
      #
      # `if: always()` porque un paso previo en rojo es cuando MAS interesa saber
      # si el cron esta llegando.
      # ────────────────────────────────────────────────────────────────
      - name: Medir la puntualidad del cron
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --limit 400 --json createdAt,name,event \
            | python scripts/medir_cadencia_cron.py \
                --ventana-h 24 --json-out cadencia.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
