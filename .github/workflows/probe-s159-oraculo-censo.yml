name: "Probe S159 censo del oraculo de MIROVA en VIIRS 750 (solo lectura)"

# Censo del oraculo en todas las pasadas de la poblacion del frente N (S159). Diseno y controles:
# experiments/_s159/oraculo_censo/PREREGISTRO.md (commiteado antes de este disparo); probe:
# experiments/_s159/oraculo_censo/probe_censo.py (reusa experiments/_s159/n/probe_n.py).
# Solo lectura: no escribe en data/, no commitea, no hace push; el resultado queda como artefacto.
# Se dispara con un push a la rama s159-oraculo-disparo (workflow_dispatch solo existe desde main, S73). No se mergea.
# Copia de experiments/_s159/oraculo_censo/probe-s159-oraculo-censo.yml.
# A43: "on" entre comillas. S141: pipefail con tee; el script sale 2 si falta una pasada.
# A71: autentica SOLO por EARTHDATA_TOKEN y falla al instante si viene vacio (el par usuario y clave esta vencido).
# A15: ~40 granulos y ~180 pasadas por trozo, ~6 s por granulo y ~6 s por pasada -> ~25 min; timeout 90.
"on":
  push:
    branches: ["s159-oraculo-disparo"]

concurrency:
  group: probe-s159-oraculo-censo
  cancel-in-progress: false

env:
  SOLO: "69,1362,2461,3629,4883,1237,5192"
  NCHUNKS: "2"
  OBJETIVOS: "experiments/_s159/oraculo_censo/objetivos.json"

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        chunk: [0, 1]
    steps:
      - name: Token presente
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then echo "EARTHDATA_TOKEN vacio: no se corre (A71)"; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml pyproj pandas
      - name: Probe
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          VRP_PROFILE: mirova_equivalent
          VRP_TMP_DIR: ${{ runner.temp }}/vrp_tmp
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/_s159/oraculo_censo/probe_censo.py --objetivos "$OBJETIVOS" --out out \
            --chunk ${{ matrix.chunk }} --nchunks "$NCHUNKS" --solo "$SOLO" 2>&1 | tee out/probe_${{ matrix.chunk }}.log
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s159-oraculo-censo-chunk-${{ matrix.chunk }}
          path: |
            out/*.json
            out/*.log
          retention-days: 30
          if-no-files-found: error
