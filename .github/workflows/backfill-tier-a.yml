name: S120 backfill histórico Tier A (por olas)

# Backfill de historia pre-nov-2025 al perfil OPERACIONAL mirova_equivalent
# (data nace clon-literal: gates OFF S118 + nadir-fijo + magnitud focal).
# Plan y gates de verificación: docs/BACKFILL_PLAN_S120.md.
# Diseño anti-race (A47/S25): matrix por volcán = cada job escribe SOLO su archivo;
# commit con add del archivo propio + rebase retry (patrón nrt.yml probado).
# SIN --overwrite: los records históricos se agregan por merge (store.py), las fechas
# no colisionan con la serie viva (empieza nov-2025).
# Olas ≤ ~3 meses por dispatch (A15: 90d Villarrica ≈ 175 min; timeout 340).
# A43: "on" quoted.
"on":
  workflow_dispatch:
    inputs:
      start:
        description: "Inicio ola (YYYY-MM-DD)"
        required: true
      end:
        description: "Fin ola (YYYY-MM-DD) — máx ~3 meses por ola"
        required: true
      volcano:
        description: "Volcán exacto (piloto) o 'all' (11 Tier A)"
        default: "all"
        required: false

permissions:
  contents: write

concurrency:
  # S123: grupo COMPARTIDO por los 6 workflows que hacen `git push` a main.
  # Serializa los pushes entre workflows distintos y evita la carrera
  # "cannot lock ref 'refs/heads/main'" (ya ocurrida en Mirova-v1 el 2026-08-08).
  # Colision concreta que motiva esto: nrt.yml (cron :00 cada 2h) vs
  # sync-mirova-csv.yml (cron :12 de cada hora) cuando nrt tarda >12 min.
  # cancel-in-progress: false -> nunca abortamos un push a medias; se encola.
  group: push-main
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 8
      # matrix dinámico: 'all' → 11 Tier A; nombre exacto → solo ese volcán (piloto).
      # (el contexto matrix no existe en jobs.<id>.if — HTTP 422 al dispatch; fix S120)
      matrix:
        volcano: ${{ github.event.inputs.volcano == 'all' && fromJSON('["Lascar","Lastarria","Isluga","Llaima","Villarrica","Chaiten","Tupungatito","Copahue","PlanchonPeteroa","PuyehueCordonCaulle","NevadosDeChillan"]') || fromJSON(format('["{0}"]', github.event.inputs.volcano)) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf earthaccess numpy h5py scipy pyyaml
      - name: Backfill ${{ matrix.volcano }} ${{ github.event.inputs.start }}..${{ github.event.inputs.end }}
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 330
        run: |
          python scripts/run_pipeline.py \
            --profile mirova_equivalent \
            --volcano ${{ matrix.volcano }} \
            --start ${{ github.event.inputs.start }} \
            --end ${{ github.event.inputs.end }}
      - name: Commit result (solo el archivo de este volcán — anti-race S22)
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add "data/mirova_equivalent/${{ matrix.volcano }}.json" 2>/dev/null
          git diff --staged --quiet && { echo "no changes for ${{ matrix.volcano }}"; exit 0; }
          git commit -m "data(backfill): ${{ matrix.volcano }} ${{ github.event.inputs.start }}..${{ github.event.inputs.end }} (S120)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1
