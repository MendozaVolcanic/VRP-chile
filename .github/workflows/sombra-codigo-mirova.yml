name: Sombra codigo MIROVA (vias V750, V375 y MODIS, 11 Tier A)

# S167 (programa por sensor §12.5 punto 4; si de Nicolas del 2026-10-29 para prepararla, tag pre-s167-perfil-sombra).
# POR QUE: los tres pre-registros de fase 4 (V750-A §4.3, V375-E §3.3, MOD-D fase 4 §12.6) piden correr las vias
# «codigo MIROVA» hacia adelante desde el 2026-11-03, en pasadas que nadie habia visto al escribir la regla, y
# compararlas con lo que publica produccion (K) y con MIROVA. Perfil: pipeline/profiles/sombra_codigo_mirova.yaml,
# salida en data/sombra_codigo_mirova/ (A47), que el tablero no lee.
#
# ENCENDIDA en S168 (si de Nicolas del 2026-10-29 para preparar el PR; el merge es otra frase suya; tag
# pre-s168-encender-sombra). Antes, el despacho medir=true run 40945613044 (Lascar, 2026-10-21 a 28) midio 907 s de
# job y 801 s de paso para 8 dias, con 77 de 77 records de la via en MODIS, VIIRS 750 y VIIRS 375
# (experiments/_s168/sombra_run_40945613044/, verificador CONFIRMADO CON RESERVAS). Una vez al dia a las 15:00 UTC;
# hasta el 2026-11-03 cada job sale en segundos porque ventana_sombra.py no devuelve ventana.
#
# POR QUE APARTE DEL NRT (medido en S167, experiments/_s167_sombra/COSTO.md): el NRT corre cada hora y su paso tarda
# 17,7 min de mediana (maximo 29,8 en 418 jobs); un paso mas en el mismo job le sumaria unos 15 min a cada corrida y
# desplazaria corridas pendientes del grupo push-main. Aqui corre una vez al dia, como experimental-diario (paso:
# mediana 18,4 min, maximo 32,6), y la sombra procesa los mismos 8 dias que el NRT, recortados en la fecha minima.
#
# CONCURRENCIA: grupo PROPIO, no `push-main`, por la misma razon que experimental-diario: en `push-main` podria
# desplazar una corrida del NRT en espera. El push se protege con el bucle de reintentos pull --rebase (guard G4).
# A71: autentica SOLO con EARTHDATA_TOKEN y falla al instante si viene vacio. A43: "on" entre comillas.
"on":
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      volcano:
        description: "Un volcan (vacio = los 11)"
        required: false
        default: ""
      medir:
        description: "Medir el costo sin commitear (pide start y end; acepta fechas anteriores al 2026-11-03)"
        required: false
        type: boolean
        default: false
      start:
        description: "Inicio AAAA-MM-DD (vacio = hoy y 7 dias atras, desde el 2026-11-03)"
        required: false
        default: ""
      end:
        description: "Fin AAAA-MM-DD"
        required: false
        default: ""

concurrency:
  group: sombra-codigo-mirova
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-24.04  # fijado como el NRT (ubuntu-latest migra a 26.04 desde el 2026-10-19)
    timeout-minutes: 100
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4   # como experimental-diario: no compite por LANCE con el dato operacional
      matrix:
        volcano: [Lascar, PuyehueCordonCaulle, Lastarria, Isluga, Tupungatito, PlanchonPeteroa,
                  Chaiten, Villarrica, NevadosDeChillan, Llaima, Copahue]
    steps:
      - name: Filtro de volcan
        id: plan
        env:
          DISPATCH_VOLCANO: ${{ github.event.inputs.volcano }}
        run: |
          if [ -n "$DISPATCH_VOLCANO" ] && [ "$DISPATCH_VOLCANO" != "${{ matrix.volcano }}" ]; then
            echo "correr=false" >> "$GITHUB_OUTPUT"; echo "Salto ${{ matrix.volcano }} (filtro $DISPATCH_VOLCANO)"; exit 0
          fi
          echo "correr=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.plan.outputs.correr == 'true'
        uses: actions/checkout@v5

      - name: Set up Python
        if: steps.plan.outputs.correr == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.plan.outputs.correr == 'true'
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          # pyproj: la via lo usa para pasar el granulo a la grilla UTM de MIROVA (remuestrear_grilla); el NRT no lo instala
          pip install earthaccess numpy h5py scipy pyyaml pyproj

      - name: Run VRP pipeline, perfil sombra_codigo_mirova
        id: correr
        if: steps.plan.outputs.correr == 'true'
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          VRP_MEDIR: ${{ github.event.inputs.medir }}
          VRP_START: ${{ github.event.inputs.start }}
          VRP_END: ${{ github.event.inputs.end }}
        # S167: el costo de la via en el runner no esta medido (COSTO.md §3, estimado 37 a 45 min el peor job). El techo
        # se ancla al peor job OBSERVADO del NRT, 56 min (nrt.yml, Villarrica 2026-09-02): A15 pide >= 1,3 x 56 = 73
        timeout-minutes: 75
        run: |
          set -o pipefail
          if [ -z "$EARTHDATA_TOKEN" ]; then
            echo "::error::EARTHDATA_TOKEN vacio. Sin token no se procesa nada, y el login por usuario y clave vencido bloquea la cuenta (A71)."
            exit 1
          fi
          VRP_PROFILE=sombra_codigo_mirova python -c "import pipeline.profile as p; assert p.DATA_SUBDIR == 'sombra_codigo_mirova', p.DATA_SUBDIR; assert p.ENABLE_V750_CODIGO_MIROVA and p.ENABLE_V375_CODIGO_MIROVA and p.ENABLE_MODIS_CODIGO_MIROVA; assert not (p.ENABLE_MODIS_GEO_MXD03 or p.ENABLE_MODIS_CRATER_SIN_DATO or p.ENABLE_MODIS_DIST_DESDE_CRATER); print('perfil', p.PROFILE_NAME, '| vias V750 V375 MODIS encendidas | MxD03 apagado')"
          ARGS=()
          if [ "$VRP_MEDIR" = "true" ]; then ARGS+=(--medir); fi
          if [ -n "$VRP_START" ]; then ARGS+=(--start "$VRP_START"); fi
          if [ -n "$VRP_END" ]; then ARGS+=(--end "$VRP_END"); fi
          VENTANA=$(python scripts/ventana_sombra.py "${ARGS[@]}") || { echo "::error::ventana pedida invalida"; exit 2; }
          if [ -z "$VENTANA" ]; then
            echo "commit=false" >> "$GITHUB_OUTPUT"; echo "Todavia no toca: la sombra parte el 2026-11-03."; exit 0
          fi
          read -r INI FIN <<< "$VENTANA"
          echo "Ventana $INI a $FIN (medir=$VRP_MEDIR)"
          # S169 (P3-02): el inicio de la corrida se anota ANTES de correr; la revision cuenta solo los records con
          # processed_utc desde aqui (pipeline/store.py lo reescribe en cada record que guarda), no los de ayer.
          INICIO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          { echo "corrio=true"; echo "ini=$INI"; echo "fin=$FIN"; echo "inicio=$INICIO"; } >> "$GITHUB_OUTPUT"
          # S169 (P3-04): --cobertura-json deja por escrito que se busco, que fallo y que plataforma no trajo granulos;
          # la revision lo lee y el paso de artefactos lo guarda junto con el log.
          python scripts/run_pipeline.py --profile sombra_codigo_mirova --volcano "${{ matrix.volcano }}" \
            --start "$INI" --end "$FIN" --cobertura-json cobertura.json 2>&1 | tee pipeline.log
          if [ "$VRP_MEDIR" = "true" ]; then echo "commit=false" >> "$GITHUB_OUTPUT"; else echo "commit=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit sombra data
        if: steps.correr.outputs.commit == 'true'
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          # Solo el archivo de la sombra de este volcan: la sombra nunca commitea en data/mirova_equivalent/.
          git add "data/sombra_codigo_mirova/${{ matrix.volcano }}.json" 2>/dev/null
          git diff --staged --quiet && { echo "Sin cambios para ${{ matrix.volcano }}"; exit 0; }
          git commit -m "Sombra codigo MIROVA ${{ matrix.volcano }} $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed, sleeping $((attempt * 10))s"
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1

      # run_pipeline atrapa toda excepcion por granulo y sale 0: sin esta revision, una dependencia que falte en el
      # runner o un MxD03 que no calce dejaria la sombra verde y vacia (scripts/revisar_sombra.py). Va DESPUES del
      # commit, para no perder los records buenos del dia por un granulo malo; si falla, el job queda rojo.
      # S169 (P3-02, P3-03, VF3-01): juzga solo lo que escribio ESTA corrida (processed_utc desde el inicio y el sha
      # del disparo), por sensor, y lee la cobertura; un sensor sin pasada hoy se dice por escrito, no se calla.
      # Una sola linea a proposito: tests/test_revisar_sombra_corrida_s169.py la ejecuta tal cual.
      - name: Revisar que salieron records de la via
        if: always() && steps.correr.outputs.corrio == 'true'
        run: |
          python scripts/revisar_sombra.py --json "data/sombra_codigo_mirova/${{ matrix.volcano }}.json" --log pipeline.log --cobertura-json cobertura.json --ini "${{ steps.correr.outputs.ini }}" --fin "${{ steps.correr.outputs.fin }}" --desde-utc "${{ steps.correr.outputs.inicio }}" --sha "${{ github.sha }}"

      # S169 (P3-04): el log y la cobertura vivian solo en el runner; un granulo que la via descarta (return None, sin
      # linea en el log de pipeline/, que esta congelado) o una busqueda caida no dejaban rastro recuperable. Se suben
      # aunque algo falle. El nombre lleva el intento: relanzar un job no choca con el artefacto del intento anterior.
      - name: Guardar log y cobertura de la corrida
        if: always() && steps.correr.outputs.corrio == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sombra-${{ matrix.volcano }}-intento-${{ github.run_attempt }}
          path: |
            pipeline.log
            cobertura.json
          if-no-files-found: warn
          retention-days: 90
