name: A/B reproceso F-S81-A gate Path D MODIS intra-radio (S83)

# Workflow dispatch-only para validación cuantitativa del gate
# enable_path_d_intra_radio_gate (A-simplificada Fase 2).
#
# Motivación: 99.5% de FPs MODIS Tier A audit S81/S82 son Path D (dNTI ctx
# 8-vecinos) puro disparando lejos del cráter (89% a >10 km). MIROVA tagged
# RUTINA en 98% de los casos. Ver docs/F_S81_A_FASE1_DIAGNOSIS.md +
# docs/F_S81_A_FASE1B_SANITY_P95.md.
#
# Profiles paralelos (data_subdir aislado, NO contamina operacional ni
# choca con mirova_equivalent/):
#   _f_s81_a_intra_radio_enabled  → gate ON (mascarea dnti_ctx_hot
#                                    fuera del inner_radius_km KMZ MIROVA)
#   _f_s81_a_intra_radio_disabled → gate OFF explícito (baseline pair,
#                                    idéntico al operacional pero con
#                                    data_subdir aislado para A/B controlado)
#
# Criterios de aceptación A-simplificada (docs/F_S81_A_FASE1B_SANITY_P95.md):
# - Precisión MODIS Tier A: actual ~0.4-0.5 → objetivo ≥0.70.
# - Recall vs ALERTA MIROVA: actual ~0.85-0.92 → mantener ≥0.85.
# - FPs por volcán-mes MODIS: actual 70-100 → objetivo ≤15.
# - R3 audit cruzado: cero records 'eruption' con cluster fuera de
#   inner_radius_km.
#
# A43 Norway problem: `"on":` quoted (no `on:`).

"on":
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD (default 45d window pre-hoy)"
        required: true
        default: "2026-04-12"
      end:
        description: "End date YYYY-MM-DD inclusive (default hoy)"
        required: true
        default: "2026-05-26"

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        volcano: [Lascar, Lastarria, Tupungatito, PuyehueCordonCaulle, Isluga, PlanchonPeteroa, Villarrica, Llaima, Copahue, NevadosDeChillan, Chaiten]
        profile: [_f_s81_a_intra_radio_enabled, _f_s81_a_intra_radio_disabled]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml

      - name: Run reprocess — mirova_equivalent${{ matrix.profile }} / ${{ matrix.volcano }}
        env:
          # S84 fix: agregar EARTHDATA_TOKEN para bypass del endpoint
          # /api/users/find_or_create_token que NASA throttle desde IPs Azure
          # (mismo fix que NRT desde S72, ver docs/EARTHDATA_TOKEN_SETUP.md).
          # Sin token caímos al path legacy USER/PASSWORD que se autolockea
          # bajo bursts paralelos. Runs 26465457074/26469275033/26509990527
          # fallaron 100% por este bug.
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        # S84 fix: timeout 50→140 min. Run 26537938176 timeout-killed 7 jobs
        # Tier A pesados (Lascar/Lastarria/PCC/Tupungatito × 2 profiles) que
        # alcanzaban ~18 días procesados de 45 al hit del límite. Reproc 45d
        # × 8 sensores >> NRT 1d. 140 min permite ~3x margen sobre worst-case
        # observado (~50 min para 18d = ~125 min para 45d, +10 buffer).
        timeout-minutes: 140
        run: |
          python scripts/run_pipeline.py \
            --profile mirova_equivalent${{ matrix.profile }} \
            --volcano ${{ matrix.volcano }} \
            --start ${{ github.event.inputs.start }} \
            --end ${{ github.event.inputs.end }} \
            --overwrite

      - name: Commit reprocessed A/B data
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add "data/mirova_equivalent${{ matrix.profile }}/${{ matrix.volcano }}.json" 2>/dev/null
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "S83 A/B F-S81-A intra-radio — ${{ matrix.profile }} / ${{ matrix.volcano }} ${{ github.event.inputs.start }}→${{ github.event.inputs.end }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed, sleeping $((attempt * 10))s"
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1
