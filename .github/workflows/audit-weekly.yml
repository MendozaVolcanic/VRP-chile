name: Auto-audit semanal paridad MIROVA

# S120 (propuesta §8 AUDIT_S119): convierte la auditoría episódica A51 en monitoreo
# continuo. Cron semanal: refresca ground truth (A17), corre scripts/auto_audit_weekly.py
# (criterios eje2 S119: recall crater A10 + magnitud + integridad, ventana rodante 60d),
# committea data/audit_continuous/ y abre issue si el veredicto sale FUERA_DE_BANDA.
# A43: "on" quoted (Norway Problem YAML 1.1).
"on":
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"   # lunes 09:00 UTC (~05-06 AM Chile)

permissions:
  contents: write
  issues: write

concurrency:
  # S123 corregido — este workflow SALE del grupo compartido `push-main`.
  #
  # Que paso: el 2026-08-17 (primer lunes con el grupo activo) este run quedo
  # encolado esperando el lock que nrt.yml ocupa ~50 min de cada 2 h, llego otro
  # run del grupo y GitHub descarto el pendiente -> `cancelled`. Perdio la
  # auditoria de la semana entera. Para un cron horario perder el turno es
  # inocuo (el siguiente recupera); para uno SEMANAL es una semana sin dato.
  #
  # Por que salir es seguro: el push de este workflow YA es robusto por si
  # mismo — bucle de 4 intentos con `git pull --rebase -X theirs` (ver step
  # "commit + push"). Esa es la proteccion REAL contra la carrera de refs; el
  # grupo compartido no le agregaba nada y si le quitaba la corrida. Leccion
  # A85 aplicada a infra: una cerca que protege algo ya robusto es carga sin
  # beneficio — medir el dano real ANTES de cercar.
  #
  # Los workflows SIN retry propio (nrt-retry, backfill, reproc) SI siguen en
  # `push-main`, donde el grupo si aporta. Frente pendiente: darles retry y
  # evaluar si el grupo deja de hacer falta.
  group: audit-weekly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: Refresh ground truth MIROVA (A17)
        run: |
          curl -fsSL -o data/mirova_reference/mirova_v1_snapshot/registro_vrp_consolidado.csv \
            https://raw.githubusercontent.com/MendozaVolcanic/Mirova-v1/main/monitoreo_satelital/registro_vrp_consolidado.csv
          curl -fsSL -o data/mirova_reference/mirova_v1_snapshot/registro_vrp_ocr.csv \
            https://raw.githubusercontent.com/MendozaVolcanic/Mirova-v1/main/monitoreo_satelital/registro_vrp_ocr.csv

      # S150 (tarea 0.1 del loop): el consolidado de Mirova-v1 pierde filas en silencio y el snapshot
      # recien bajado hereda la perdida. Se regenera la union historica en la misma corrida para que
      # las filas perdidas sigan en la referencia. Si falla (API de GitHub), el audit corre igual y la
      # alarma la da test_la_union_no_esta_atrasada_respecto_del_snapshot en la suite.
      - name: Union historica del consolidado (S150)
        id: union
        continue-on-error: true
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/referencia_mirova_unificada.py --union-historica

      # Verificador de #778: el push de este bot no dispara tests.yml, asi que sin este paso una union
      # que no se regenero solo se notaria en el proximo push humano, con la perdida ya commiteada.
      - name: Issue si la union historica no se regenero
        if: steps.union.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ABIERTOS=$(gh issue list --state open --search "in:title Union historica MIROVA sin regenerar" --json number --jq 'length')
          if [ "$ABIERTOS" = "0" ]; then
            gh issue create \
              --title "Union historica MIROVA sin regenerar $(date -u +%F)" \
              --body "El paso --union-historica de audit-weekly fallo (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). El snapshot del consolidado se refresco igual: si Mirova-v1 perdio filas esta semana, no estan en la referencia. Correr scripts/referencia_mirova_unificada.py --union-historica y commitear data/mirova_reference/union_historica/."
          fi

      - name: Run weekly audit
        run: python scripts/auto_audit_weekly.py

      - name: Commit results
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add data/audit_continuous/ data/mirova_reference/mirova_v1_snapshot/ data/mirova_reference/union_historica/
          git diff --staged --quiet && { echo "no changes"; exit 0; }
          git commit -m "audit(auto): paridad semanal vs MIROVA (auto-audit S120)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed"
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1

      - name: Open issue if out of band
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERDICT=$(python -c "import json; print(json.load(open('data/audit_continuous/latest.json'))['verdict'])")
          echo "verdict: $VERDICT"
          if [ "$VERDICT" = "FUERA_DE_BANDA" ]; then
            python -c "import json; print('\n'.join('- '+f for f in json.load(open('data/audit_continuous/latest.json'))['flags']))" > /tmp/flags.txt
            gh issue create \
              --title "⚠ Auto-audit semanal FUERA DE BANDA — $(date -u +%F)" \
              --body "$(printf 'El auto-audit semanal (criterios eje2 S119 por detector, ventana rodante 60d) detectó paridad fuera de banda:\n\n%s\n\nJuzga SOLO el detector vigente (clave detector de latest.json); el otro se informa en por_detector (S156).\nDetalle: `data/audit_continuous/latest.json` · Bandas: recall cráter ref-5pp (S119); magnitud mediana publicada por volcán y sensor [0.7-1.4]x; alerta protegida de MIROVA (lectura A, 1 MW o más) sin publicar: cualquiera, sin mínimo de noches.\nProtocolo: verificar data fresca primero (A8), clasificar categoría física (A54) antes de proponer fix.' "$(cat /tmp/flags.txt)")"
          fi
          # S150 (auditoria S150, D-02): DEGRADADO no abria issue, y es el veredicto de un apagon del NRT
          # o de un scraper muerto, o sea justo lo que alguien tiene que saber. Un issue por incidente:
          # si ya hay uno abierto con este titulo, no se abre otro.
          if [ "$VERDICT" = "DEGRADADO" ]; then
            ABIERTOS=$(gh issue list --state open --search "in:title Auto-audit semanal DEGRADADO" --json number --jq 'length')
            if [ "$ABIERTOS" = "0" ]; then
              python -c "import json; print('\n'.join('- '+a for a in json.load(open('data/audit_continuous/latest.json'))['cobertura']['avisos']))" > /tmp/avisos.txt
              # S156: los flags también, aunque el veredicto no los pueda interpretar (una alerta protegida
              # sin publicar no deja de serlo porque la ventana esté degradada).
              python -c "import json; print('\n'.join('- '+f for f in json.load(open('data/audit_continuous/latest.json'))['flags']) or '- ninguno')" > /tmp/flags.txt
              gh issue create \
                --title "⚠ Auto-audit semanal DEGRADADO: $(date -u +%F)" \
                --body "$(printf 'El auto-audit semanal no puede interpretar esta ventana:\n\n%s\n\nUn DEGRADADO no es una falla de detección: suele ser un apagón del NRT (revisar nrt-healthcheck y el vencimiento de EARTHDATA_TOKEN), el scraper de MIROVA detenido o la frontera de detector de frontend/cambio_detector.js atrás de los datos.\n\nFlags de la corrida (sin interpretar):\n\n%s\n\nDetalle: `data/audit_continuous/latest.json`.' "$(cat /tmp/avisos.txt)" "$(cat /tmp/flags.txt)")"
            else
              echo "ya hay un issue DEGRADADO abierto; no se abre otro"
            fi
          fi
