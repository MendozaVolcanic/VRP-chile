name: S88 reproc validación Lascar feb-2026 (config actual)

# Workflow dispatch-only. Frente A de S88: reprocesa Lascar feb-2026 con la
# config operacional ACTUAL (perfil _s88_reproc_validation, que `extends:
# mirova_equivalent`) para validar que el pipeline de hoy elige el cráter en
# los 8 detection-loss + 2 borde que S88 identificó con primary stale lejano.
#
# Por qué reproceso y no offline: S88 (experiments/_s88_lascar_reselect) probó
# que la re-selección offline sobre los anomaly_pixels persistidos NO es proxy
# válido del pipeline (A18) — el cráter literalmente no está en el top-100
# guardado de febrero (estrategia vieja vrp_max + bt_path ON). Solo el
# reproceso desde L1B recupera el cráter. Es VALIDACIÓN documentable, no fix.
#
# Por qué GH Actions y no local: MODIS depende de pyhdf, roto en Windows
# (regla S15). Linux runner sí lo corre. Ventana acotada (Lascar solo, feb) →
# cabe holgado en el timeout.
#
# Aislamiento (A47): data_subdir=_s88_reproc_validation, NO toca
# data/mirova_equivalent/. Solo Lascar, un job, sin matrix paralela sobre el
# mismo archivo → sin race.
#
# A43 Norway problem: `"on":` quoted.

"on":
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-02-01"
      end:
        description: "End date YYYY-MM-DD inclusive"
        required: true
        default: "2026-02-28"

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml

      - name: Run reprocess — _s88_reproc_validation / Lascar
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 140
        run: |
          python scripts/run_pipeline.py \
            --profile _s88_reproc_validation \
            --volcano Lascar \
            --start ${{ github.event.inputs.start }} \
            --end ${{ github.event.inputs.end }} \
            --overwrite

      - name: Commit reprocessed validation data
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add "data/_s88_reproc_validation/Lascar.json" 2>/dev/null
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "S88 Frente A — reproc validación Lascar _s88_reproc_validation ${{ github.event.inputs.start }}->${{ github.event.inputs.end }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed, sleeping $((attempt * 10))s"
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1
