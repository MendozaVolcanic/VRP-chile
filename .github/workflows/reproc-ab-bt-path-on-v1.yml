name: A/B reproceso bt_path_hot ON (S72 F2.6.e revertir S40)

# Workflow dispatch-only para F2.6.e — A/B revertir S40 (bt_path_hot ON) vs
# operacional (bt_path_hot OFF). Mismo pipeline SHA, mismo período, solo el
# flag enable_bt_path_hot cambia. Testa hipótesis F2.6.c rank 1: la reducción
# Lascar S26→S71 (388→0.966 MW) es atribuible al cleanup S40 que retiró
# bt_path_hot y borró ~1453 pixels BT (Salar de Atacama / ROI lejana).
# Profile: mirova_equivalent_bt_path_on_v1.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-02-20"
      end:
        description: "End date YYYY-MM-DD (inclusive)"
        required: true
        default: "2026-05-20"

jobs:
  reproc:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        volcano:
          - Lascar
          - Lastarria
          - Tupungatito
          - Villarrica
          - PuyehueCordonCaulle
          - Copahue
          - NevadosDeChillan
          - Llaima
          - Chaiten
          - PlanchonPeteroa
          - Isluga
        profile:
          - mirova_equivalent_bt_path_on_v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml

      - name: Run reprocess — ${{ matrix.profile }} / ${{ matrix.volcano }}
        env:
          # S72 EARTHDATA_TOKEN: si está seteado en GH Secrets, earthaccess lo
          # prefiere automáticamente y bypassea el endpoint /api/users/find_or_create_token
          # que NASA throttle desde IPs Azure (ver docs/EARTHDATA_TOKEN_SETUP.md).
          # Si no está, fallback a USERNAME/PASSWORD legacy (sujeto a throttling).
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 320
        run: |
          python scripts/run_pipeline.py \
            --profile ${{ matrix.profile }} \
            --volcano ${{ matrix.volcano }} \
            --start ${{ github.event.inputs.start }} \
            --end ${{ github.event.inputs.end }} \
            --overwrite

      - name: Upload reprocessed JSON as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btpathon-${{ matrix.profile }}-${{ matrix.volcano }}
          path: data/${{ matrix.profile }}/${{ matrix.volcano }}.json
          retention-days: 7
          if-no-files-found: warn

  consolidate:
    needs: reproc
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Download all reproc artifacts
        uses: actions/download-artifact@v4
        with:
          path: btpathon-artifacts/

      - name: Move artifacts into place
        run: |
          set -e
          shopt -s nullglob
          for dir in btpathon-artifacts/btpathon-*/; do
            base=$(basename "$dir")
            rest="${base#btpathon-}"
            profile="${rest%-*}"
            volcano="${rest##*-}"
            target_dir="data/$profile"
            mkdir -p "$target_dir"
            for f in "$dir"*.json; do
              cp "$f" "$target_dir/"
              echo "Moved: $f -> $target_dir/$(basename "$f")"
            done
          done
          ls -la data/mirova_equivalent_bt_path_on_v1/ 2>/dev/null || echo "bt_path_on dir empty"

      - name: Commit consolidated A/B data
        run: |
          set -e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add data/mirova_equivalent_bt_path_on_v1/ 2>/dev/null || true
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "S72 F2.6.e — reproc 11 Tier A bt_path_hot ON (${{ github.event.inputs.start }} → ${{ github.event.inputs.end }})"
          BRANCH="${{ github.ref_name }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "$BRANCH" && git push origin "$BRANCH" && exit 0
            echo "push attempt $attempt failed, sleeping $((attempt * 30))s"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 30))
          done
          echo "all push attempts failed"; exit 1
