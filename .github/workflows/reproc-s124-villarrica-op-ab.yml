name: S124 A/B Villarrica operacional (issue 513)

# Reprocesa Villarrica con el algoritmo operacional UNIFORME (perfil
# _s124_villarrica_op_ab = extends mirova_equivalent puro) en data_subdir
# aislado. NO toca el cron ni la serie publicada.
#
# Para que: Villarrica corre en produccion con un perfil congelado en abril
# (32 constantes distintas — issue #513) y su serie no es comparable con los
# otros 10 Tier A. Antes de migrarla al operacional (A45: tag + confirmacion)
# hay que MEDIR que cambia: recall y ratio vs MIROVA en la misma ventana, y
# si el escalon de junio (0.06 -> 2.1 MW medianos) persiste o desaparece.
#
# POR QUE ESTA PARTIDO EN TROZOS (S124, tras el timeout del run 32885273954):
# el volcan cuesta ~2.6 min por dia y la ventana pedida son ~146 dias => ~6h10m.
# GitHub mata cualquier job a las 6 h (limite duro), asi que el intento anterior
# murio en el dia 129 de 146 y, como el commit iba al final, se perdieron las
# 5 h 29 min completas. Ahora cada trozo corre en su propio job (~1 h 40 min,
# margen sobrado), sube su JSON como artifact, y un job final los une y hace UN
# SOLO push. Un solo push = no se reabre la carrera de `git push` de S25
# (`pull --rebase -X theirs` puede descartar records del commit anterior).
# A43: "on" quoted.
"on":
  workflow_dispatch:
    inputs:
      start:
        description: "Inicio ventana (YYYY-MM-DD)"
        default: "2026-04-01"
        required: false
      end:
        description: "Fin ventana (YYYY-MM-DD)"
        default: "2026-08-24"
        required: false
      max_days:
        description: "Dias por trozo (presupuesto de job; ver split_date_window.py)"
        default: "37"
        required: false

permissions:
  contents: write

concurrency:
  # Grupo propio (leccion S123/A85-infra): este workflow ya tiene retry de
  # push robusto; el grupo compartido push-main solo arriesgaria que GitHub
  # descarte un run encolado que alguien esta esperando.
  group: reproc-villarrica-op-ab
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.split.outputs.chunks }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Partir la ventana en trozos
        id: split
        run: |
          CHUNKS=$(python scripts/split_date_window.py \
            --start "${{ github.event.inputs.start }}" \
            --end "${{ github.event.inputs.end }}" \
            --max-days "${{ github.event.inputs.max_days }}")
          echo "chunks=$CHUNKS" >> "$GITHUB_OUTPUT"
          echo "Trozos: $CHUNKS"

  reproc:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 8 y no mas: el free tier publico da 20 jobs concurrentes y el cron
      # NRT (matrix de 11 volcanes) comparte ese techo. Con 8, la historia
      # completa de un volcan (16 trozos) entra en 2 tandas.
      max-parallel: 8
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    # ~2.6 min/dia * 37 dias = ~96 min; 180 deja margen y sigue MUY lejos
    # del limite duro de 6 h que mato al run anterior.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf earthaccess numpy h5py scipy pyyaml
      - name: Reprocess Villarrica — operacional uniforme
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        # S129: 145 dias x 2,4 min/dia (A15 calibrada) = 348 min. Antes
        # declaraba 170 y habria muerto por timeout si se dispatchaba.
        timeout-minutes: 350
        run: |
          python scripts/run_pipeline.py \
            --profile _s124_villarrica_op_ab \
            --volcano Villarrica \
            --start ${{ matrix.chunk.start }} \
            --end ${{ matrix.chunk.end }} \
            --overwrite
      - name: Guardar el trozo
        # Sin `if: always()` a proposito: si el trozo no termino, su JSON esta
        # incompleto y subirlo haria pasar por "hecha" una ventana a medias.
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.idx }}
          path: data/_s124_villarrica_op_ab/Villarrica.json
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: reproc
    # `always()`: si un trozo falla, igual se unen y commitean los que si
    # terminaron — el resto se relanza despues sobre esa ventana. Es
    # exactamente lo que no se pudo hacer cuando murio el run anterior.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Bajar los trozos
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
      - name: Unir los trozos
        run: |
          ls -R chunks || true
          python scripts/merge_chunk_stores.py \
            --out data/_s124_villarrica_op_ab/Villarrica.json \
            chunks/chunk-*/Villarrica.json
      - name: Commit result
        run: |
          set +e
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add -f "data/_s124_villarrica_op_ab/Villarrica.json"
          git diff --staged --quiet && { echo "no changes"; exit 0; }
          git commit -m "data(s124): A/B Villarrica operacional ${{ github.event.inputs.start }}..${{ github.event.inputs.end }} (issue 513)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1
