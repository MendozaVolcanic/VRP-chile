name: NRT VRP Pipeline (both profiles)

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Which profile to run (default: both)"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - mirova_equivalent
          - experimental
      volcano:
        description: "Volcano name (leave empty for all)"
        required: false
        default: ""
      date:
        description: "Date to process (YYYY-MM-DD, leave empty for yesterday)"
        required: false
        default: ""
      start:
        description: "Start date for range recalibration (YYYY-MM-DD)"
        required: false
        default: ""
      end:
        description: "End date for range recalibration (YYYY-MM-DD)"
        required: false
        default: ""
      overwrite:
        description: "Overwrite existing records (for reprocessing with fixes)"
        required: false
        type: boolean
        default: false

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml

      - name: Run VRP pipeline — mirova_equivalent profile
        if: ${{ github.event.inputs.profile == '' || github.event.inputs.profile == 'both' || github.event.inputs.profile == 'mirova_equivalent' }}
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          python scripts/run_pipeline.py --profile mirova_equivalent \
            ${{ github.event.inputs.volcano != '' && format('--volcano {0}', github.event.inputs.volcano) || '' }} \
            ${{ github.event.inputs.date != '' && format('--date {0}', github.event.inputs.date) || '' }} \
            ${{ github.event.inputs.start != '' && format('--start {0}', github.event.inputs.start) || '' }} \
            ${{ github.event.inputs.end != '' && format('--end {0}', github.event.inputs.end) || '' }} \
            ${{ github.event.inputs.overwrite == 'true' && '--overwrite' || '' }}

      - name: Run VRP pipeline — experimental profile
        if: ${{ github.event.inputs.profile == '' || github.event.inputs.profile == 'both' || github.event.inputs.profile == 'experimental' }}
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          python scripts/run_pipeline.py --profile experimental \
            ${{ github.event.inputs.volcano != '' && format('--volcano {0}', github.event.inputs.volcano) || '' }} \
            ${{ github.event.inputs.date != '' && format('--date {0}', github.event.inputs.date) || '' }} \
            ${{ github.event.inputs.start != '' && format('--start {0}', github.event.inputs.start) || '' }} \
            ${{ github.event.inputs.end != '' && format('--end {0}', github.event.inputs.end) || '' }} \
            ${{ github.event.inputs.overwrite == 'true' && '--overwrite' || '' }}

      - name: Commit updated data files
        run: |
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add data/mirova_equivalent/*.json data/experimental/*.json data/mirova/*.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "NRT update $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Pull with rebase to handle concurrent workflow pushes
          git pull --rebase origin main || true
          git push

      # Pages deploy moved to .github/workflows/pages-deploy.yml
      # That workflow is triggered by `workflow_run` after this one finishes,
      # so the live site still updates after every NRT run.
