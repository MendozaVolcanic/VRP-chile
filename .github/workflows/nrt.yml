name: NRT VRP Pipeline (both profiles)

on:
  schedule:
    # S12 2026-04-15: cada 2 horas (12 runs/día). LANCE NRT publica
    # granules ~3 h post-overpass. Con 2 h de cadencia, ventana máxima
    # de data stale = 2 h. Repo público → minutos Actions ilimitados,
    # sin presión de presupuesto. Paralelizado por matriz (11 volcanes
    # simultáneos), cada run ~10-15 min, total ~3 h/día de cómputo.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Which profile to run (default: both)"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - mirova_equivalent
          - experimental
      volcano:
        description: "Volcano name (leave empty for all)"
        required: false
        default: ""
      date:
        description: "Date to process (YYYY-MM-DD, leave empty for yesterday)"
        required: false
        default: ""
      start:
        description: "Start date for range recalibration (YYYY-MM-DD)"
        required: false
        default: ""
      end:
        description: "End date for range recalibration (YYYY-MM-DD)"
        required: false
        default: ""
      overwrite:
        description: "Overwrite existing records (for reprocessing with fixes)"
        required: false
        type: boolean
        default: false

# S12 2026-04-15: parallelize by volcano via matrix strategy.
# Previously single job with all 11 volcanoes × 2 profiles × 7 days
# would hang periodically (3 of last 3 scheduled runs cancelled stuck).
# Now each volcano runs in its own job with 60-min timeout; one hang
# does not block the others. Total scheduled runtime: ~20-40 min
# (parallel) instead of 1-6 hours (sequential) or indefinite (stuck).
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      # fail-fast: false means one volcano failing doesn't cancel the
      # others. Critical — we want partial progress even if earthdata
      # has a transient issue on one granule.
      fail-fast: false
      # max-parallel: cap concurrent jobs to avoid pushing commits masivos
      # simultaneously y colapsar el rebase logic. 8 at a time balances
      # runtime vs commit contention. 45 volcanos / 8 = 6 batches × ~15 min.
      max-parallel: 8
      matrix:
        # S12 2026-04-15: matriz ampliada a los 45 volcanes del yaml.
        # Los 11 Tier A/B/C (con refs MIROVA) son los validados. Los otros
        # 34 corren en "modo exploración" con radius_km=5 y sin vent_path
        # específico — útil para encontrar volcanes con actividad inesperada
        # y para data histórica completa. Repo público → Actions sin límite.
        volcano:
          # Tier A/B/C (11 — con refs MIROVA)
          - Lascar
          - PuyehueCordonCaulle
          - Lastarria
          - Isluga
          - Tupungatito
          - PlanchonPeteroa
          - Chaiten
          - Villarrica
          - NevadosDeChillan
          - Llaima
          - Copahue
          # Exploration (34 — sin refs MIROVA, radius=5 km)
          - Antuco
          - DescabezadoGrande
          - CerroAzulQuizapu
          - LagunaDelMaule
          - NevadoDeLongavi
          - Callaqui
          - Lonquimay
          - Tolhuaca
          - Sollipulli
          - Quetrupillan
          - Lanin
          - MochoChoshuenco
          - CarranLosVenados
          - AntillancaCasablanca
          - Osorno
          - Calbuco
          - YateHornopiren
          - Huequi
          - Michinmahuida
          - CorcovadoYanteles
          - Melimoyu
          - Mentolat
          - MacaCay
          - Hudson
          - Tinguiririca
          - Taapaca
          - Parinacota
          - Guallatiri
          - Irruputuncu
          - OlcaParuma
          - Ollague
          - SanPedro
          - Putana
          - SanJose
        # Scheduled runs use 'volcano' from matrix; manual dispatch with
        # 'volcano' input filters to just that one via the `if` below.
        # If user dispatch sets volcano=Lascar, only Lascar job runs.

    steps:
      # Skip this matrix entry if dispatch specified a different volcano.
      # On `schedule`, inputs are null so all jobs proceed.
      - name: Filter volcano match
        id: filter
        run: |
          if [ "${{ github.event.inputs.volcano }}" != "" ] && [ "${{ github.event.inputs.volcano }}" != "${{ matrix.volcano }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping ${{ matrix.volcano }} (dispatch filter=${{ github.event.inputs.volcano }})"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.filter.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.filter.outputs.skip != 'true'
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml

      # S19 2026-04-25: el step `mirova_equivalent` solo se ejecuta para los 11
      # Tier A monitoreados oficialmente por MIROVA (CSV consolidado, KMLs).
      # Los 34 volcanes restantes pasan directamente a `experimental` (siguiente
      # step) y no escriben a data/mirova_equivalent/. Esto:
      #   - reduce ~50% minutos Actions del step mirova_equivalent.
      #   - limpia data/mirova_equivalent/ de no-Tier-A automáticamente.
      #   - alinea el cron con el dashboard que ya filtraba a 11 Tier A en S18.
      - name: Run VRP pipeline — mirova_equivalent profile
        # S26 D: Villarrica EXCLUIDA de este step. Usa profile dedicado
        # mirova_equivalent_villarrica_test1 con Test 1 activo (paths
        # actuales no captan lava lake sub-pixel <600K). Ver step siguiente.
        # S70-0 T2: stdout/stderr a pipeline.log para que el step de detección
        # NASA_DOWN pueda grep el mensaje NASA_AUTH_UNREACHABLE.
        if: ${{ steps.filter.outputs.skip != 'true'
             && (github.event.inputs.profile == '' || github.event.inputs.profile == 'both' || github.event.inputs.profile == 'mirova_equivalent')
             && contains(fromJson('["Lascar","PuyehueCordonCaulle","Lastarria","Isluga","Tupungatito","PlanchonPeteroa","Chaiten","NevadosDeChillan","Llaima","Copahue"]'), matrix.volcano) }}
        env:
          # S72 EARTHDATA_TOKEN: si está seteado en GH Secrets, earthaccess lo
          # prefiere automáticamente y bypassea el endpoint /api/users/find_or_create_token
          # que NASA throttle desde IPs Azure (ver docs/EARTHDATA_TOKEN_SETUP.md).
          # Si no está, fallback a USERNAME/PASSWORD legacy (sujeto a throttling).
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 50
        run: |
          set -o pipefail
          python scripts/run_pipeline.py --profile mirova_equivalent \
            --volcano ${{ matrix.volcano }} \
            ${{ github.event.inputs.date != '' && format('--date {0}', github.event.inputs.date) || '' }} \
            ${{ github.event.inputs.start != '' && format('--start {0}', github.event.inputs.start) || '' }} \
            ${{ github.event.inputs.end != '' && format('--end {0}', github.event.inputs.end) || '' }} \
            ${{ github.event.inputs.overwrite == 'true' && '--overwrite' || '' }} 2>&1 | tee -a pipeline.log

      - name: Run VRP pipeline — Villarrica con Test 1 (S26 D)
        # S26 D: Villarrica usa profile dedicado mirova_equivalent_villarrica_test1
        # con Test 1 integrated-ROI activo + Regla D Test 1-priority + fix
        # magnitud L_bg local. Recall jan-mar 2026: 0/6 → 6/6. Escribe a
        # data/mirova_equivalent/Villarrica.json (data_subdir override).
        if: ${{ steps.filter.outputs.skip != 'true'
             && (github.event.inputs.profile == '' || github.event.inputs.profile == 'both' || github.event.inputs.profile == 'mirova_equivalent')
             && matrix.volcano == 'Villarrica' }}
        env:
          # S72 EARTHDATA_TOKEN: si está seteado en GH Secrets, earthaccess lo
          # prefiere automáticamente y bypassea el endpoint /api/users/find_or_create_token
          # que NASA throttle desde IPs Azure (ver docs/EARTHDATA_TOKEN_SETUP.md).
          # Si no está, fallback a USERNAME/PASSWORD legacy (sujeto a throttling).
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 50
        run: |
          set -o pipefail
          python scripts/run_pipeline.py --profile mirova_equivalent_villarrica_test1 \
            --volcano Villarrica \
            ${{ github.event.inputs.date != '' && format('--date {0}', github.event.inputs.date) || '' }} \
            ${{ github.event.inputs.start != '' && format('--start {0}', github.event.inputs.start) || '' }} \
            ${{ github.event.inputs.end != '' && format('--end {0}', github.event.inputs.end) || '' }} \
            ${{ github.event.inputs.overwrite == 'true' && '--overwrite' || '' }} 2>&1 | tee -a pipeline.log

      - name: Run VRP pipeline — experimental profile
        if: ${{ steps.filter.outputs.skip != 'true' && (github.event.inputs.profile == '' || github.event.inputs.profile == 'both' || github.event.inputs.profile == 'experimental') }}
        env:
          # S72 EARTHDATA_TOKEN: si está seteado en GH Secrets, earthaccess lo
          # prefiere automáticamente y bypassea el endpoint /api/users/find_or_create_token
          # que NASA throttle desde IPs Azure (ver docs/EARTHDATA_TOKEN_SETUP.md).
          # Si no está, fallback a USERNAME/PASSWORD legacy (sujeto a throttling).
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        timeout-minutes: 50
        run: |
          set -o pipefail
          python scripts/run_pipeline.py --profile experimental \
            --volcano ${{ matrix.volcano }} \
            ${{ github.event.inputs.date != '' && format('--date {0}', github.event.inputs.date) || '' }} \
            ${{ github.event.inputs.start != '' && format('--start {0}', github.event.inputs.start) || '' }} \
            ${{ github.event.inputs.end != '' && format('--end {0}', github.event.inputs.end) || '' }} \
            ${{ github.event.inputs.overwrite == 'true' && '--overwrite' || '' }} 2>&1 | tee -a pipeline.log

      # S70-0 T2: detectar NASA_AUTH_UNREACHABLE en pipeline.log para etiquetar
      # el run como [NASA_DOWN]. NO cambia exit code — el badge sigue en rojo
      # cuando NASA cae (política conservadora Nicolás S70-0). El marker en
      # ::warning:: y GITHUB_STEP_SUMMARY lo lee nrt-retry.yml para decidir
      # si retriggerea el cron 30 min después.
      - name: Detect NASA_AUTH_UNREACHABLE (tag run as NASA_DOWN)
        if: failure() && steps.filter.outputs.skip != 'true'
        run: |
          if [ -f pipeline.log ] && grep -q "NASA_AUTH_UNREACHABLE" pipeline.log; then
            echo "::warning title=NASA_DOWN::NASA Earthdata auth endpoint inalcanzable — outage upstream. Job marcado como NASA_DOWN."
            echo "## NASA_DOWN detected" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "El endpoint \`urs.earthdata.nasa.gov:443\` no respondió al probe TCP en 5s." >> "$GITHUB_STEP_SUMMARY"
            echo "Pipeline abortó con \`NASA_AUTH_UNREACHABLE\` (budget corto, ~2 min)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Volcán afectado: \`${{ matrix.volcano }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Workflow \`nrt-retry.yml\` reintentará automáticamente en ~30 min." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated data files
        if: steps.filter.outputs.skip != 'true'
        # S22 H_S22_NRT_PUSH_CONFLICT: el git add con *.json agarraba
        # cualquier modificación incidental → conflicts en rebase concurrente.
        # Fix: add SOLO el archivo del volcán de este job, así diferentes
        # matrix-jobs nunca tocan los mismos archivos. El rebase queda
        # libre de conflicts. Si rebase falla por otra razón (e.g. branch
        # protection), -X theirs auto-resuelve aceptando lo del remoto
        # (NRT files de otros volcanes ganan; nuestro volcano es el cambio
        # nuevo a aplicar encima).
        run: |
          set +e  # No abortar en errores intermedios — manejamos exit codes
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          # Solo el archivo del volcán de este job (cada matrix tiene volcano único)
          git add "data/mirova_equivalent/${{ matrix.volcano }}.json" \
                  "data/experimental/${{ matrix.volcano }}.json" \
                  "data/mirova/${{ matrix.volcano }}.json" 2>/dev/null
          git diff --staged --quiet && { echo "No changes to commit for ${{ matrix.volcano }}"; exit 0; }
          git commit -m "NRT update ${{ matrix.volcano }} $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            # -X theirs: en caso de conflict, aceptar el remoto (otros jobs)
            # y aplicar nuestro cambio del volcán encima.
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $attempt failed, sleeping $((attempt * 10))s"
            # Si rebase falla a mitad, abortarlo antes del próximo intento
            git rebase --abort 2>/dev/null
            sleep $((attempt * 10))
          done
          echo "all push attempts failed"; exit 1

      # Pages deploy moved to .github/workflows/pages-deploy.yml
