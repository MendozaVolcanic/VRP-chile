name: NRT VRP Pipeline

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      volcano:
        description: "Volcano name (leave empty for all)"
        required: false
        default: ""
      date:
        description: "Date to process (YYYY-MM-DD, leave empty for yesterday)"
        required: false
        default: ""
      start:
        description: "Start date for range recalibration (YYYY-MM-DD)"
        required: false
        default: ""
      end:
        description: "End date for range recalibration (YYYY-MM-DD)"
        required: false
        default: ""

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml

      - name: Run VRP pipeline
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          python scripts/run_pipeline.py \
            ${{ github.event.inputs.volcano != '' && format('--volcano {0}', github.event.inputs.volcano) || '' }} \
            ${{ github.event.inputs.date != '' && format('--date {0}', github.event.inputs.date) || '' }} \
            ${{ github.event.inputs.start != '' && format('--start {0}', github.event.inputs.start) || '' }} \
            ${{ github.event.inputs.end != '' && format('--end {0}', github.event.inputs.end) || '' }}

      - name: Commit updated data files
        run: |
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add data/*.json data/mirova/*.json
          git diff --staged --quiet || git commit -m "NRT update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Deploy frontend to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend
          keep_files: false
          # Copy data/ into the published site so fetch('../data/...') works
          # We use a custom publish script instead
        if: false  # placeholder — see next step

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -r frontend/. _site/
          cp -r data _site/data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: process
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
