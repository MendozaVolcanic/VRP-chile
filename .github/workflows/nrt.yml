name: NRT VRP Pipeline

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      volcano:
        description: "Volcano name (leave empty for all)"
        required: false
        default: ""
      date:
        description: "Date to process (YYYY-MM-DD, leave empty for yesterday)"
        required: false
        default: ""

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data files back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # pyhdf needs HDF4 libraries
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py pyproj pandas pyyaml

      - name: Run VRP pipeline
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          python scripts/run_pipeline.py \
            ${{ github.event.inputs.volcano != '' && format('--volcano {0}', github.event.inputs.volcano) || '' }} \
            ${{ github.event.inputs.date != '' && format('--date {0}', github.event.inputs.date) || '' }}

      - name: Commit updated data files
        run: |
          git config user.name  "vrp-bot"
          git config user.email "vrp-bot@github-actions"
          git add data/*.json
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "NRT update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
