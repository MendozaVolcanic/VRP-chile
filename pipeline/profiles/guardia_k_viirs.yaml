# Guardia K de VIIRS 375 y VIIRS 750 (S176; diseño docs/superpowers/specs/2026-11-08-encendido-v375e-design.md,
# decisiones 2 y 7; regla experiments/_s176_v375e_adopcion/REGLA_REVERSION_V375E_BORRADOR.md; tag defensivo
# pre-s176-adopcion-viirs).
#
# POR QUÉ: Nicolás decidió el 2026-11-08 preparar el encendido de la vía «código MIROVA» en los dos VIIRS, como en MODIS,
# con K corriendo aparte como guardia. El peor caso a vigilar es una señal débil que K publica y la vía calla: un foco
# incipiente que el detector de MIROVA no levanta sobre su grilla. Si MIROVA publica una alerta protegida, esta guardia
# la publica y producción calla, se revierte el encendido de ese sensor el mismo día. Mientras producción siga en K
# (antes de B1 y B2), guardia y producción tienen que publicar lo mismo en VIIRS: ese es el nulo medido de la guardia
# (A110), y la vigilancia lo informa.
#
# QUÉ CAMBIA RESPECTO DE PRODUCCIÓN: las dos vías de VIIRS apagadas, sólo los dos VIIRS (MODIS se vigila aparte, con
# guardia_k_modis) y la carpeta de salida. Nada más: tests/test_guardia_k_viirs_s176.py lo fija contra lo que resuelve
# pipeline.profile (A89). La vía de MODIS se apaga también aquí, aunque este perfil no corra MODIS, para que el perfil no
# cuente como «con vía» y su workflow no pida pyproj (tests/test_guard_pyproj_vias_s172.py).
# Declara los tres flags de K con el valor de producción (tests/test_guard_perfiles_congelados_s153.py, A117).
#
# Por qué un perfil nuevo y no la sombra: la aserción del workflow de la sombra se compara como texto en el S8 del lector
# de V375-E. Este perfil no está en PERFILES_REGIMEN del lector ni su workflow en RUTAS_REGIMEN.
#
# NO OPERACIONAL: data_subdir aislado (A47), el tablero no lo lee. Lo corre sólo .github/workflows/guardia-k-viirs.yml.
extends: mirova_equivalent
profile: guardia_k_viirs
description: >
  Guardia K de VIIRS 375 y VIIRS 750: producción con las vías «código MIROVA» de VIIRS apagadas, sólo VIIRS, en carpeta
  propia.

thresholds:
  enable_v375_codigo_mirova: false
  enable_v750_codigo_mirova: false
  enable_modis_codigo_mirova: false

paths:
  enable_test1_path: false
  enable_tests_23_prose_branch: true

sensors:
  modis: false
  viirs_375: true
  viirs_750: true

output:
  data_subdir: guardia_k_viirs

enable_modis_b22_primary: true
