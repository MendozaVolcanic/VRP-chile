# A/B S151, tarea 1.7 del loop. Brazo KC: el candidato K MAS la caja de 5 x 5 km del paper (D18).
#
# EL FENOMENO. MIROVA aplica el umbral permisivo de cumbre (C1 0,003, C2 5 de noche) solo en una caja de
# 5 x 5 km sobre el crater, y el estricto de escena (C1 0,010, C2 10) en todo lo demas (Coppola 2016a p. 6;
# Coppola et al. 2023 p. 3: "slightly higher thresholds which reduce false alerts"). La replica aplica el
# permisivo en un circulo de 3 a 20 km segun el volcan. La base de MIROVA concuerda con la caja: de sus
# alertas VIIRS 375 de la ventana V1, en los 8 volcanes cuyo punto de referencia es el crater, entre 0,9 y
# 2,2 % caen fuera de ella (experiments/_s151_prereg_caja/prediccion_mirova_salida.txt).
#
# POR QUE AHORA. D18 nunca se midio: S130 la corrio con el Test 1 encendido, que satura la metrica (A114), y
# S148 con la caja solo en el primer pase (A118). #738 la cableo a los dos pases.
#
# QUE CAMBIA respecto del brazo K (_s149_ab_sin_test1_b22_max): UNA cosa, enable_roi1_box_paper.
# CRITERIO: pre-registrado y commiteado ANTES de correr, en experiments/_s151_prereg_caja/PREREGISTRO.md
# NO OPERACIONAL: data_subdir aislado, fuera del cron NRT, nunca se commitea a data/.
extends: mirova_equivalent
profile: _s151_ab_sin_test1_b22_max_caja
description: >
  Brazo KC: sin el Test 1 integrado, banda 22 primaria en MODIS, conectiva de prosa (max) y la caja de 5 x 5 km.

enable_modis_b22_primary: true

paths:
  enable_test1_path: false
  enable_tests_23_prose_branch: true
  enable_roi1_box_paper: true

output:
  data_subdir: _s151_ab_sin_test1_b22_max_caja
