# VRP-Chile — profile: experimental
#
# REESCRITO EN S124. Antes de esto el perfil era una copia literal de la
# configuración de S15 y se había quedado ~100 sesiones atrás: no tenía Test 1
# integrado (S27), ni dual-ROI (S85), ni nadir-fijo (S102/S103), ni ancla al
# cráter (S98), ni el guard de coherencia A46 (S113). Con los pisos de VRP en
# 0.0 y sin nada de eso, el resultado no era "más sensible", era ruido:
#
#   Nevados de Chillán 2026, este perfil vs el operacional
#     VRP mediano ............ 5.686 MW   vs  0.357 MW
#     VRP máximo ............. 522 MW     vs  7.7 MW
#     distancia mediana ...... 25.4 km    vs  2.77 km   (o sea: en el borde
#                              del radio de búsqueda, no en el volcán)
#     detecciones a ≤1 km .... 0 de 344   vs  87
#
# Un laboratorio sirve para ver señal que el producto operacional descarta, no
# para ver cosas que no están. Ahora hereda TODO el operacional y diverge en una
# sola dimensión deliberada: el piso de magnitud.
#
# La data histórica en data/experimental/ quedó obsoleta con este cambio (fue
# generada con la configuración vieja). Hay que reprocesar antes de comparar.

extends: mirova_equivalent
profile: experimental
description: >
  Laboratorio. Hereda la detección operacional completa y baja únicamente el
  piso de magnitud, para ver la señal débil real que MIROVA no publica.

thresholds:
  # Referencia medida sobre 1295 ALERTAS del CSV MIROVA: el mínimo que MIROVA
  # publica es 0.010 MW (p05 = 0.05, mediana = 0.26). Nuestros pisos
  # operacionales (VIIRS375 0.02 / VIIRS750 0.15 / MODIS 0.05) están POR ENCIMA
  # de ese mínimo, así que hoy descartamos señal que MIROVA sí publicaría.
  # Acá bajamos por debajo del umbral de MIROVA — que es el punto del perfil.
  #
  # Los pisos NO se ponen en 0.0 (como hacía la versión vieja): sin piso, cada
  # fluctuación del fondo entra como detección y el perfil deja de ser útil.
  min_vrp_mw_viirs375: 0.005
  min_vrp_mw_viirs750: 0.05
  min_vrp_mw_modis: 0.02

output:
  # S124 — subdir NUEVO a proposito. `data/experimental/` contiene la serie
  # generada con la configuracion vieja (S15), que producia ruido: en Nevados
  # de Chillan daba VRP mediano 5.686 MW y maximos de 522 MW a 25 km del
  # crater. Mezclar en un mismo JSON registros de dos configuraciones
  # distintas hace la serie ininterpretable — nada en el record dice con que
  # config se genero. La serie vieja queda intacta como legacy y esta arranca
  # limpia.
  data_subdir: experimental_v2
