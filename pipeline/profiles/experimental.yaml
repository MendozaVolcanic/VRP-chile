# VRP-Chile — profile: experimental
#
# Laboratory profile. Designed to probe weaker signals and try new detection
# methods without affecting the operational product. During session 9 this
# profile is BYTE-IDENTICAL to mirova_equivalent.yaml — the fork is purely
# architectural for now.
#
# Divergence policy: do NOT tune anything here until the 11 MIROVA-reference
# volcanoes are fully validated on the operational profile. When divergence
# starts, document every change in experiments/experimental_tuning.md with
# a before/after audit.

profile: experimental
description: >
  Experimental laboratory profile. Same as mirova_equivalent today; will
  diverge after the 11 volcanoes are validated.

thresholds:
  anomaly_threshold_k: 5.0
  tir_threshold_k: 0.5
  n_sigma_mir: 3.0
  n_sigma_tir: 4.0
  vent_threshold_k: 1.0
  n_sigma_vent: 2.0
  nti_k1_night: -0.8
  nti_bt_sanity_k: 3.0
  cloud_mask_bt_k: 260.0
  max_sigma_component_k: 7.0
  # S12 F1b: vent-path sigma cap. Experimental uses 5.0 (vs 3.0 in
  # mirova_equivalent) to stay more precision-oriented. Will measure
  # precision/recall trade-off in side-by-side comparison.
  max_vent_sigma_contrib_k: 5.0
  # S12 2026-04-15: sin piso VRP en experimental. Detección sensible
  # para investigar señales sub-MIROVA (137 vent-only en PCC al
  # lacolito son candidatos a fumarola real que MIROVA no consolida).
  min_vrp_mw_viirs375: 0.0
  min_vrp_mw_viirs750: 0.0
  min_vrp_mw_modis:    0.0
  # S12 E4: requerir >=2 pixeles calientes en el vent radius para
  # declarar detección vent-path. Hipótesis: señales reales (domo,
  # lava lake, fumarola) calientan 2+ pixeles contiguos a 375m,
  # mientras que ruido térmico afecta 1 pixel aislado. Si reduce
  # FPs sin matar TPs → candidato para mirova_equivalent.
  min_vent_pixels: 2
  # Session 12: Path C sigma multiplier — raised from 3.0 to 5.0 to reduce
  # vent-only FPs (Villarrica audit: 90 FPs, 0 TPs with 3σ).
  nti_rel_n_sigma: 5.0
  nti_rel_min_floor: 0.008
  # Session 12: MODIS-specific vent threshold (Lascar RF1 trade-off).
  # MODIS 1km pixel needs higher ΔT to distinguish signal from noise (SNR 2.5×).
  # Also applies a minimum VRP floor to reject noise-level vent detections.
  modis_vent_threshold_k: 2.5
  modis_vent_vrp_floor_mw: 0.3

background:
  inner_km: 5.0
  outer_km: 25.0

paths:
  enable_eruption_path: true
  enable_vent_path: true
  # Session 10: experimental mantiene vent_path para MODIS (Option C).
  # Permite explorar si ajustes futuros de threshold pueden rescatar señal
  # MODIS sin el ruido que hoy produce el vent-scale permisivo.
  enable_vent_path_modis: true
  # Session 11: NTI relative path (Path C) for weak fumarolic signals.
  # Uses nti > nti_bg + max(0.005, 3*sigma_nti) instead of absolute NTI floor.
  # Targets PP (recall 0.54) and Villarrica (recall 0/6). See plan_s11.
  enable_nti_relative_path: true

sensors:
  modis: true
  viirs_375: true
  viirs_750: true

output:
  data_subdir: experimental
