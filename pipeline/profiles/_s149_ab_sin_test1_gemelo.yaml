# A/B S149. GEMELO del brazo B (_s146_ab_sin_test1): identico salvo el nombre y el directorio de salida.
#
# PARA QUE. En una ventana nueva (mayo, agosto, marzo) no hay una corrida anterior del brazo B contra la
# cual comprobar que el reproceso es reproducible, y la produccion de esos meses es de otro regimen
# (antes de #535), asi que tampoco sirve de referencia. El control positivo pasa a ser de
