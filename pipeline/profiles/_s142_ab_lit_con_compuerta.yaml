# A/B S142, Fase 1 VIIRS 375. Ablación del literal: CON la compuerta de temperatura (D22 off). Mide cuánto aporta quitar la compuerta cuando el segundo pase ya no rescata en vacío.
# NO OPERACIONAL: data_subdir aislado, fuera del cron.
extends: mirova_equivalent
profile: _s142_ab_lit_con_compuerta
description: >
  Literal menos D22: D22 off, D25 on, segundo pase condicionado on, keep_peak off; sólo VIIRS 375.

paths:
  # S153, ADOPCION DE K (regla experiments/_s151_prereg_fk_11/REGLA_ADOPCION.md, #848): la replica apago el
  # Test 1 integrado y encendio la conectiva max y la banda 22. Este perfil hereda de mirova_equivalent y su
  # significado era la produccion de ANTES de K mas su propio cambio, asi que congela aca esos flags con el valor
  # previo (como experimental.yaml en S150) para resolver igual que antes de la adopcion. Lo vigila
  # tests/test_guard_perfiles_congelados_s153.py.
  enable_test1_path: true
  enable_tests_23_prose_branch: false
  enable_tests_23_no_bt_gate_viirs375: false
  enable_vrp_bg_neighbor_mean_viirs375: true
  enable_second_pass_conditioned: true
  enable_test1_contextual_keep_peak: false

sensors:
  modis: false
  viirs_375: true
  viirs_750: false

output:
  data_subdir: _s142_ab_lit_con_compuerta

# S153 (K): banda 21 primaria congelada; el porque esta en el comentario S153 de `paths:`.
enable_modis_b22_primary: false
