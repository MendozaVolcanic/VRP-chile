# ============================================================================
# experimental_ndc_focus — v2 (S124, corregido tras audit)
# ============================================================================
# UNA sola diferencia con la replica: el umbral (0.005 MW vs 0.02).
#
# La v1 ademas cambiaba el ancla (vent=Nicanor) y el inner (1 km), y esas dos
# cosas alteran la DETECCION, no solo el filtro: el dual-ROI de Coppola aplica
# 5 sigma dentro del inner y 10 sigma fuera, asi que con inner=1 km la zona de
# 1-5 km exigia el doble de senal que en la replica, y el ROI del Test 1
# integrado cambiaba de tamano. Resultado medido: noches marginales que la
# replica detectaba y el experimental no (06-22, 06-23, 08-21...), con
# radiometria IDENTICA (n_test1_pixels 0 vs 98 en la misma pasada). Eso
# contaminaba la comparacion: diferencias de GEOMETRIA disfrazadas de
# diferencias de UMBRAL.
#
# El "foco de 500 m al crater Nicanor" NO es del pipeline: se aplica en el
# ANALISIS (experiments/_s124_ndc_focus/*, constante FOCO_KM), filtrando por
# distancia del centroid al crater. Asi la deteccion es identica a la replica
# y el foco es solo una lupa de lectura.
#
# NO OPERACIONAL. data_subdir aislado; el reproceso debe cubrir la ventana
# COMPLETA usada por las figuras para no mezclar configs v1/v2.
# ============================================================================
extends: mirova_equivalent
profile: experimental_ndc_focus
description: >
  Foco del crater Nicanor (NdC), v2: deteccion IDENTICA a la replica, solo el
  umbral mas bajo (0.005 MW). El recorte espacial vive en el analisis.
thresholds:
  min_vrp_mw_viirs375: 0.005
sensors:
  modis: false
  viirs_375: true
  viirs_750: false
output:
  data_subdir: experimental_ndc_focus
