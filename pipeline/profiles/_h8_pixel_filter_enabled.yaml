# A/B PROFILE: H8 (S35) pixel-level distance filter ENABLED.
#
# Idéntico a mirova_equivalent excepto enable_pixel_level_distance_filter=true
# y data_subdir distinto para no contaminar.
#
# Bug fix: cuando coexiste cluster summit + pixel lejano más caliente, el
# filtro all-or-nothing antiguo descartaba TODA anomaly_pixels. Reach 13.7%
# records Tier A en 30d. Fix sin cambio metodológico (alinea per-pixel con
# MIROVA cluster reporting).
#
# Reproceso esperado: 7-14d Tier A. Comparar contra mirova_equivalent baseline.
# Decisión: si recall sube significativamente (>15pp) sin perder ratio, adoptar.

profile: _h8_pixel_filter_enabled
description: >
  A/B test S35 H8 — filtro pixel-por-pixel en store. Idéntico a
  mirova_equivalent salvo enable_pixel_level_distance_filter=true.

thresholds:
  anomaly_threshold_k: 5.0
  tir_threshold_k: 0.5
  n_sigma_mir: 3.0
  n_sigma_tir: 4.0
  vent_threshold_k: 1.0
  n_sigma_vent: 2.0
  nti_k1_night: -0.8
  nti_bt_sanity_k: 3.0
  cloud_mask_bt_k: 0.0
  max_sigma_component_k: 999.0
  min_vrp_mw_viirs375: 0.02
  min_vrp_mw_viirs750: 0.15
  min_vrp_mw_modis:    0.27
  min_vent_pixels: 1
  max_vent_sigma_contrib_k: 999.0
  nti_rel_n_sigma: 3.0
  nti_rel_min_floor: 0.005
  dnti_contextual_c1: 0.003
  dnti_contextual_c1_summit: 0.003
  dnti_contextual_c1_scene: 0.010
  modis_vent_threshold_k: 1.0
  modis_vent_vrp_floor_mw: 0.0
  n_sigma_mir_summit: 5.0
  n_sigma_mir_scene: 10.0

background:
  inner_km: 5.0
  outer_km: 25.0

paths:
  enable_eruption_path: true
  enable_vent_path: false
  enable_vent_path_modis: false
  modis_vent_threshold_k: 2.5
  modis_vent_vrp_floor_mw: 0.3
  enable_nti_relative_path: false
  enable_dnti_contextual_path: true
  enable_dnti_dual_roi: true
  enable_test1_path: true
  enable_dual_roi_bt: true
  enable_exclude_zones: false
  enable_test1_pixel_filter: false
  # H8 ACTIVADO ↓
  enable_pixel_level_distance_filter: true

sensors:
  modis: true
  viirs_375: true
  viirs_750: true

output:
  data_subdir: _h8_pixel_filter_enabled
