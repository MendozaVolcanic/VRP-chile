# A/B S142, Fase 1 VIIRS 375: literal completo + ablaciones. Brazo LITERAL.
#
# Enciende los cuatro puntos donde el pipeline no sigue a Coppola 2016a: sin compuerta de
# temperatura en los Tests 2 y 3 (D22, p. 7), fondo = media de radiancia de los vecinos no
# alertados (D25, ec. 6), segundo pase sólo si hubo detección y sólo en la vecindad (D2), y sin
# keep_peak (D19). Ver docs/superpowers/plans/2026-09-15-flags-d22-d25.md, Tarea 7.
# NO OPERACIONAL: data_subdir aislado, fuera del cron.
extends: mirova_equivalent
profile: _s142_ab_literal
description: >
  Brazo literal: D22 on, D25 on, segundo pase condicionado on, keep_peak off; sólo VIIRS 375.

paths:
  enable_tests_23_no_bt_gate_viirs375: true
  enable_vrp_bg_neighbor_mean_viirs375: true
  enable_second_pass_conditioned: true
  enable_test1_contextual_keep_peak: false

sensors:
  modis: false
  viirs_375: true
  viirs_750: false

output:
  data_subdir: _s142_ab_literal
