# VRP-Chile — profile: mirova_equivalent_lbg_global (S33 D4 sub-pixel A/B)
#
# Objetivo: validar fix Tupungatito 51% FNs sub-pixel (D4).
# Idéntico a mirova_equivalent (Phase 1 ON) EXCEPTO:
# - enable_test1_lbg_global: true → Test 1 VRP usa L_bg(t_bg_i04) del
#   anillo background 5-25km en lugar de test1_L_bg_local del ring
#   1-3km del cráter (contaminado por geotermal crónico en Tupungatito).
#
# Hipótesis: en Tupungatito el ring 1-3km tiene calor crónico (lago
# crateriana, fumarolas peri-cráter, alteración hidrotermal). Pixels Test 1
# individualmente NO superan ese L_bg local, ΔL clip a 0, sum=0 → FN.
# El L_bg global (anillo 5-25km, lejos del cráter) está limpio →
# pixels Test 1 sí superan, sum>0 → detección.
#
# Volcanes esperados beneficiados: Tupungatito, posiblemente Lastarria,
# Llaima, Copahue (todos con geotermal ring cráter).
# Volcanes con cráter limpio (Lascar, Villarrica, PCC, Chaiten, Planchón):
# sin cambio (L_bg local ≈ L_bg global).
#
# data_subdir: mirova_equivalent_lbg_global (aislado del operacional).

profile: mirova_equivalent_lbg_global
description: >
  A/B test S33 D4 sub-pixel: L_bg global del Test 1 (Coppola 2015 ROI 5-25km).
  Fix recall Tupungatito + posiblemente Lastarria/Llaima/Copahue.

thresholds:
  anomaly_threshold_k: 5.0
  tir_threshold_k: 0.5
  n_sigma_mir: 3.0
  n_sigma_tir: 4.0
  vent_threshold_k: 1.0
  n_sigma_vent: 2.0
  nti_k1_night: -0.8
  nti_bt_sanity_k: 3.0
  cloud_mask_bt_k: 0.0
  max_sigma_component_k: 999.0
  min_vrp_mw_viirs375: 0.02
  min_vrp_mw_viirs750: 0.15
  min_vrp_mw_modis:    0.27
  min_vent_pixels: 1
  max_vent_sigma_contrib_k: 999.0
  nti_rel_n_sigma: 3.0
  nti_rel_min_floor: 0.005
  dnti_contextual_c1: 0.003
  dnti_contextual_c1_summit: 0.003
  dnti_contextual_c1_scene: 0.010
  modis_vent_threshold_k: 1.0
  modis_vent_vrp_floor_mw: 0.0
  n_sigma_mir_summit: 5.0
  n_sigma_mir_scene: 10.0

background:
  inner_km: 5.0
  outer_km: 25.0

paths:
  enable_eruption_path: true
  enable_vent_path: false
  enable_vent_path_modis: false
  modis_vent_threshold_k: 2.5
  modis_vent_vrp_floor_mw: 0.3
  enable_nti_relative_path: false
  enable_dnti_contextual_path: true
  enable_dnti_dual_roi: true
  enable_test1_path: true
  enable_dual_roi_bt: true
  enable_exclude_zones: false
  # Phase 1 ya operacional
  enable_test1_pixel_filter: true
  # S33 D4 — el cambio clave
  enable_test1_lbg_global: true

sensors:
  modis: true
  viirs_375: true
  viirs_750: true

output:
  data_subdir: mirova_equivalent_lbg_global
