# VRP-Chile — profile: mirova_equivalent_backfill_nov2025
#
# S15 Paso 1b — reproceso masivo Nov 2025 para cross-match contra MIROVA OSF v2.5.
# Calcado byte-a-byte de mirova_equivalent salvo:
#   - data_subdir: directorio separado (no toca operacional).
#   - sensors.modis: false (pyhdf roto en Windows; corre solo VIIRS local).
#
# Cuando Paso 1b cierre (cross-match exitoso) este profile se archiva.

profile: mirova_equivalent_backfill_nov2025
description: >
  Backfill Nov 2025 — mismo criterio de detección que mirova_equivalent
  pero escribe a directorio aparte y sin MODIS (solo VIIRS, Windows local).

thresholds:
  anomaly_threshold_k: 5.0
  tir_threshold_k: 0.5
  n_sigma_mir: 3.0
  n_sigma_tir: 4.0
  vent_threshold_k: 1.0
  n_sigma_vent: 2.0
  nti_k1_night: -0.8
  nti_bt_sanity_k: 3.0
  cloud_mask_bt_k: 260.0
  max_sigma_component_k: 7.0
  min_vrp_mw_viirs375: 0.02
  min_vrp_mw_viirs750: 0.15
  min_vrp_mw_modis:    0.27
  min_vent_pixels: 1
  max_vent_sigma_contrib_k: 3.0
  nti_rel_n_sigma: 3.0
  nti_rel_min_floor: 0.005
  modis_vent_threshold_k: 2.5
  modis_vent_vrp_floor_mw: 0.3

background:
  inner_km: 5.0
  outer_km: 25.0

paths:
  enable_eruption_path: true
  enable_vent_path: true
  enable_vent_path_modis: true
  modis_vent_threshold_k: 2.5
  modis_vent_vrp_floor_mw: 0.3
  enable_nti_relative_path: false

sensors:
  modis: false
  viirs_375: true
  viirs_750: true

output:
  data_subdir: mirova_equivalent_backfill_nov2025
