# VRP-Chile — profile: _t1lm_q3_ring24 (S112 Parte B, brazo Q3a = anillo intermedio 2-4 km)
#
# Parte A ON + fondo de ANILLO INTERMEDIO [2, 4] km (precede al global). El "Goldilocks":
# fuera del halo de calor crónico del cráter (1-3 km, contaminado → 0) pero más cálido que
# el global de altura (5-25 km → infla). Hipótesis: baja del 0.26 hacia el 0.06 de MIROVA
# sin inflar RUTINA. Código nuevo S112 (TDD test_test1_intermediate_bg_s112.py). data_subdir
# aislado (A47).
extends: mirova_equivalent
profile: _t1lm_q3_ring24
description: >
  A/B S112 Test1-lowmag — Q3a fondo anillo intermedio 2-4 km.
thresholds:
  test1_intermediate_bg_ring_km: [2.0, 4.0]
paths:
  enable_test1_priority_weak_cluster: true
  enable_test1_intermediate_bg: true
output:
  data_subdir: _t1lm_q3_ring24
