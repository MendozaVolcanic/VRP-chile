# VRP-Chile — profile: _modis_localmag_ring (S107 §2 A/B, V-A control)
#
# Brazo V-A: fondo-local de magnitud MODIS = anillo geométrico alrededor del
# centroide del cluster, fuera del footprint (Coppola 2016a Eq.6 "surrounding
# the active cluster"). Solo MAGNITUD (recompute de pc.vrp_mw POST-selección).
# Control del A/B vs V-B (footprint). data_subdir aislado (A47). MODIS necesita
# pyhdf (GH Linux). NO toca operacional.
extends: mirova_equivalent
profile: _modis_localmag_ring
description: >
  A/B S107 fondo-local magnitud MODIS, brazo V-A (anillo geométrico, control).
paths:
  enable_local_cluster_magnitude: true
  local_cluster_mag_mode: ring
output:
  data_subdir: _modis_localmag_ring
