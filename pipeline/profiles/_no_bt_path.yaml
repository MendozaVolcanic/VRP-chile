# A/B PROFILE: _no_bt_path (S40 cleanup paths viejos).
#
# Análisis empírico S39 sobre records operacional 30d (1846 TPs en 11 vol):
#   - bt_path_hot solo contribuye exclusivamente: 0-6 records (10/11 vol)
#   - test1_hot solo: 848 records (path dominante)
#   - dnti_ctx_hot contribuye: 976 records (load-bearing)
#
# Hipótesis: bt_path_hot es redundante con test1_hot + dnti_ctx_hot post
# vent_anchored + D4 adopción. Retirarlo simplifica código y acerca a
# clon literal MIROVA (paper Coppola 2016a NO menciona bt_path puro como
# detector — Tests 1/2/3 son contextuales sobre NTI y dETI).
#
# A/B: comparar este perfil (bt_path OFF, resto = operacional actual) vs
# mirova_equivalent (bt_path ON, baseline). Si recall delta < -1pp,
# retirar bt_path del operacional en S41.

profile: _no_bt_path
description: >
  S40 A/B — operacional con bt_path_hot desactivado. Mide contribución
  REAL del path BT post vent_anchored + H8 + D4 adoptados.

thresholds:
  anomaly_threshold_k: 5.0
  tir_threshold_k: 0.5
  n_sigma_mir: 3.0
  n_sigma_tir: 4.0
  vent_threshold_k: 1.0
  n_sigma_vent: 2.0
  nti_k1_night: -0.8
  nti_bt_sanity_k: 3.0
  cloud_mask_bt_k: 0.0
  max_sigma_component_k: 999.0
  min_vrp_mw_viirs375: 0.02
  min_vrp_mw_viirs750: 0.15
  min_vrp_mw_modis:    0.27
  min_vent_pixels: 1
  max_vent_sigma_contrib_k: 999.0
  nti_rel_n_sigma: 3.0
  nti_rel_min_floor: 0.005
  dnti_contextual_c1: 0.003
  dnti_contextual_c1_summit: 0.003
  dnti_contextual_c1_scene: 0.010
  modis_vent_threshold_k: 1.0
  modis_vent_vrp_floor_mw: 0.0
  n_sigma_mir_summit: 5.0
  n_sigma_mir_scene: 10.0

background:
  inner_km: 5.0
  outer_km: 25.0

paths:
  enable_eruption_path: true
  enable_vent_path: false
  enable_vent_path_modis: false
  # S127 — `modis_vent_threshold_k: 2.5` y `modis_vent_vrp_floor_mw: 0.3`
  # estaban declaradas ACA y el codigo nunca las leyo: las lee de
  # `thresholds:` (profile.py:106-107, `_t.get`), donde valen 1.0 y 0.0.
  # Eran letra muerta en 31 de 51 perfiles. Se quitan para que nadie que
  # encienda `enable_vent_path_modis` crea que corre con 2.5.
  enable_nti_relative_path: false
  enable_dnti_contextual_path: true
  enable_dnti_dual_roi: true
  enable_test1_path: true
  enable_dual_roi_bt: true
  enable_exclude_zones: false
  enable_test1_pixel_filter: false
  enable_eti_quadratic_scene: false
  enable_second_pass_adjacent: false
  enable_sum_vrp_reporting: false
  # Operacional adoptado S38+S39
  enable_vent_anchored_clustering: true
  enable_pixel_level_distance_filter: true
  enable_test1_lbg_global: true
  # S40 — DESACTIVAR bt_path_hot (cambio bajo prueba A/B)
  enable_bt_path_hot: false

sensors:
  modis: true
  viirs_375: true
  viirs_750: true

output:
  data_subdir: _no_bt_path
