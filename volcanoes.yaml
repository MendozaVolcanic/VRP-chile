    display_name: "Puyehue - Cordón Caulle"
    lat: -40.590
    lon: -72.117
    radius_km: 15
    gvp_id: 357150
    country: Chile
    active: true
    sensors: [MODIS, VIIRS]
    notes: "Persistent fumarolic/hydrothermal anomaly since 2011-2012 eruption"
