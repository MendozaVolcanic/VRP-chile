# A/B S135 — D1 (`keep_peak`) x D2 (segundo pase condicionado). Brazo D: fidelidad literal en los dos puntos
#
# EL FENÓMENO. En un cono nevado, de noche, el píxel más caliente del disco de 3 km del
# Test 1 es el BORDE del disco (cota más baja), no el cráter. Dos reglas del pipeline
# publican ese píxel como si fuera actividad en el cráter:
#   · `keep_peak` conserva el pico aunque el filtro contextual no deje nada, y lo publica
#     como detección «a 0,0 km» con centésimas de MW medidas contra un anillo que solapa
#     el disco que mide;
#   · el segundo pase corre aunque el primero no haya detectado nada y sin restringirse a
#     los adyacentes, contra las dos condiciones explícitas de Coppola 2016a (l. 329-341).
# Las dos están acopladas: hoy, con el segundo pase suelto, ÉL rescata el campo fumarólico
# de Lastarria aunque `keep_peak` esté apagado. Por eso el A/B es factorial, no dos A/B.
#
# CRITERIO PRE-REGISTRADO: docs/PREREGISTRO_AB_D1_D2_S135.md (escrito antes de correr).
# Decisión de Nicolás (2026-09-07): CERO pérdidas sobre noches que MIROVA entrega; ante
# una diferencia, entender el mecanismo y arreglarlo, no descartar el brazo.
#
# NO OPERACIONAL: `data_subdir` aislado, fuera del cron.
extends: mirova_equivalent
profile: _s135_ab_d_ambos
description: >
  Brazo D: keep_peak OFF y segundo pase condicionado. Es el más cercano al paper y, por la regla de desempate del pre-registro, el que gana si cumple los tres criterios.

paths:
  # S153, ADOPCION DE K (regla experiments/_s151_prereg_fk_11/REGLA_ADOPCION.md, #848): la replica apago el
  # Test 1 integrado y encendio la conectiva max y la banda 22. Este perfil hereda de mirova_equivalent y su
  # significado era la produccion de ANTES de K mas su propio cambio, asi que congela aca esos flags con el valor
  # previo (como experimental.yaml en S150) para resolver igual que antes de la adopcion. Lo vigila
  # tests/test_guard_perfiles_congelados_s153.py.
  enable_test1_path: true
  enable_tests_23_prose_branch: false
  enable_test1_contextual_keep_peak: false
  enable_second_pass_conditioned: true

output:
  data_subdir: _s135_ab_d_ambos

# S153 (K): banda 21 primaria congelada; el porque esta en el comentario S153 de `paths:`.
enable_modis_b22_primary: false
