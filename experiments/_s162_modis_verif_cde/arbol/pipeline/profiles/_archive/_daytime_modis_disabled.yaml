# A/B S90 — control: detección diurna OFF (= operacional mirova_equivalent).
# data_subdir aislado para el A/B. Equivale al baseline; existe para comparar
# 1:1 contra _daytime_modis_enabled con el mismo data_subdir scheme.
extends: mirova_equivalent
output:
  data_subdir: _daytime_modis_disabled
paths:
  enable_daytime_modis: false
