# VRP-Chile — profile: _t1lm_q2_global (S112 Parte B, brazo Q2 = baseline-con-Parte-A)
#
# Parte A ON (el Test1 gana la fuente cuando un cluster rival débil lo tapaba) + fondo
# GLOBAL operacional (NdC/Lascar/Lastarria son lbg_global_compatible). Es el "0.26 a
# vencer": destapa la magnitud Muy Bajo pero SOBRE-estima (~4.4× MIROVA en NdC) y puede
# inflar RUTINA. Todos los demás brazos S112 buscan bajar de este hacia 0.06. data_subdir
# aislado (A47).
extends: mirova_equivalent
profile: _t1lm_q2_global
description: >
  A/B S112 Test1-lowmag — Q2 baseline (Parte A ON + fondo global).
paths:
  enable_test1_priority_weak_cluster: true
output:
  data_subdir: _t1lm_q2_global
