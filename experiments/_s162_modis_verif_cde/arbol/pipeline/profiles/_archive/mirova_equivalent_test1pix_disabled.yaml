# VRP-Chile — profile: mirova_equivalent_test1pix_disabled (S32 P2 Driver B A/B control)
#
# Espejo de mirova_equivalent (post-S31+) con data_subdir aislado para
# permitir reproceso en paralelo SIN escribir sobre la data operacional
# (que el cron NRT también está modificando).
#
# enable_test1_pixel_filter: false (control). Si todo igual, este profile
# debería producir datos casi idénticos a la rama operacional para el mismo
# rango de fechas, modulo timing del cron NRT.

profile: mirova_equivalent_test1pix_disabled
description: >
  A/B test S32 P2 Driver B — control con flag enable_test1_pixel_filter=false.
  Espejo del operacional mirova_equivalent, aislado para no contaminar.

thresholds:
  anomaly_threshold_k: 5.0
  tir_threshold_k: 0.5
  n_sigma_mir: 3.0
  n_sigma_tir: 4.0
  vent_threshold_k: 1.0
  n_sigma_vent: 2.0
  nti_k1_night: -0.8
  nti_bt_sanity_k: 3.0
  cloud_mask_bt_k: 0.0
  max_sigma_component_k: 999.0
  min_vrp_mw_viirs375: 0.02
  min_vrp_mw_viirs750: 0.15
  min_vrp_mw_modis:    0.27
  min_vent_pixels: 1
  max_vent_sigma_contrib_k: 999.0
  nti_rel_n_sigma: 3.0
  nti_rel_min_floor: 0.005
  dnti_contextual_c1: 0.003
  dnti_contextual_c1_summit: 0.003
  dnti_contextual_c1_scene: 0.010
  modis_vent_threshold_k: 1.0
  modis_vent_vrp_floor_mw: 0.0
  n_sigma_mir_summit: 5.0
  n_sigma_mir_scene: 10.0

background:
  inner_km: 5.0
  outer_km: 25.0

paths:
  enable_eruption_path: true
  enable_vent_path: false
  enable_vent_path_modis: false
  modis_vent_threshold_k: 2.5
  modis_vent_vrp_floor_mw: 0.3
  enable_nti_relative_path: false
  enable_dnti_contextual_path: true
  enable_dnti_dual_roi: true
  enable_test1_path: true
  enable_dual_roi_bt: true
  enable_exclude_zones: false
  # Control: flag OFF
  enable_test1_pixel_filter: false

sensors:
  modis: true
  viirs_375: true
  viirs_750: true

output:
  data_subdir: mirova_equivalent_test1pix_disabled
