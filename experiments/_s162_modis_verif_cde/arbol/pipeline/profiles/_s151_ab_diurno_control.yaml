# A/B S151 diurno (D-10, issue #813). Brazo CONTROL: produccion tal cual.
#
# EL FENOMENO. De dia el canal de infrarrojo medio suma a la emision termica la luz solar
# reflejada. La replica descarta todo VIIRS diurno; MIROVA no (Campus et al. 2022, Sensors
# 22:1713, p. 16 y 17). Este brazo es la produccion de hoy, con la rama diurna APAGADA, reprocesada
# con el mismo codigo y en el mismo run que el brazo diurno: sirve para el nulo 2 del pre-registro
# (las noches de los dos brazos tienen que ser identicas) y para la referencia nocturna M5.
#
# CRITERIO: pre-registrado ANTES de correr, en experiments/_s151_ab_diurno/PREREGISTRO.md.
# NO OPERACIONAL: data_subdir aislado (A47), fuera del cron NRT, nunca se commitea a data/.
extends: mirova_equivalent
profile: _s151_ab_diurno_control
description: >
  Control del A/B diurno: flags identicos a mirova_equivalent (enable_daytime_viirs en false).

output:
  data_subdir: _s151_ab_diurno_control

# S153, ADOPCION DE K (regla experiments/_s151_prereg_fk_11/REGLA_ADOPCION.md, #848): la replica apago el
# Test 1 integrado y encendio la conectiva max y la banda 22. Este perfil hereda de mirova_equivalent y su
# significado era la produccion de ANTES de K mas su propio cambio, asi que congela aca esos flags con el valor
# previo (como experimental.yaml en S150) para resolver igual que antes de la adopcion. Lo vigila
# tests/test_guard_perfiles_congelados_s153.py.
paths:
  enable_test1_path: true
  enable_tests_23_prose_branch: false

# S153 (K): banda 21 primaria congelada; el porque esta en el comentario S153 de `paths:`.
enable_modis_b22_primary: false
