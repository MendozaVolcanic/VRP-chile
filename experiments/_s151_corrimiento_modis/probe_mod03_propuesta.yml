# PROPUESTA, NO DESPACHADA. Para correrla hay que copiarla a .github/workflows/ en un PR aprobado.
# Baja 4 pares MxD021KM + MxD03 de Lascar (unos 4 x 40 MB) y compara las dos geolocalizaciones.
# Autentica SOLO por token (A71; el par usuario y clave de los secretos esta vencido, ver CLAUDE.md).
# No hace push: el resultado queda como artefacto.
name: probe-mod03-corrimiento

"on":
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf earthaccess numpy scipy pyyaml
      - name: Probe
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then echo "EARTHDATA_TOKEN vacio"; exit 1; fi
          set -o pipefail
          python experiments/_s151_corrimiento_modis/probe_mod03.py --out probe_out 2>&1 | tee probe_out.log
      - uses: actions/upload-artifact@v4
        with:
          name: probe-mod03
          path: |
            probe_out/probe_mod03.json
            probe_out.log
