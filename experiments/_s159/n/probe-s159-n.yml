name: "Probe S159 N, brazos K C F FC y oraculo de MIROVA sobre granulos VIIRS 750 (solo lectura)"

# Frente N de S159 (escala del fondo y la suma del codigo de MIROVA). Diseno, brazos y controles:
# experiments/_s159/n/probe_n.py; criterio: experiments/_s159/n/PREREGISTRO_N.md (commiteado antes de este disparo).
# Solo lectura: no escribe en data/, no commitea, no hace push; el resultado queda como artefacto.
# Se dispara con un push a la rama s159-n-disparo (workflow_dispatch solo existe desde main, S73). La rama no se mergea.
# Copia de experiments/_s159/n/probe-s159-n.yml.
# A43: "on" entre comillas. S141: pipefail con tee; el script sale 2 si falta una pasada.
# A71: autentica SOLO por EARTHDATA_TOKEN y falla al instante si viene vacio (el par usuario y clave esta vencido).
# A15: R2 tardo ~17 s por pasada con un brazo; aca 5 brazos + 6 variantes del oraculo, ~60 s por pasada estimados;
# ~50 pasadas por trozo -> ~50 min; timeout 120 (mayor que 1,3 x estimado, bajo 6 h).
"on":
  push:
    branches: ["s159-n-disparo"]

concurrency:
  group: probe-s159-n
  cancel-in-progress: false

env:
  SOLO: ""
  NCHUNKS: "8"
  OBJETIVOS: "experiments/_s159/n/objetivos_n.json"

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Token presente
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then echo "EARTHDATA_TOKEN vacio: no se corre (A71)"; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml pyproj pandas
      - name: Probe
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          VRP_PROFILE: mirova_equivalent
          VRP_TMP_DIR: ${{ runner.temp }}/vrp_tmp
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/_s159/n/probe_n.py --objetivos "$OBJETIVOS" --out out \
            --chunk ${{ matrix.chunk }} --nchunks "$NCHUNKS" --solo "$SOLO" 2>&1 | tee out/probe_${{ matrix.chunk }}.log
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s159-n-chunk-${{ matrix.chunk }}
          path: |
            out/*.json
            out/*.npz
            out/*.log
          retention-days: 30
          if-no-files-found: error
