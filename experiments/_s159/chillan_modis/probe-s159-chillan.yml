name: "Probe S159 Chillan MODIS, por que el primer pase no marca el crater a 58 grados (solo lectura)"

# Copia de experiments/_s159/chillan_modis/probe-s159-chillan.yml. Se dispara con un push a la rama
# s159-chillan-disparo (workflow_dispatch solo existe desde main, S73); la rama auxiliar no se mergea.
# Criterio sellado en experiments/_s159/chillan_modis/PREREGISTRO.md antes del primer despacho.
# Solo lectura: no escribe en data/ (store.DATA_DIR va a un temporal), no commitea, no hace push; borra cada HDF.
# A43: "on" entre comillas. S141: pipefail con tee; el script sale 2 si falta un granulo.
# A71: autentica SOLO por EARTHDATA_TOKEN y falla al instante si viene vacio (el par usuario y clave esta vencido).
# A15: 7 granulos L1B, 2 corridas de calculate_vrp cada uno (~2 a 4 min por granulo estimados); timeout 45.
"on":
  push:
    branches: ["s159-chillan-disparo"]

concurrency:
  group: probe-s159-chillan
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Token presente
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then echo "EARTHDATA_TOKEN vacio: no se corre (A71)"; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libhdf4-dev
          pip install pyhdf
          pip install earthaccess numpy h5py scipy pyyaml pyproj pandas
      - name: Prueba sintetica de la replica
        env:
          VRP_PROFILE: mirova_equivalent
        run: |
          set -o pipefail
          mkdir -p out
          python experiments/_s159/chillan_modis/probar_replica.py | tee out/prueba_sintetica.txt
      - name: Probe
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          VRP_PROFILE: mirova_equivalent
          VRP_TMP_DIR: ${{ runner.temp }}/vrp_tmp
        run: |
          set -o pipefail
          python experiments/_s159/chillan_modis/probe_chillan.py --out out 2>&1 | tee out/probe.log
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s159-chillan
          path: |
            out/*.jsonl
            out/*.log
            out/*.txt
          retention-days: 30
          if-no-files-found: error
